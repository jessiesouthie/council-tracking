                <div>Total property tax</div>
                <div class="levy-bar-wrap">
                  <span class="levy-track"></span>
                  <span class="mono levy-rate levy-rate-total">${rate6(total)}</span>
                </div>
                <div class="mono levy-share">100%</div>
                <div class="mono levy-amt" data-billrate="${attrRate(total)}"></div>
              </div>
            </figure>

            <div class="note">
              <b>${isAdopted(tax) ? "With the rate the council adopted" : "If the city's proposal passes"}</b>
              <p>
                Your whole bill goes from
                <strong><span data-billrate="${attrRate(total)}"></span></strong> to
                <strong><span data-billrate="${attrRate(propTotal)}"></span></strong> — up
                ${pct1(((propTotal - total) / total) * 100)} — and the city moves from the
                ${ordinal(cityPos)}-largest line on it to the ${ordinal(propPos)}-largest.
              </p>
              <p class="note-fine">Every other entity held at its ${bill.rate_year} rate; none has set a
                ${bill.rate_year + 1} rate yet.</p>
            </div>

            ${
              /* The table carries what the compact rows can't: what each entity
                 actually does with the money. It is also what the export toolbar
                 hangs off, so the numbers can be taken away as CSV. */ ""
            }
            <details class="tableview">
              <summary>See what each one pays for</summary>
              <div class="tablewrap">
                <table class="data bill" id="bill-breakdown">
                  <thead>
                    <tr>
                      <th scope="col">Who taxes your home</th>
                      <th scope="col" class="num">${bill.rate_year} rate</th>
                      <th scope="col" class="num">Share</th>
                      <th scope="col" class="num" data-billnoun="head"></th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rows}
                    <tr class="is-total">
                      <td class="rowlabel"><b>Total property tax</b></td>
                      <td class="num">${rate6(total)}</td>
                      <td class="num">100%</td>
                      <td class="num" data-billrate="${attrRate(total)}"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </details>

            ${finePrint(
              "About these numbers",
              `<ul>
                ${bill.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}
                <li>${CT.escapeHtml(bill.tax_area.note)}
                  <ul>
                    ${bill.variants
                      .map((v) => `<li><b>${CT.escapeHtml(v.name)}</b> — ${CT.escapeHtml(v.note)}</li>`)
                      .join("")}
                  </ul>
                </li>
              </ul>
              <p class="src">
                Rates: <a href="${bill.source.url}" rel="nofollow noopener">${CT.escapeHtml(bill.source.title)}</a>,
                ${CT.escapeHtml(bill.source.publisher)} — ${CT.escapeHtml(bill.source.page)},
                published ${CT.fmtDate(bill.source.published)}.
              </p>`
            )}
          </section>`;
      }

      /* The estimator drives this panel's dollar figures. Everything carrying a
         `data-billrate` is a rate times the taxable value; everything carrying
         `data-billnoun` is the phrase describing the property those figures are
         about. Nothing structural is rewritten, so the export toolbar attached
         under the table survives every update and exports what is on screen. */
      let BILL_SYNC = null;

      function wireBillPanel(bill) {
        const root = document.getElementById("s-bill");
        if (!root) return;
        const figs = [...root.querySelectorAll("[data-billrate]")];
        const nouns = [...root.querySelectorAll("[data-billnoun]")];

        BILL_SYNC = (marketValue, isPrimary) => {
          const taxable = marketValue * (isPrimary ? bill.residential_ratio : 1);
          figs.forEach((el) => {
            el.textContent = usd(taxable * parseFloat(el.dataset.billrate));
          });
          // A column header has to stay short; a sentence can say the whole
          // thing, including that a non-primary property is taxed on its full
          // value rather than 55% of it.
          nouns.forEach((el) => {
            el.textContent =
              el.dataset.billnoun === "head"
                ? isPrimary
                  ? `On a ${usd0(marketValue)} home`
                  : `On ${usd0(marketValue)} of other property`
                : isPrimary
                  ? `a ${usd0(marketValue)} primary residence`
                  : `a ${usd0(marketValue)} business or rental property`;
          });
        };

        // A first pass at the panel's own default, so the markup is never blank
        // if the estimator hasn't painted yet.
        BILL_SYNC(bill.sample_value, true);
      }

      /* The published documents. The quotes above prove what was said in the
         room; these are the paper the city put out, and every noticed figure on
         this page can be read off one of them. They go last because a reader who
         doubts the arithmetic should end up holding the originals. */
      function docsBlock(docs) {
        if (!docs || !Array.isArray(docs.items) || !docs.items.length) return "";
        const items = docs.items
          .map(
            (d) => `
            <li>
              <a class="doc-title" href="${d.url}" rel="nofollow noopener">${CT.escapeHtml(d.title)}
                <span class="doc-ext" aria-hidden="true">PDF ↗</span></a>
              <span class="doc-meta">${CT.escapeHtml(d.publisher || "")}${d.dated ? " · " + CT.escapeHtml(d.dated) : ""}</span>
              ${d.note ? `<p>${CT.escapeHtml(d.note)}</p>` : ""}
            </li>`
          )
          .join("");
        return `
          <div class="docs">
            <p class="docs-h">The documents</p>
            ${docs.note ? `<p class="docs-lede">${CT.escapeHtml(docs.note)}</p>` : ""}
            <ul class="doclist">${items}</ul>
            ${
              docs.index
                ? `<p class="src">All three are posted on the city's own
                     <a href="${docs.index.url}" rel="nofollow noopener">${CT.escapeHtml(docs.index.title)}</a>
                     page.</p>`
                : ""
            }
          </div>`;
      }

      /* ---------------- the paper trail ----------------
         Two quotes, in the order they happened: the schedule that noticed the
         increase, and the motion that set it. The motion goes first, because it
         is the rate in force and the one every figure above is drawn from. */
      function sourcePanel(tax) {
        const ad = tax.rates.adopted;
        const body = `
          ${
            ad
              ? `<blockquote class="record">
                   <p>“${CT.escapeHtml(ad.motion)}”</p>
                   <footer>
                     The motion adopting the rate — ${CT.escapeHtml(ad.vote)} —
                     <a href="meetings.html?id=${ad.meeting_id}">meeting #${ad.meeting_id}, ${CT.fmtDate(ad.date)}</a>
                   </footer>
                 </blockquote>`
              : ""
          }

          <blockquote class="record">
            <p>“${CT.escapeHtml(tax.source.quote)}”</p>
            <footer>
              ${CT.escapeHtml(tax.source.speaker)}, reading the required tax schedule —
              <a href="meetings.html?id=${tax.source.meeting_id}">meeting #${tax.source.meeting_id}, ${CT.fmtDate(tax.source.date)}</a>
            </footer>
          </blockquote>

          ${
            ad
              ? `<p class="derivation">
                   <strong>How the adopted rate checks out.</strong> ${CT.escapeHtml(ad.derivation)}
                 </p>`
              : ""
          }

          <p class="derivation">
            <strong>How the ${ad ? "noticed" : "proposed"} rate checks out.</strong> ${CT.escapeHtml(tax.rates.proposed.derivation)}
          </p>

          <p class="derivation">
            <strong>Minutes and recording.</strong> ${CT.escapeHtml(tax.source.minutes)}
            Council approved the June 16 minutes on ${CT.fmtDate(tax.source.minutes_approved)}.${
              ad
                ? ` The ${CT.fmtDate(ad.date)} minutes are not published yet, so the motion above is
                    transcribed from that meeting's recording.`
                : ""
            }
          </p>

          ${docsBlock(tax.documents)}`;
        return panel(
          "Where these numbers come from",
          "The quotes on the record, the notice and schedule the city published, and the arithmetic that reproduces both",
          body,
          false,
          "p-source"
        );
      }

      /* ---------------- county comparison charts ----------------
         Two measures (a rate, and a percent change) never share one axis, so
         they are two charts. Each is a single series: every bar the same
         recessive ink, Eagle Mountain lifted out in the accent. The accent /
         neutral pair clears CVD separation in both themes; the proposed
         segment is told apart by texture and a direct label, not a second hue.
      */

      const EM = "Eagle Mountain";
      const rate6 = (r) => r.toFixed(6);
      function ordinal(n) {
        if (n % 100 >= 11 && n % 100 <= 13) return n + "th";
        return n + ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
      }

      /* ---------------- things to consider: fees the charts can't see ----------
         A rate comparison can only see the property tax. Several Utah County
         cities pay for street work with a flat monthly fee on the utility bill
         instead, which is set by resolution, never touches a tax rate, and so
         never appears in a bar. That belongs beside the charts rather than in
         the fine print: a reader comparing rates alone would draw the wrong
         conclusion about what those cities charge a household. */
      const TUF_HOME = 500000;

      function transportFeeHtml(c, ratio) {
        const t = c.transportation_fees;
        if (!t || !Array.isArray(t.cities) || !t.cities.length) return "";

        const taxable = TUF_HOME * ratio;
        const rows = [...t.cities].sort((a, b) => b.monthly - a.monthly);
        const top = rows[0];
        const topAnnual = top.monthly * 12;
        // Eagle Mountain's whole city levy on the same home — the only honest
        // way to say how big a flat fee is next to a rate.
        const emTax = c.eagle_mountain.current_rate * taxable;
        const cmp = topAnnual > emTax ? "more than" : "less than";

        const body = rows
          .map(
            (r) => `
              <tr>
                <th scope="row">${CT.escapeHtml(r.name)}</th>
                <td class="num">${usd(r.monthly)}</td>
                <td class="num">${usd(r.monthly * 12)}</td>
                <td class="num mono">${rate6((r.monthly * 12) / taxable)}</td>
              </tr>`
          )
          .join("");

        return `
          <aside class="consider" aria-labelledby="tuf-title">
            <p class="consider-eyebrow">Things to consider</p>
            <h3 class="consider-h" id="tuf-title">Some cities charge for roads on the utility bill instead</h3>
            <p class="consider-lede">
              These bars are property tax, and only property tax.
              ${cap(numWord(rows.length))} Utah County cities also charge a flat monthly fee
              on the city utility bill and spend it on streets. It is set by resolution rather
              than noticed as a tax increase, and no chart of tax rates can see it.
            </p>
            <table class="tuf-table">
              <caption class="sr-only">
                Monthly transportation utility fees charged on residential utility bills in
                Utah County cities, as of ${CT.fmtDate(t.as_of)}.
              </caption>
              <thead>
                <tr>
                  <th scope="col">City</th>
                  <th scope="col" class="num">Per month</th>
                  <th scope="col" class="num">Per year</th>
                  <th scope="col" class="num">As a tax rate</th>
                </tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
            <p class="consider-foot">
              The last column is what each fee would cost as a property tax rate on a
              ${usd0(TUF_HOME)} primary residence — for scale only, since the fee is flat and
              the same on every home. Eagle Mountain charges no such fee, so its bar is the
              whole of what the city asks a household for; ${CT.escapeHtml(top.name)}'s
              ${usd0(topAnnual)} a year is ${cmp} the ${usd(emTax)} Eagle Mountain's own
              property tax takes from that home today.
            </p>
          </aside>`;
      }

      // The per-city sources and the caveats behind that aside ride along in the
      // chart's own fine print, so the section keeps one place to look for both.
      function transportFeeNotes(c) {
        const t = c.transportation_fees;
        if (!t || !Array.isArray(t.cities) || !t.cities.length) return "";
        const cited = t.cities
          .map(
            (r) =>
              `<a href="${r.source.url}" rel="nofollow noopener">${CT.escapeHtml(r.name)}</a>`
          )
          .join(", ");
        const notes = t.cities
          .map(
            (r) =>
              `<li><b>${CT.escapeHtml(r.name)}</b> — ${CT.escapeHtml(r.label)}, ${usd(r.monthly)} a month. ${CT.escapeHtml(r.note)}</li>`
          )
          .join("");
        return `
          <p class="fine-sub">Fees on the utility bill</p>
          <ul>${t.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}</ul>
          <ul>${notes}</ul>
          <p class="src">
            Utility fees, each from the city's own current fee schedule: ${cited}.
            Eagle Mountain charges none —
            <a href="${t.eagle_mountain.source.url}" rel="nofollow noopener">${CT.escapeHtml(t.eagle_mountain.source.title)}</a>.
            Which cities charge one:
            <a href="${t.list_source.url}" rel="nofollow noopener">${CT.escapeHtml(t.list_source.publisher)}</a>,
            ${CT.fmtDate(t.list_source.published)}.
          </p>`;
      }

      function countySection(c, ratio, tax) {
        const utahN = c.cities.length;
        const sl = c.salt_lake;
        // Both ranks come off the charts' own orderings, not the stored fields.
        const rankNow = cityOrder(c).findIndex((r) => r.name === EM) + 1;
        const rankNew = rankByResulting(c);
        const done = isAdopted(tax);

        const utahNotes = finePrint(
          "About these numbers",
          `<ul>${c.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}</ul>
            <p class="src">
              Rates: <a href="${c.rate_source.url}" rel="nofollow noopener">${CT.escapeHtml(c.rate_source.title)}</a>,
              ${CT.escapeHtml(c.rate_source.publisher)}.
              Proposed increases: <a href="${c.proposal_source.url}" rel="nofollow noopener">${CT.escapeHtml(c.proposal_source.publisher)}</a>,
              reporting the ${c.proposal_year} truth-in-taxation notices.
              ${
                c.county_notice
                  ? `The county's own notice, in full:
                     <a href="${c.county_notice.url}" rel="nofollow noopener">${CT.escapeHtml(c.county_notice.title)}</a>
                     (PDF, ${CT.escapeHtml(c.county_notice.publisher)}).`
                  : ""
              }
            </p>
            ${transportFeeNotes(c)}`
        );

        return `
          <section class="tax-sec reveal" style="--i:4" id="s-compare" aria-labelledby="compare-title">
            <div class="sec-head">
              <p class="eyebrow"><span class="sec-num" aria-hidden="true">02</span>Compared to nearby cities</p>
              <h2 class="sec-h2" id="compare-title">Eagle Mountain charges less than almost everyone</h2>
              <p class="sec-sub">
                Eagle Mountain has the <strong>${ordinal(utahN - rankNow + 1)}-lowest</strong> city rate
                of the ${utahN} in Utah County today. The rate ${done ? "it adopted makes" : "it has proposed would make"}
                it the <strong>${ordinal(rankNew)}-highest</strong>, once every other city's own
                ${c.proposal_year} increase is applied.
              </p>
            </div>

          ${sl ? `<div class="switch-row">
            <p class="switch-label" id="scope-hint">Compare against</p>
            <div class="scope-switch" role="radiogroup" aria-labelledby="scope-hint">
              <button type="button" role="radio" id="scope-utah" data-scope="utah" aria-checked="true" tabindex="0">Utah County</button>
              <button type="button" role="radio" id="scope-slc" data-scope="slc" aria-checked="false" tabindex="-1">Salt Lake County</button>
            </div>
          </div>` : ""}

          <div class="county">
            <div class="scope-panel" data-scope-panel="utah">
              <div class="switch-row">
                <p class="switch-label" id="view-utah">View</p>
                <div class="chart-tabs" role="tablist" aria-labelledby="view-utah">
                  <button role="tab" id="tab-rate" aria-controls="panel-rate" aria-selected="true" tabindex="0">
                    Rate today
                  </button>
                  <button role="tab" id="tab-inc" aria-controls="panel-inc" aria-selected="false" tabindex="-1">
                    ${done ? "With the increases" : "Proposed increase"}
                  </button>
                </div>
              </div>
              <div role="tabpanel" id="panel-rate" aria-labelledby="tab-rate">${rateChartHtml(c)}</div>
              <div role="tabpanel" id="panel-inc" aria-labelledby="tab-inc" hidden>${increaseChartHtml(c)}</div>
              ${transportFeeHtml(c, ratio)}
              ${utahNotes}
            </div>

            ${sl ? `<div class="scope-panel" data-scope-panel="slc" hidden>
              <div class="switch-row">
                <p class="switch-label" id="view-slc">View</p>
                <div class="chart-tabs" role="tablist" aria-labelledby="view-slc">
                  <button role="tab" id="tab-sl-rate" aria-controls="panel-sl-rate" aria-selected="true" tabindex="0">
                    Rate today
                  </button>
                  <button role="tab" id="tab-sl-inc" aria-controls="panel-sl-inc" aria-selected="false" tabindex="-1">
                    Proposed increase
                  </button>
                </div>
              </div>
              <div role="tabpanel" id="panel-sl-rate" aria-labelledby="tab-sl-rate">${saltLakeChartHtml(sl)}</div>
              <div role="tabpanel" id="panel-sl-inc" aria-labelledby="tab-sl-inc" hidden>${saltLakeIncreaseChartHtml(sl)}</div>
              ${saltLakeNotes(sl)}
            </div>` : ""}
          </div>
          </section>`;
      }

      /* --- Salt Lake County: current rates, Eagle Mountain dropped in as a
         dashed out-of-county reference so you can read where it would fall.
         Salt Lake County's metro townships and several cities fund police and
         fire through separate county service areas, so their city-levy bars
         understate what residents pay — flagged with † and spelled out below. */
      function saltLakeChartHtml(sl) {
        const em = sl.eagle_mountain;
        const ref = { name: EM, current_rate: sl.reference.current_rate, isRef: true };
        const rows = [...sl.cities, ref].sort((a, b) => b.current_rate - a.current_rate);
        const max = axisMax(rows.map((r) => r.current_rate));
        // Salt Lake County's own median: Eagle Mountain is a visitor on this
        // chart and must not shift the middle of the county it is measured against.
        const med = medianLine(sl.cities.map((r) => r.current_rate), max, "median");
        let offCount = 0;

        const bars = rows
          .map((r) => {
            const isRef = r.isRef;
            const off = r.current_rate > max;
            if (off) offCount++;
            const frac = Math.min(Math.max(r.current_rate / max, 0.004), 1);
            const ext = r.external_services ? '<span class="ast" aria-hidden="true">†</span>' : "";
            const tip = isRef
              ? `${EM} — ${rate6(r.current_rate)} (Utah County, shown for comparison)`
              : `${r.name} — ${rate6(r.current_rate)}${r.external_services ? " · general city levy only; funds police/fire through separate service areas" : ""}`;
            return `
              <div class="crow ${isRef ? "is-em is-ref" : ""} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(isRef ? EM : r.name)}${ext}</span>
                <span class="ctrack">
                  <span class="cbar ${isRef ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(frac)}"></span>
                  ${med.tick}
                  ${valCell(frac, off, rate6(r.current_rate))}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart">
          <figcaption>
            <h3>City property tax rate, today — Salt Lake County</h3>
            <p>Each city's own general levy. Eagle Mountain is dropped in dashed, as an
               out-of-county reference.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>City levy</span>
            <span class="lg"><i class="sw sw-ref"></i>Eagle Mountain (reference)</span>
            ${MED_LEGEND}
          </div>
          <div class="chart-body">${med.rail}${bars}</div>
          <p class="chart-foot">
            Dashed line: the median Salt Lake County city levy, ${rate6(med.value)} — Eagle Mountain,
            as a visitor here, is left out of it.
            <span aria-hidden="true">†</span> Funds police/fire through separate service districts, not shown
            in these bars.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "City levy"],
            rows.map((r) => [r.isRef ? EM + " (ref.)" : r.name, rate6(r.current_rate)])
          )}
        </figure>`;
      }

      /* --- Salt Lake County chart 2: where the 2026 increases leave each city.
         Same cities, same rate axis as the current-rate chart, re-sorted by the
         rate each would end up at. Solid segment = today's rate; hatched
         segment = the noticed increase on top. Eagle Mountain is kept as the
         same dashed out-of-county reference, at the rate its council adopted —
         these cities' hearings have not happened yet, so it is the one settled
         bar on the chart. */
      function saltLakeIncreaseChartHtml(sl) {
        const em = sl.eagle_mountain;
        const refRate = sl.reference.adopted_rate || sl.reference.proposed_rate;
        const refAdopted = !!sl.reference.adopted_rate;
        const ref = {
          name: EM,
          current_rate: sl.reference.current_rate,
          resulting_rate: refRate,
          isRef: true,
        };
        const resOf = (r) => (r.isRef ? r.resulting_rate : resultingRate(sl, r));
        const all = [...sl.cities, ref];
        const nowRank = new Map(
          [...all].sort((a, b) => b.current_rate - a.current_rate).map((x, i) => [x.name, i + 1])
        );
        const rows = [...all].sort((a, b) => resOf(b) - resOf(a));
        const max = axisMax(rows.map(resOf));
        const med = medianLine(sl.cities.map(resOf), max, "median"); // county only — see chart 1
        const proposing = sl.proposals.length;
        let offCount = 0;
        // Rank Eagle Mountain's proposed rate against everyone's *resulting* rate
        // (each city's own increase applied), so the caption can't drift from the bars.
        const emResRank = rows.findIndex((r) => r.isRef) + 1;

        const bars = rows
          .map((r, i) => {
            const isRef = r.isRef;
            const p = isRef ? null : proposalFor(sl, r.name);
            const res = resOf(r);
            const off = res > max;
            if (off) offCount++;
            const fNow = Math.min(Math.max(r.current_rate / max, 0.004), 1);
            const fRes = Math.min(res / max, 1);
            const hasInc = isRef || !!p;
            const moved = nowRank.get(r.name) - (i + 1);

            const ext = !isRef && r.external_services ? '<span class="ast" aria-hidden="true">†</span>' : "";
            const levy = p && p.levy ? '<span class="ast" aria-hidden="true">‡</span>' : "";

            const tip = isRef
              ? `${EM} — ${rate6(r.current_rate)} → ${rate6(res)}${refAdopted ? ", adopted August 6" : ""} (Utah County, shown for comparison)`
              : p
                ? `${r.name} — ${rate6(r.current_rate)} → ${rate6(res)} (+${p.pct}%, derived rate) · ${p.purpose}`
                : `${r.name} — no increase noticed; holds at ${rate6(r.current_rate)}`;

            return `
              <div class="crow ${isRef ? "is-em is-ref" : ""} ${hasInc ? "" : "no-prop"} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(isRef ? EM : r.name)}${ext}${levy}</span>
                <span class="ctrack">
                  ${hasInc ? `<span class="cbar cprop ${isRef ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(fRes)}"></span>` : ""}
                  <span class="cbar ${isRef ? "cem" : ""} ${off && !hasInc ? "bar-off" : ""}" style="width:${barSpan(fNow)}"></span>
                  ${med.tick}
                  ${valCell(fRes, off, `${rate6(res)}${moved > 0 ? `<span class="cmove up" aria-hidden="true">▲${moved}</span><span class="sr-only"> up ${moved} places</span>` : ""}`)}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart chart--wide-val">
          <figcaption>
            <h3>Where the ${sl.proposal_year} proposals would leave each city — Salt Lake County</h3>
            <p>${proposing} of ${sl.cities.length} cities noticed a ${sl.proposal_year} increase.
               Eagle Mountain is the dashed reference, at
               ${refAdopted ? "the rate it adopted" : "its proposed rate"}.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Rate today</span>
            <span class="lg"><i class="sw sw-prop-neutral"></i>Proposed increase</span>
            <span class="lg"><i class="sw sw-ref"></i>Eagle Mountain (reference)</span>
            ${MED_LEGEND}
          </div>
          <div class="chart-body">${med.rail}${bars}</div>
          <p class="chart-foot">
            Dashed line: the median Salt Lake County rate if every proposal passes, ${rate6(med.value)}.
            <span aria-hidden="true">†</span> Funds police/fire through separate service districts.
            <span aria-hidden="true">‡</span> Dedicated levy, not the general rate.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "Rate today", "Rate if it passes", "Increase", "Purpose"],
            rows.map((r) => {
              const p = r.isRef ? null : proposalFor(sl, r.name);
              return [
                r.isRef ? EM + " (ref.)" : r.name,
                rate6(r.current_rate),
                rate6(resOf(r)),
                r.isRef
                  ? refAdopted
                    ? "adopted (reference)"
                    : "reference"
                  : p
                    ? `+${p.pct}% (${p.rate_source})`
                    : "No increase noticed",
                r.isRef ? "—" : p ? p.purpose : "—",
              ];
            })
          )}
        </figure>`;
      }

      function saltLakeNotes(sl) {
        return finePrint(
          "About these numbers",
          `<ul>${sl.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}</ul>
            <p class="src">
              Rates: <a href="${sl.rate_source.url}" rel="nofollow noopener">${CT.escapeHtml(sl.rate_source.title)}</a>,
              ${CT.escapeHtml(sl.rate_source.publisher)} — ${sl.rate_year} final adopted, city levy only.
              ${sl.proposal_source ? `Proposed increases: <a href="${sl.proposal_source.notice_url || sl.proposal_source.url}" rel="nofollow noopener">Salt Lake County ${sl.proposal_year} truth-in-taxation notices</a> (per-city purposes via <a href="${sl.proposal_source.url}" rel="nofollow noopener">${CT.escapeHtml(sl.proposal_source.publisher)}</a>).` : ""}
            </p>`
        );
      }

      // Both charts list the same cities in the same order, so toggling swaps the
      // values in place instead of reshuffling the rows out from under the reader.
      const cityOrder = (c) => [...c.cities].sort((a, b) => b.current_rate - a.current_rate);
      const proposalFor = (c, name) => c.proposals.find((p) => p.city === name) || null;

      /* --- shared bar geometry ---------------------------------------------
         Linear-interpolated quantile over an ascending array — the same
         definition a spreadsheet's PERCENTILE uses. One implementation for the
         axis's outlier fence, the charts' median line and the statewide quartile
         cuts, so those three can never disagree about where the 75th percentile
         of the same numbers is. */
      function quantileOf(asc, p) {
        const i = (asc.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
        return asc[lo] + (asc[hi] - asc[lo]) * (i - lo);
      }
      const quantile = (values, p) => quantileOf([...values].sort((a, b) => a - b), p);
      const medianOf = (values) => quantile(values, 0.5);

      /* A couple of cities (e.g. Vineyard) levy ~2x everyone else, and left to
         their own devices they stretch the axis so the other two dozen — the
         middle of the pack, where Eagle Mountain lives — collapse into unreadable
         stubs. So the axis maxes out at the top of the *main cluster*, not the
         literal max: anything past the Tukey upper fence (Q3 + 1.5·IQR) is drawn
         to the edge and flagged as running off the top of the scale. When the
         data has no such outlier the fence catches nothing and this is just
         max·1.02, exactly as before. Recomputed per chart so the weekly ingest
         can move the cutoff on its own. */
      function axisMax(values) {
        const v = [...values].sort((a, b) => a - b);
        const q3 = quantileOf(v, 0.75), q1 = quantileOf(v, 0.25);
        const fence = q3 + 1.5 * (q3 - q1);
        const inRange = v.filter((x) => x <= fence);
        return (inRange.length ? inRange[inRange.length - 1] : v[v.length - 1]) * 1.02;
      }
      // Each bar is drawn to a fraction of (track width − label gutter), so the
      // value can ride just past the bar's end without ever overflowing the row.
      const barSpan = (frac) => `calc(${frac.toFixed(4)} * (100% - var(--track-gutter)))`;
      const valCell = (frac, off, inner) =>
        `<span class="cval" style="left:${barSpan(frac)}">${inner}${off ? '<span class="offmark" aria-hidden="true"> ↑</span>' : ""}</span>`;
      const OFF_NOTE = `<span aria-hidden="true">↑</span> Past the top of the scale; exact figure still shown.`;

      /* --- the median line -------------------------------------------------
         Bars sorted high to low answer "who is highest" but never "what is
         normal", so a chart of two dozen cities leaves the reader to eyeball the
         middle. A dashed rule at the median of the values the chart draws gives
         every bar a second reading: above the middle city, or below it.

         It is drawn as a tick inside each row's track rather than as one rule
         laid over the chart, because the geometry underneath it moves — the name
         column and the value gutter are both narrower on a phone — and an
         overlay positioned in page pixels would slide off the bars at the first
         breakpoint. Each tick inherits the track it sits in, so the line stays
         on the number at every width. The label rides in a header rail built
         from the same row grid, for the same reason.

         The rule and its flag are decoration: the figure is also stated in the
         chart's footnote, which is what a screen reader gets. */
      function medianLine(values, max, label) {
        const med = medianOf(values);
        const at = barSpan(Math.min(Math.max(med / max, 0), 1));
        return {
          value: med,
          tick: `<span class="mtick" style="left:${at}" aria-hidden="true"></span>`,
          rail: `
            <div class="crow medrow" aria-hidden="true">
              <span class="cname medname">${CT.escapeHtml(label)}</span>
              <span class="ctrack"><span class="mflag" style="left:${at}">${rate6(med)}</span></span>
            </div>`,
        };
      }
      const MED_LEGEND = `<span class="lg"><i class="sw sw-med"></i>Median</span>`;

      /* --- chart 1: current rate only, no proposal --- */
      function rateChartHtml(c) {
        const rows = cityOrder(c);
        const max = axisMax(rows.map((r) => r.current_rate));
        const med = medianLine(rows.map((r) => r.current_rate), max, "median");
        let offCount = 0;

        const bars = rows
          .map((r) => {
            const isEM = r.name === EM;
            const off = r.current_rate > max;
            if (off) offCount++;
            const frac = Math.min(r.current_rate / max, 1);
            const tip = `${r.name} — ${rate6(r.current_rate)}${r.mostly_other_county ? " (mostly Salt Lake Co.)" : ""}`;
            return `
              <div class="crow ${isEM ? "is-em" : ""} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(r.name)}${r.mostly_other_county ? '<span class="ast" aria-hidden="true">*</span>' : ""}</span>
                <span class="ctrack">
                  <span class="cbar ${isEM ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(frac)}"></span>
                  ${med.tick}
                  ${valCell(frac, off, rate6(r.current_rate))}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart">
          <figcaption>
            <h3>City property tax rate, today</h3>
            <p>Utah County municipalities, city levy only.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Current rate</span>
            <span class="lg"><i class="sw sw-em"></i>Eagle Mountain</span>
            ${MED_LEGEND}
          </div>
          <div class="chart-body">${med.rail}${bars}</div>
          <p class="chart-foot">
            Dashed line: the median Utah County city levy, ${rate6(med.value)} — half of these
            ${rows.length} cities charge more, half less.
            <span aria-hidden="true">*</span> Mostly in Salt Lake County.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(["City", "Current rate"], rows.map((r) => [r.name, rate6(r.current_rate)]))}
        </figure>`;
      }

      /* --- chart 2: where the 2026 increases leave each city ---
         Same 26 cities, same rate axis as chart 1, re-sorted by the rate each
         city would end up at. Solid segment = today's rate; hatched segment =
         the increase on top of it.

         One of the twenty-six is no longer a proposal: Eagle Mountain adopted
         its rate on August 6, and its row says so — in the bar's label, in the
         tooltip and in the table. The other nine are still notices, with
         hearings to come, which is the whole reason the distinction is drawn
         rather than calling them all "proposed".
      */
      const resultingRate = (c, city) => {
        const p = proposalFor(c, city.name);
        return p ? p.resulting_rate : city.current_rate;
      };

      // Where Eagle Mountain lands once every city carries its own 2026 figure —
      // the ranking chart 2 draws, and the one the prose above it quotes.
      const rankByResulting = (c) =>
        [...c.cities]
          .sort((a, b) => resultingRate(c, b) - resultingRate(c, a))
          .findIndex((r) => r.name === EM) + 1;

      function increaseChartHtml(c) {
        const nowRank = new Map(cityOrder(c).map((x, i) => [x.name, i + 1]));
        const rows = [...c.cities].sort((a, b) => resultingRate(c, b) - resultingRate(c, a));
        const max = axisMax(rows.map((r) => resultingRate(c, r)));
        const med = medianLine(rows.map((r) => resultingRate(c, r)), max, "median");
        const proposing = c.proposals.length;
        // The one row that has stopped being a proposal, if there is one.
        const emAdopted = (proposalFor(c, EM) || {}).adopted ? proposalFor(c, EM) : null;
        let offCount = 0;

        const bars = rows
          .map((city, i) => {
            const p = proposalFor(c, city.name);
            const isEM = city.name === EM;
            const res = resultingRate(c, city);
            const off = res > max;
            if (off) offCount++;
            const fNow = Math.min(city.current_rate / max, 1);
            const fRes = Math.min(res / max, 1);
            const moved = nowRank.get(city.name) - (i + 1);

            const mark = p && p.rate_source === "approximate" ? '<span class="ast" aria-hidden="true">‡</span>' : "";
            const levy = p && p.levy ? '<span class="ast" aria-hidden="true">†</span>' : "";

            // "adopted" is a third state beside published and derived: the rate
            // is not an estimate and not a proposal, it is what the council set.
            const rateWord = { published: "published rate", adopted: "adopted August 6" }[p && p.rate_source]
              || (p ? p.rate_source + " rate" : "");
            const tip = p
              ? `${city.name} — ${rate6(city.current_rate)} → ${rate6(res)} (+${p.pct}%, ${rateWord}) · ${p.purpose}`
              : `${city.name} — no increase proposed; holds at ${rate6(city.current_rate)}`;

            return `
              <div class="crow ${isEM ? "is-em" : ""} ${p ? "" : "no-prop"} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                ${/* No pill here: .cname is a fixed, ellipsised column, so a tag
                     on it would truncate the city's name. The adopted row says
                     so in its tooltip, in the foot and in the table instead. */ ""}
                <span class="cname">${CT.escapeHtml(city.name)}${levy}${mark}</span>
                <span class="ctrack">
                  ${p ? `<span class="cbar cprop ${isEM ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(fRes)}"></span>` : ""}
                  <span class="cbar ${isEM ? "cem" : ""} ${off && !p ? "bar-off" : ""}" style="width:${barSpan(fNow)}"></span>
                  ${med.tick}
                  ${valCell(fRes, off, `${rate6(res)}${moved > 0 ? `<span class="cmove up" aria-hidden="true">▲${moved}</span><span class="sr-only"> up ${moved} places</span>` : ""}`)}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart chart--wide-val">
          <figcaption>
            <h3>Where the ${c.proposal_year} increases leave each city</h3>
            <p>${proposing} of ${rows.length} cities have a ${c.proposal_year} increase${
              emAdopted ? ` — Eagle Mountain's adopted, the other ${numWord(proposing - 1)} still notices` : ""
            }. Re-sorted by the rate each ends up at.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Rate today</span>
            <span class="lg"><i class="sw sw-prop-neutral"></i>The increase</span>
            <span class="lg"><i class="sw sw-em"></i>Eagle Mountain</span>
            ${MED_LEGEND}
          </div>
          <div class="chart-body">${med.rail}${bars}</div>
          <p class="chart-foot">
            ${
              emAdopted
                ? `Eagle Mountain's <b>${rate6(emAdopted.resulting_rate)}</b> was adopted on
                   ${CT.fmtDate(emAdopted.adopted_date)}; every other increase here is still a notice,
                   with its own hearing to come. `
                : ""
            }Dashed line: the median rate if every one of them holds, ${rate6(med.value)}.
            ${/* Both marks are conditional: a footnote explaining a symbol that
                 appears nowhere in the chart reads as a missing row. */ ""}
            ${c.proposals.some((p) => p.levy) ? '<span aria-hidden="true">†</span> Dedicated levy, not the general rate.' : ""}
            ${c.proposals.some((p) => p.rate_source === "approximate") ? '<span aria-hidden="true">‡</span> Approximate.' : ""}${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "Rate today", "New rate", "Increase", "Purpose"],
            rows.map((city) => {
              const p = proposalFor(c, city.name);
              return [
                city.name + (p && p.adopted ? " (adopted)" : ""),
                rate6(city.current_rate),
                p ? rate6(p.resulting_rate) : rate6(city.current_rate),
                p ? `+${p.pct}% (${p.rate_source})` : "No increase proposed",
                p ? p.purpose : "—",
              ];
            })
          )}
        </figure>`;
      }

      // Tabs: click, plus Left/Right/Home/End per the WAI-ARIA tabs pattern.
      // Each .chart-tabs group is wired independently — the Utah County and Salt
      // Lake County tablists must not deselect each other's panels.
      function wireChartTabs() {
        document.querySelectorAll(".chart-tabs").forEach((group) => {
          const tabs = [...group.querySelectorAll('[role="tab"]')];
          if (!tabs.length) return;

          const select = (tab) => {
            tabs.forEach((t) => {
              const on = t === tab;
              t.setAttribute("aria-selected", String(on));
              t.tabIndex = on ? 0 : -1;
              const p = document.getElementById(t.getAttribute("aria-controls"));
              p.hidden = !on;
              // A chart that was hidden never scrolled into view, so its bars are
              // still armed at zero width. Draw them now that it is on screen.
              if (on) revealBars(p);
            });
            tab.focus();
          };

          tabs.forEach((tab, i) => {
            tab.addEventListener("click", () => select(tab));
            tab.addEventListener("keydown", (e) => {
              const k = e.key;
              let next = null;
              if (k === "ArrowRight") next = tabs[(i + 1) % tabs.length];
              else if (k === "ArrowLeft") next = tabs[(i - 1 + tabs.length) % tabs.length];
              else if (k === "Home") next = tabs[0];
              else if (k === "End") next = tabs[tabs.length - 1];
              if (next) {
                e.preventDefault();
                select(next);
              }
            });
          });
        });
      }

      // Every chart ships a table view — identity is never carried by color alone.
      function tableView(head, rows) {
        return `
        <details class="tableview">
          <summary>View as table</summary>
          <div class="tablewrap">
            <table class="data">
              <thead><tr>${head.map((h) => `<th scope="col">${CT.escapeHtml(h)}</th>`).join("")}</tr></thead>
              <tbody>${rows
                .map((r) => `<tr>${r.map((cell) => `<td>${CT.escapeHtml(String(cell))}</td>`).join("")}</tr>`)
                .join("")}</tbody>
            </table>
          </div>
        </details>`;
      }

      /* ---------------- table export ----------------
         Every data table on the page — the official schedule, each chart's
         "View as table" fallback, and the statewide rankings — gets a small
         toolbar beneath it to take the numbers away as CSV or onto the
         clipboard. The rendered DOM is the single source, so whatever rows and
         sort order the reader is looking at is exactly what exports. Wired once,
         after render, so it covers tables added by any panel without each panel
         having to opt in. */
      function wireTableExports() {
        document.querySelectorAll("table.data").forEach((table, i) => {
          const anchor = table.closest(".tablewrap") || table;
          const after = anchor.nextElementSibling;
          if (after && after.classList.contains("table-export")) return; // idempotent

          const name = exportName(table, i);
          const bar = document.createElement("div");
          bar.className = "table-export";
          bar.innerHTML = `
            <span class="tx-exp-label">Export</span>
            <button type="button" class="tx-exp-btn" data-act="csv">Download CSV</button>
            <button type="button" class="tx-exp-btn" data-act="copy">Copy</button>
            <span class="tx-exp-note" role="status" aria-live="polite"></span>`;
          anchor.after(bar);

          const note = bar.querySelector(".tx-exp-note");
          let noteTimer = 0;
          const flash = (msg) => {
            note.textContent = msg;
            clearTimeout(noteTimer);
            noteTimer = setTimeout(() => { note.textContent = ""; }, 2500);
          };

          bar.querySelector('[data-act="csv"]').addEventListener("click", () => {
            downloadCsv(tableToCsv(table), name + ".csv");
            flash("Downloaded");
          });
          bar.querySelector('[data-act="copy"]').addEventListener("click", async () => {
            flash((await copyText(tableToCsv(table))) ? "Copied" : "Copy failed");
          });
        });
      }

      // A stable, human-readable filename for the exported table: its own
      // caption or heading, falling back to the panel it lives in.
      function exportName(table, i) {
        const h3 = table.closest("figure")?.querySelector("figcaption h3");
        const summ = table.closest("details.panel")?.querySelector("summary .panel-tt h3");
        const raw = (h3 && h3.textContent) || table.id || (summ && summ.textContent) || `table-${i + 1}`;
        const slug = raw.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
        return "eagle-mountain-" + (slug || "table");
      }

      // A cell's exported text is its visible text minus the decorations that
      // aren't data: sort arrows, rank-move chevrons, the "today/proposed"
      // pill, footnote asterisks, and screen-reader-only spans.
      function cellCsvText(el) {
        const c = el.cloneNode(true);
        // .st-when-m is a phone-only echo of the hearing column; it would land
        // in the export as a second copy of a date the CSV already has.
        c.querySelectorAll(".sarrow, .cmove, .you-pill, .prop-pill, .sr-only, .offmark, .ast, .st-when-m").forEach((n) => n.remove());
        // A cell carrying a figure over its second line stacks them as blocks,
        // which read on screen as two lines and in textContent as one run-on
        // word. Separate them before flattening, or the export says
        // "0.001500from 0.000530".
        c.querySelectorAll(".st-rate, .st-meta").forEach((n) => n.insertAdjacentText("beforebegin", " "));
        return c.textContent.replace(/\s+/g, " ").trim();
      }

      const csvField = (s) => (/[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);

      // What exports is what is on screen: current sort order, and — once the
      // statewide table can be filtered — only the rows that survived the filter.
      // Exporting 253 hidden rows from a table showing three would be a surprise.
      function tableToCsv(table) {
        const line = (tr) => [...tr.querySelectorAll("th,td")].map((c) => csvField(cellCsvText(c))).join(",");
        const lines = [];
        table.querySelectorAll("thead tr").forEach((tr) => lines.push(line(tr)));
        table.querySelectorAll("tbody tr").forEach((tr) => {
          // The percentile dividers are furniture, not rows of data — a spreadsheet
          // wants the 253 cities and their Q column, not three labelled rules.
          if (!tr.hidden && !tr.classList.contains("qdiv")) lines.push(line(tr));
        });
        return lines.join("\r\n");
      }

      function downloadCsv(csv, filename) {
        // A BOM so Excel reads it as UTF-8 (the †/‡ footnote marks survive).
        const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) { /* fall through to the legacy path */ }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch (e) {
          return false;
        }
      }

      /* ---------------- every proposal in the state ----------------
         The county charts answer "how does this compare to my neighbours". This
         answers the question they raise next: is Eagle Mountain's the biggest
         anywhere? Every August the Utah Taxpayers Association collects every
         county's truth-in-taxation notices into one list; this is that list,
         entire, ranked three ways.

         Cities, towns, school districts, water districts and fire districts sit
         in one ranking on purpose. They are the entities levying on the same
         parcel, and a bill does not care which kind sent the notice. The type is
         on every row, and the find box matches it, so a reader who wants only
         the cities can have only the cities.

         Eagle Mountain is the one row that has stopped being a proposal, and it
         is carried at the rate the council actually set on August 6 — the same
         rate the rest of this page is about. The 0.001700 it noticed belongs to
         the record, not to the list: it is in the schedule as read and in the
         timeline, and it is not quoted here. Every other row is still that
         entity's own noticed figure, and the caveats say so, because a hearing
         yet to happen can land lower than the notice that announced it —
         Eagle Mountain's did.
      */
      function stateProposalsPanel(state) {
        const rows = state.notices;
        const N = rows.length;
        const T = state.totals;
        const EMN = state.eagle_mountain.entity;
        const ad = state.eagle_mountain.adopted;
        const src = state.source;

        const pct2 = (v) => v.toFixed(2) + "%";
        const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        // Parsed by hand rather than through Date: "2026-08-13" is UTC midnight,
        // which is August 12 for every reader in Utah.
        const dayOf = (iso) => {
          const [y, m, d] = iso.split("-").map(Number);
          return { y, m, d, label: `${MONTHS[m - 1]} ${d}`, sort: y * 10000 + m * 100 + d };
        };
        const hearingLabel = (n) => `${dayOf(n.hearing.date).label}, ${n.hearing.time}`;

        /* Three things a reader can mean by "the biggest increase", and they
           disagree: the steepest percentage is a small town, the most money is a
           school district, and the heaviest household bill is neither. Rather
           than pick one and call it the ranking, all three are offered and the
           same 79 notices are re-sorted under each. */
        const BASES = [
          {
            key: "pct", label: "Percentage", of: (n) => n.pct, adopted: ad.pct, fmt: pct2,
            title: "The twelve steepest increases proposed in Utah",
            sub: "Each entity's proposed rate against its own certified rate — the percentage on its notice, not a percentage of anyone's bill.",
          },
          {
            key: "home", label: "Per home", of: (n) => n.annual_increase, adopted: ad.annual_increase, fmt: usd,
            title: "The twelve costliest, per household",
            sub: "One year of the increase on an average home in that entity. Each entity picked its own average, so these are typical households, not identical ones.",
          },
          {
            key: "rev", label: "Revenue", of: (n) => n.revenue, adopted: ad.revenue, fmt: usdBig,
            title: "The twelve largest, by money raised",
            sub: "What the increase brings in. The size of the entity drives this column far more than the size of the increase.",
          },
        ];

        /* Every figure this panel draws for a given entity, on a given basis.
           One function, used by the ranking, the bars, the value labels and the
           table alike, so there is exactly one place that knows Eagle Mountain's
           row is the adopted rate rather than the noticed one — and no way for
           the ranking and the number printed on the row to disagree. */
        const valOf = (b, n) => (n.entity === EMN ? b.adopted : b.of(n));
        const rateOf = (n) => (n.entity === EMN ? ad.rate : n.proposed_rate);

        const rankBy = (b) => {
          const list = [...rows]
            .sort((x, y) => valOf(b, y) - valOf(b, x))
            .map((n, i) => ({ n, rank: i + 1 }));
          return { list, emRank: list.find((r) => r.n.entity === EMN).rank };
        };
        const RANKS = new Map(BASES.map((b) => [b.key, rankBy(b)]));

        /* ---- the chart: the top twelve on the chosen basis ----
           79 bars would be the wall the statewide panel already refuses to
           draw, and the tail of this list is entities asking for 1%. Twelve is
           where Eagle Mountain still sits comfortably inside the picture on all
           three bases; the full list is the table underneath. */
        const chartHtml = (b) => {
          const r = RANKS.get(b.key);
          const top = r.list.slice(0, 12);
          // Defensive: if a future year's list pushes Eagle Mountain out of the
          // top twelve, it is added back rather than quietly dropped from its
          // own page.
          if (!top.some((x) => x.n.entity === EMN)) top.push(r.list.find((x) => x.n.entity === EMN));
          const max = axisMax(top.map((x) => valOf(b, x.n)));
          let offCount = 0;

          const bars = top
            .map(({ n }) => {
              const isEM = n.entity === EMN;
              const v = valOf(b, n);
              const off = v > max;
              if (off) offCount++;
              const f = Math.min(Math.max(v / max, 0.004), 1);
              // The levy behind the bar. Ogden Valley City has no certified rate
              // to measure from, so its tip carries the percentage alone.
              const levy = rateOf(n) == null
                ? "no rate published"
                : `${rate6(n.certified_rate)} → ${rate6(rateOf(n))}`;
              const tip = isEM
                ? `${n.entity} — ${b.fmt(v)} · levy ${levy} · adopted August 6 · ${n.type}, ${n.county} County`
                : `${n.entity} — ${b.fmt(v)} · levy ${levy} · ${n.type}, ${n.county} County · hearing ${hearingLabel(n)}`;
              return `
                <div class="crow ${isEM ? "is-em" : ""} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                  <span class="cname">${CT.escapeHtml(n.entity)}</span>
                  <span class="ctrack">
                    <span class="cbar ${isEM ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(f)}"></span>
                    ${valCell(f, off, b.fmt(v))}
                  </span>
                </div>`;
            })
            .join("");

          return `
          <figure class="chart chart--state">
            <figcaption>
              <h4>${CT.escapeHtml(b.title)}</h4>
              <p>${CT.escapeHtml(b.sub)}</p>
            </figcaption>
            <div class="legend">
              <span class="lg"><i class="sw sw-base"></i>Proposed</span>
              <span class="lg"><i class="sw sw-em"></i>Eagle Mountain — adopted</span>
            </div>
            <div class="chart-body">${bars}</div>
            <p class="chart-foot">
              Eagle Mountain's bar is the rate its council set on August 6. Every other bar is a
              proposal, and its hearing has yet to happen or has yet to be recorded here.${offCount ? " " + OFF_NOTE : ""}
            </p>
          </figure>`;
        };

        /* ---- the table: all of them ----
           Every notice, on one row, with all three measures side by side so
           switching the ranking never hides the number a reader came for. Sort
           state is per table, so a reader who sorts by hearing date under one
           basis finds the others as they left them. */
        /* The levy itself, the thing every percentage on this page is a
           percentage *of*: what the entity would charge, over what it charges
           now. Ogden Valley City has neither — it incorporated too recently to
           have a certified rate, and its notice carries a percentage with no
           rates behind it, so the cell says so rather than inventing one. */
        const rateCell = (n) => {
          const r = rateOf(n);
          if (r == null) {
            return `<span class="st-rate">—</span><span class="st-meta">no rate published</span>`;
          }
          return `<span class="st-rate">${rate6(r)}</span>
            <span class="st-meta">from ${rate6(n.certified_rate)}</span>`;
        };

        const trHtml = (n, rank) => {
          const isEM = n.entity === EMN;
          const day = dayOf(n.hearing.date);
          // Eagle Mountain's hearing is behind it, so its second line says what
          // came of it where every other row says when to turn up.
          const when = isEM
            ? ` · adopted ${day.label}`
            : `<span class="st-when-m"> · hearing ${CT.escapeHtml(day.label)}</span>`;
          return `<tr${isEM ? ' class="is-em-row"' : ""} data-rank="${rank}"
              data-name="${CT.escapeHtml(n.entity)}"
              data-search="${CT.escapeHtml(`${n.entity} ${n.county} ${n.type}`.toLowerCase())}"
              data-rate="${rateOf(n) == null ? -1 : rateOf(n)}"
              data-pct="${valOf(BASES[0], n)}" data-home="${valOf(BASES[1], n)}"
              data-rev="${valOf(BASES[2], n)}" data-date="${day.sort}">
            <td class="num">${rank}</td>
            <td>
              <span class="st-name">${CT.escapeHtml(n.entity)}${
                /* A row the compiled list got wrong and the issuing county's own
                   notice settled. Marked rather than silently swapped, because a
                   reader comparing this table against the published list should
                   be able to see where the two part company, and why. */
                n.corrected_from_notice
                  ? `<span class="ast" title="Corrected against the county's own notice — see About these numbers">†</span>`
                  : ""
              }</span>
              <span class="st-meta">${CT.escapeHtml(n.type)} · ${CT.escapeHtml(n.county)} County${
                n.years_in_row > 1 ? ` · ${numWord(n.years_in_row)} years running` : ""
              }${when}</span>
            </td>
            <td class="num">${rateCell(n)}</td>
            <td class="num">${pct2(valOf(BASES[0], n))}</td>
            <td class="num">${usd(valOf(BASES[1], n))}</td>
            <td class="num">${usdBig(valOf(BASES[2], n))}</td>
            <td class="st-when">${CT.escapeHtml(day.label)}<span class="st-meta">${CT.escapeHtml(n.hearing.time)}</span></td>
          </tr>`;
        };

        const th = (key, label, num, first) =>
          `<th scope="col" class="${num ? "num " : ""}sortable" data-key="${key}"
               aria-sort="${first ? "ascending" : "none"}" tabindex="0">${label}<span class="sarrow" aria-hidden="true">${first ? " ▲" : ""}</span></th>`;

        const tableHtml = (b) => `
          <div class="tablewrap statewide-wrap statelist-wrap">
            <table class="data statewide statelist" id="state-${b.key}">
              <thead><tr>
                ${th("rank", "Rank", true, true)}
                ${th("name", "Entity", false, false)}
                ${th("rate", "Tax rate", true, false)}
                ${th("pct", "Increase", true, false)}
                ${th("home", "Per home", true, false)}
                ${th("rev", "Revenue", true, false)}
                ${th("date", "Hearing", false, false)}
              </tr></thead>
              <tbody>${RANKS.get(b.key).list.map(({ n, rank }) => trHtml(n, rank)).join("")}</tbody>
            </table>
          </div>`;

        const rPct = RANKS.get("pct"), rHome = RANKS.get("home"), rRev = RANKS.get("rev");

        const notes = finePrint(
          "About these numbers",
          `<ul>${state.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}</ul>
            <p class="src">
              The list: <a href="${src.url}" rel="nofollow noopener">${CT.escapeHtml(src.title)}</a>,
              ${CT.escapeHtml(src.publisher)}, retrieved ${CT.escapeHtml(src.retrieved)} — compiled from the
              counties' own truth-in-taxation notices and reported by
              <a href="${src.reported_by.url}" rel="nofollow noopener">${CT.escapeHtml(src.reported_by.publisher)}</a>.
              Eagle Mountain's adopted rate comes from the meeting itself:
              <a href="${ad.source.url}">${CT.escapeHtml(ad.source.title)}</a>.
              ${CT.escapeHtml(ad.vote)}. ${CT.escapeHtml(ad.derivation)}
            </p>
            ${
              src.corrections
                ? `<p class="src">
                     Rows marked † were checked against, and corrected to,
                     ${src.corrections.checked_against
                       .map(
                         (d) =>
                           `<a href="${d.url}" rel="nofollow noopener">${CT.escapeHtml(d.title)}</a>
                            (${CT.escapeHtml(d.publisher)}, covering ${CT.escapeHtml(d.covers)})`
                       )
                       .join("; and ")}.
                     ${CT.escapeHtml(src.corrections.note)}
                   </p>`
                : ""
            }`
        );

        const body = `
          <p class="panel-intro">
            ${N} truth-in-taxation notices went out in Utah this year, from ${T.entities} taxing
            entities in ${T.counties} counties, asking for ${usdBig(T.revenue)} between them. Against
            all of them, the <strong>${ad.rate_display}</strong> Eagle Mountain adopted is the
            <strong>${ordinal(rPct.emRank)} steepest</strong> increase in the state by percentage,
            the <strong>${ordinal(rHome.emRank)} heaviest</strong> on an average home, and the
            <strong>${ordinal(rRev.emRank)} largest</strong> by money raised.
          </p>
          <p class="panel-intro st-adopted-note">
            Eagle Mountain's is the one settled row: its council voted on
            <strong>${CT.escapeHtml(dayOf(ad.date).label)}</strong>. Everything else here is still a
            proposal, with hearings running to ${CT.escapeHtml(dayOf(T.hearings_to).label)} — and any
            of them can end lower than the notice that announced it.
          </p>

          <div class="sw-tools">
            <div class="scope-switch basis-switch" role="radiogroup" aria-label="Rank the proposals by">
              ${BASES.map((b, i) => `
                <button type="button" role="radio" data-basis="${b.key}"
                        aria-checked="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${CT.escapeHtml(b.label)}</button>`).join("")}
            </div>
            <div class="sw-find">
              <label class="sr-only" for="st-q">Find an entity</label>
              <span class="sw-find-ico" aria-hidden="true"></span>
              <input type="search" id="st-q" class="sw-q" placeholder="Find an entity, county or type"
                     autocomplete="off" spellcheck="false" aria-describedby="st-count" />
            </div>
          </div>
          <p class="sw-count" id="st-count" role="status" aria-live="polite"></p>
          <p class="sw-empty" id="st-empty" hidden>
            Nothing on the list matches that. Try a county, or a type like “school district”, or
            <button type="button" class="tx-link" id="st-clear">clear the filter</button>.
          </p>

          ${BASES.map((b, i) => `
            <div class="stateview" data-basis-panel="${b.key}"${i ? " hidden" : ""}>
              ${chartHtml(b)}
              ${tableHtml(b)}
            </div>`).join("")}

          <p class="chart-foot">
            Every percentage is measured against that entity's own certified rate, and every dollar
            against that entity's own average home — so the columns rank like with like, but the
            homes underneath them differ. Hearings run
            ${CT.escapeHtml(dayOf(T.hearings_from).label)}–${CT.escapeHtml(dayOf(T.hearings_to).label)};
            a hearing can end in less than was noticed, as Eagle Mountain's did, so the rows below it
            may not be the rates those entities finish the month with.
          </p>
          ${notes}`;

        return panel(
          "Every tax increase proposed in Utah this year",
          `All ${N} truth-in-taxation notices, ranked — and where Eagle Mountain lands on the list`,
          body, false, "p-state-proposals"
        );
      }

      /* ---------------- statewide ranking ----------------
         All 253 Utah municipalities ranked by their own city levy — the same
         city-only measure as the county charts. A single sortable table rather
         than a chart: 253 bars would be a wall, but the reader can sort by rank,
         name, or rate and find any city, with Eagle Mountain's row lit up. */
      function statewidePanel(county, state) {
        const sw = county.statewide;
        const src = county.rate_source;
        const em = sw.eagle_mountain;
        const N = sw.total_cities;

        /* Eagle Mountain's second rate stopped being a proposal on August 6:
           the council noticed 0.001700, took three hours of comment and adopted
           0.001500. The ranking is drawn on what it will actually levy — from
           the vote itself where the statewide dataset loaded, and from this
           file's own adopted_rate where it didn't, so the panel never ranks one
           rate while the rest of the page states another. Only the sentence
           quoting the vote needs the richer record. */
        const swAd = (state && state.eagle_mountain && state.eagle_mountain.adopted) || null;
        const ad = swAd || (em.adopted_rate ? { rate: em.adopted_rate } : null);
        const emNew = ad ? ad.rate : em.proposed_rate;
        const emWord = ad ? "adopted" : "proposed";

        // Every noticed 2026 proposal this site tracks — Utah County and Salt
        // Lake County both — keyed by city name to its resulting rate, the same
        // figure the county charts draw.
        const proposedRate = new Map();
        [...(county.proposals || []), ...((county.salt_lake && county.salt_lake.proposals) || [])]
          .forEach((p) => { if (p.resulting_rate != null) proposedRate.set(p.city, p.resulting_rate); });
        proposedRate.set(EM, emNew);
        const othersCount = proposedRate.size - 1; // proposing cities besides Eagle Mountain

        // Rank high → low: rank 1 is the highest city levy in the state.
        // Current-rate ranking — all cities as they are billed today, highest first.
        const current = [...sw.cities]
          .sort((a, b) => b.rate - a.rate)
          .map((r, i) => ({ name: r.name, rate: r.rate, rank: i + 1 }));
        const curRank = new Map(current.map((r) => [r.name, r.rank]));

        // The second ranking — Eagle Mountain at the rate it adopted, every other
        // tracked city at its proposal's resulting rate, re-ranked highest first.
        // Cities with no noticed 2026 proposal keep today's rate: Utah's other
        // 2026 rates aren't certified until after the August hearings, so only
        // the proposals this site tracks are placed.
        const proposed = sw.cities
          .map((r) => ({ name: r.name, rate: proposedRate.has(r.name) ? proposedRate.get(r.name) : r.rate }))
          .sort((a, b) => b.rate - a.rate)
          .map((r, i) => ({ name: r.name, rate: r.rate, rank: i + 1 }));

        const emCur = current.find((r) => r.name === EM).rank; // counted from the top
        const emProp = proposed.find((r) => r.name === EM).rank; // counted from the top
        const climbed = emCur - emProp; // places gained climbing toward #1
        const emCurLow = N - emCur + 1; // the same current rank, counted from the bottom

        /* ---- percentile groups ----
           A rank out of 253 is a precise answer to a question nobody asked. What
           a reader wants from a list this long is which part of it they are in,
           so the ranking is cut into four equal groups and every row carries its
           own.

           Cut by position rather than by rate, so the four groups come out the
           same size — 253 doesn't divide by four, so they run 63/64/63/63 — and
           each boundary falls between two rows, where a line can be drawn and
           labelled. The cost is that cities tied at a boundary rate can land on
           either side of it; the footnote says so.

           Labelled in percentiles, never as "Q1"–"Q4": on a page about tax years
           and budget cycles, a Q-number reads as a quarter of the calendar, and
           the statistical convention runs the other way anyway (the "first
           quartile" is the lowest 25%). Group 1 here is the highest-rate 25%, so
           every label says top/bottom or names the percentile band outright. */
        const cutsFor = (n) => [1, 2, 3].map((k) => Math.round((n * k) / 4)); // last rank in group 1, 2, 3
        const quartileOf = (rank, cuts) => (rank <= cuts[0] ? 1 : rank <= cuts[1] ? 2 : rank <= cuts[2] ? 3 : 4);
        // Three registers for the same four groups: a heading, a chip short
        // enough for a table cell, and a form that can sit inside a sentence.
        const QWHAT = { 1: "Highest rates", 2: "Above the middle", 3: "Below the middle", 4: "Lowest rates" };
        const QCHIP = { 1: "Top 25%", 2: "51–75th", 3: "26–50th", 4: "Bottom 25%" };
        const QBAND = {
          1: "the top 25% of Utah cities",
          2: "the 51st–75th percentile",
          3: "the 26th–50th percentile",
          4: "the bottom 25% of Utah cities",
        };

        // Everything the strip, the dividers and the summary sentence need about
        // one ranking, read off that ranking once — so no two of them can end up
        // describing a different table.
        const readingOf = (list) => {
          const n = list.length;
          const cuts = cutsFor(n);
          const rates = list.map((r) => r.rate);
          const emRow = list.find((r) => r.name === EM);
          const bands = [1, 2, 3, 4].map((q) => {
            const rows = list.filter((r) => quartileOf(r.rank, cuts) === q);
            return {
              q,
              n: rows.length,
              hi: rows[0].rate,
              lo: rows[rows.length - 1].rate,
              hasEM: rows.some((r) => r.name === EM),
            };
          });
          return {
            cuts, bands, em: emRow,
            emQ: quartileOf(emRow.rank, cuts),
            median: quantile(rates, 0.5),
            p25: quantile(rates, 0.25),
            p75: quantile(rates, 0.75),
            // The percentile a reader means by "where does mine sit": the share
            // of the other cities levying less than this one.
            emPct: Math.round(((n - emRow.rank) / (n - 1)) * 100),
          };
        };
        const readCur = readingOf(current);
        const readProp = readingOf(proposed);

        // The three lines drawn through the table. The middle one is the median —
        // the single figure that says what a normal Utah city charges.
        const dividersFor = (rd) => [
          { after: rd.cuts[0], cls: "", label: "75th percentile · a quarter of Utah's cities are above this line", value: rd.p75 },
          { after: rd.cuts[1], cls: " is-median", label: "The middle · half of Utah's cities are above this line", value: rd.median },
          { after: rd.cuts[2], cls: "", label: "25th percentile · a quarter of Utah's cities are below this line", value: rd.p25 },
        ];

        const dividerHtml = (d) => `
          <tr class="qdiv${d.cls}" data-after="${d.after}">
            <td colspan="4">
              <span class="qdiv-l">${d.label}</span>
              <span class="qdiv-v">${rate6(d.value)}</span>
            </td>
          </tr>`;

        const rowHtml = (r, rd, view) => {
          const isEM = r.name === EM;
          const q = quartileOf(r.rank, rd.cuts);
          const hasProp = view === "proposed" && proposedRate.has(r.name);
          const moved = hasProp ? curRank.get(r.name) - r.rank : 0; // places climbed
          const movedHtml =
            moved > 0
              ? ` <span class="cmove up" title="up ${moved} places">▲${moved}</span>`
              : "";
          const tag = isEM
            ? ` <span class="you-pill">${view === "proposed" ? emWord : "today"}</span>`
            : hasProp
              ? ` <span class="prop-pill" title="Noticed 2026 increase applied">proposed</span>`
              : "";
          return `<tr${isEM ? ' class="is-em-row"' : ""} data-rank="${r.rank}" data-rate="${r.rate}" data-q="${q}" data-name="${CT.escapeHtml(r.name)}">
            <td class="num qlead q${q}">${r.rank}</td>
            <td>${CT.escapeHtml(r.name)}${tag}</td>
            <td class="num">${rate6(r.rate)}${movedHtml}</td>
            <td class="qcell"><span class="qchip q${q}" title="${QWHAT[q]} — ${QBAND[q]}">${QCHIP[q]}</span></td>
          </tr>`;
        };

        // Dividers are spliced into the rank-ordered rows from the bottom up, so
        // each insertion leaves the indices above it alone.
        const rowsHtml = (list, rd, view) => {
          const out = list.map((r) => rowHtml(r, rd, view));
          [...dividersFor(rd)].reverse().forEach((d) => out.splice(d.after, 0, dividerHtml(d)));
          return out.join("");
        };

        // The four groups as buttons: what each covers, how many cities are in
        // it, which one Eagle Mountain is in — and, pressed, it filters the
        // ranking down to that group alone.
        const stripHtml = (rd) => `
          <p class="qsum">
            The middle Utah city levies <b>${rate6(rd.median)}</b>. Eagle Mountain's
            <b>${rate6(rd.em.rate)}</b> is higher than <b>${rd.emPct}%</b> of the ${N}
            cities — putting it in <b class="q-in q${rd.emQ}">${QBAND[rd.emQ]}</b> by rate.
          </p>
          <div class="qstrip" role="group" aria-label="Percentile groups. Choosing one filters the table below.">
            ${rd.bands
              .map(
                (b) => `
              <button type="button" class="qseg q${b.q}${b.hasEM ? " has-em" : ""}" data-q="${b.q}"
                      aria-pressed="false" title="Show only ${QBAND[b.q]}">
                <span class="qseg-head"><span class="qchip q${b.q}">${QCHIP[b.q]}</span>${QWHAT[b.q]}</span>
                <span class="qseg-range">${rate6(b.lo)} – ${rate6(b.hi)}</span>
                <span class="qseg-n">${b.n} cities${b.hasEM ? ' · <span class="qseg-em">Eagle Mountain</span>' : ""}</span>
              </button>`
              )
              .join("")}
          </div>`;

        const tableHtml = (id, list, rd, view) => `
          <div class="tablewrap statewide-wrap">
            <table class="data statewide" id="${id}">
              <thead><tr>
                <th scope="col" class="num sortable" data-key="rank" aria-sort="ascending" tabindex="0">Rank<span class="sarrow" aria-hidden="true"> ▲</span></th>
                <th scope="col" class="sortable" data-key="name" aria-sort="none" tabindex="0">City<span class="sarrow" aria-hidden="true"></span></th>
                <th scope="col" class="num sortable" data-key="rate" aria-sort="none" tabindex="0">City levy<span class="sarrow" aria-hidden="true"></span></th>
                <th scope="col" class="sortable" data-key="q" aria-sort="none" tabindex="0">Percentile<span class="sarrow" aria-hidden="true"></span></th>
              </tr></thead>
              <tbody>${rowsHtml(list, rd, view)}</tbody>
            </table>
          </div>`;

        const body = `
          <p class="panel-intro">
            All ${N} Utah cities by their own levy, highest first, split into four
            equal groups by percentile. Eagle Mountain is <strong>${ordinal(emCur)}</strong>
            today — in ${QBAND[readCur.emQ]} — and is
            <strong>${ordinal(emProp)}</strong> at the ${rate6(emNew)} it
            ${ad ? "adopted on August 6" : "has proposed"}, a climb of ${climbed} places
            into ${QBAND[readProp.emQ]}.
          </p>

          <div class="sw-tools">
            <div class="scope-switch stateview-switch" role="radiogroup" aria-label="Which rate to rank by">
              <button type="button" role="radio" id="sv-current" data-view="current" aria-checked="true" tabindex="0">Rate today</button>
              <button type="button" role="radio" id="sv-proposed" data-view="proposed" aria-checked="false" tabindex="-1">${
                ad ? "With the adopted rate" : "With 2026 proposals"
              }</button>
            </div>
            <!-- ${N} rows is past the point where scrolling is a way to find
                 anything. Sorting answers "who is highest"; this answers the
                 question most people actually arrive with, which is "where is
                 mine". Filters both rankings at once so switching between them
                 keeps the same city in view. -->
            <div class="sw-find">
              <label class="sr-only" for="sw-q">Find a city</label>
              <span class="sw-find-ico" aria-hidden="true"></span>
              <input type="search" id="sw-q" class="sw-q" placeholder="Find a city" autocomplete="off"
                     spellcheck="false" aria-describedby="sw-count" />
            </div>
          </div>
          <p class="sw-count" id="sw-count" role="status" aria-live="polite"></p>

          <p class="sw-empty" id="sw-empty" hidden>
            No Utah city or town matches that. Check the spelling, or
            <button type="button" class="tx-link" id="sw-clear">clear the filter</button>.
          </p>

          <div class="stateview" data-view-panel="current">
