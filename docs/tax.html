      <!-- The page is built from three fetches, so it can't render on first
           paint. Rather than a blank column that snaps to full height when the
           data lands, ship the shape of the page as static markup: a heading
           block and the estimator card at roughly their real sizes. It holds the
           scroll position steady (no layout shift) and tells the reader what is
           coming. render() replaces the whole thing. -->
      <div id="content" aria-busy="true">
        <!-- Without the .no-js rule in site.css hiding the skeleton, an
             unscripted browser would get this explanation *and* a skeleton
             shimmering underneath it forever. -->
        <noscript>
          <div class="tax-page">
            <!-- The heading here names the page, not the failure. This block is
                 what a reader without JavaScript gets — and what a crawler that
                 doesn't execute any reads as the page's H1 — so "The estimator
                 needs JavaScript" was the site telling Google that a script
                 requirement is the subject of the page. The missing estimator is
                 now the second sentence, where it belongs. -->
            <div class="tax-fail">
              <p class="eyebrow">Eagle Mountain &middot; Property tax</p>
              <h1 class="tax-h1">Eagle Mountain&rsquo;s property tax increase, and what it costs you</h1>
              <p class="tax-lede">The estimator that works your own household&rsquo;s figure out needs
                JavaScript. The numbers behind it are public either way: the city's Truth-in-Taxation
                schedule was read into the record on June 16, 2026, and the
                <a href="meetings.html">meeting records</a> carry it in full.</p>
            </div>
          </div>
        </noscript>
        <!-- Inside .tax-page so the placeholder inherits this page's warm ink and
             rules rather than the site's navy — a skeleton in the wrong palette
             announces itself as scaffolding. -->
        <div class="tax-page tax-skeleton" role="status" aria-label="Loading the property tax estimator">
          <span class="sk-line sk-eyebrow"></span>
          <span class="sk-line sk-h1"></span>

    <footer class="footer"><span>Data from Eagle Mountain CivicClerk portal &middot; <a href="about.html">How this site is built</a></span></footer>

    <script src="site.js?v=20260817k"></script>
    <script>
      (async () => {
        const root = document.getElementById("content");
        const grab = (f) =>
          fetch(new URL(f, document.baseURI))
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
        // The county comparison, the full-bill breakdown, the statewide list of
        // proposals and the argument section are nice-to-haves; the page still
        // works without any of them.
        const [tax, county, bill, state, kase] = await Promise.all([
          grab("data.tax.json"),
          grab("data.tax-county.json"),
          grab("data.tax-bill.json"),
          grab("data.tax-state.json"),
          grab("data.tax-case.json"),
        ]);

        root.removeAttribute("aria-busy");

        // A dead end needs a way out of it, not just an explanation. The retry
        // refetches in place rather than reloading the document, so a reader on
        // a flaky connection doesn't lose their scroll position.
        if (!tax) {
          root.innerHTML = `
            <div class="tax-page">
              <div class="tax-fail" role="alert">
                <p class="eyebrow">Couldn't load</p>
                <h1 class="tax-h1">The tax data didn't arrive</h1>
                <p class="tax-lede">This is usually a dropped connection rather than anything wrong
                  with the figures. Try again.</p>
                <p><button type="button" class="tx-btn" id="tax-retry">Try again</button></p>
              </div>
            </div>`;
          document.getElementById("tax-retry").addEventListener("click", (e) => {
            e.target.disabled = true;
            e.target.textContent = "Loading…";
            location.reload();
          });
          return;
        }

        // The estimator only describes the City Council's levy. Other bodies
        // on this site don't set a property tax rate, so say so rather than
        // showing council numbers under a planning-commission heading.
        if (CT.currentBody() !== tax.body) {
          root.innerHTML = `
            <div class="tax-page">
              <div class="tax-fail">
                <p class="eyebrow">Not this body</p>
                <h1 class="tax-h1">Only the City Council sets a property tax rate</h1>
                <p class="tax-lede">Switch the body picker in the header back to City Council to use
                  the estimator.</p>
              </div>
            </div>`;
          return;
        }

        render(tax, county, bill, state, kase, root);
      })();

      const usd = (n) =>
        "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const usd0 = (n) => "$" + Math.round(n).toLocaleString("en-US");
      // Citywide assessed value runs to ten figures; nobody reads it digit by
      // digit, and the point of quoting it is the order of magnitude.
      const usdBig = (n) =>
        n >= 1e9 ? "$" + (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? "$" + (n / 1e6).toFixed(1) + "M" : usd0(n);
      const commas = (n) => n.toLocaleString("en-US");
      const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
      // Small counts read as words in prose ("a bill with seven"); anything
      // past ten stays a numeral, as does every figure in a table or a chart.
      const NUM_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
      const numWord = (n) => NUM_WORDS[n] || String(n);

      /* =========================================================================
         The page reads as one continuous argument, in the order a resident would
         ask it: what would this cost me (the tool), how big is it (three facts),
         where does it sit on my actual bill (all seven levies), and where would
         the rate land against everyone else (the county charts). Those run flat,
         one after another, with nothing to open.

         What follows them is reference material — the six-line schedule as read,
         all 253 Utah cities, the paper trail, the meeting-by-meeting record. Real
         and sourced, but not what anyone came for, so it waits in collapsible
         panels rather than adding four screens to the scroll.
         ========================================================================= */

      function render(tax, county, bill, state, kase, root) {
        const CURRENT = tax.rates.current.rate;
        const NEWRATE = newRate(tax).rate;
        const RATIO = tax.residential_ratio;

        root.innerHTML = `
          <div class="tax-page">
            <header class="tax-hero reveal">
              ${statusHtml(tax)}
              <h1 class="tax-h1">Eagle Mountain ${isAdopted(tax) ? "is raising" : "wants to raise"} your property tax</h1>
              ${ledeHtml(tax)}
              ${nextHearingHtml(tax)}
            </header>

            ${estimatorHtml(tax)}

            ${takeawayHtml(tax, county)}

            ${bill ? billSection(bill, tax) : ""}

            ${county ? countySection(county, RATIO, tax) : ""}

            ${kase ? caseSection(kase) : ""}

            <section class="learn reveal" style="--i:6" aria-labelledby="learn-title">
              <div class="sec-head">
                <p class="eyebrow"><span class="sec-num" aria-hidden="true">04</span>The record</p>
                <h2 class="sec-h2" id="learn-title">Where all of this comes from</h2>
                <p class="sec-sub">Open any of these for the detail behind the numbers.</p>
              </div>
              ${pictureNavHtml(county, state)}
              ${schedulePanel(tax)}
              ${state ? stateProposalsPanel(state) : ""}
              ${county && county.statewide ? statewidePanel(county, state) : ""}
              ${sourcePanel(tax)}
              ${recordPanel(tax)}
            </section>
          </div>
        `;

        measureTopbar();
        // Wired before the estimator, so the estimator's first paint already
        // finds the bill breakdown and syncs its dollar figures to it.
        if (bill) wireBillPanel(bill);
        wireEstimator({ CURRENT, NEWRATE, RATIO, tax });
        wireMeasures();
        wirePictureNav();
        wireTableExports();
        if (county) {
          wireCountySwitch();
          wireChartTabs();
          wireSortableTable("#p-statewide table.data.statewide");
          wireStatewideView();
          wireStatewideFilter();
        }
        if (state) {
          wireSortableTable("#p-state-proposals table.data.statelist");
          wireStateBasis();
          wireStateFilter();
        }
        // Tooltips are wired across every chart row on the page, so the bill
        // breakdown keeps them even on a load where the county data didn't come.
        if (county || bill || state) { wireChartTooltips(); wireBarReveal(); }
      }

      /* ---------------- hero ---------------- */

      /* ---------------- which rate the page is about ----------------
         The council noticed 0.001700 and adopted 0.001500 on August 6, and the
         page has to speak with one voice about which of those a reader is
         looking at. Everything that describes what the city will actually
         charge reads `newRate(tax)`; the noticed rate is quoted by name, only
         where the record is the point — the schedule as read, the timeline, the
         statewide list that ranks every entity on what it noticed.

         Written as a fallback rather than a constant so a future year's data,
         which will start life with a proposal and no adopted rate, renders as a
         proposal without a code change — `isAdopted` is what switches the
         page's tense. */
      const newRate = (tax) => tax.rates.adopted || tax.rates.proposed;
      const isAdopted = (tax) => !!tax.rates.adopted;
      // Where the citywide collections figure beside the rate comes from. The
      // noticed one was printed on the schedule; the adopted one is the motion's
      // own increase carried through that schedule, so it doesn't claim to have
      // been published.
      const revNote = (tax) =>
        isAdopted(tax)
          ? "The motion's own increase, carried through the city's schedule."
          : "From the city's published schedule.";

      /* The sentence under the headline. Before August 6 it had a vote to point
         at; now the vote has happened, so it says what was set, and the rate
         the city noticed and did not adopt is left to the record below. */
      function ledeHtml(tax) {
        const nw = newRate(tax);
        if (!isAdopted(tax))
          return `
            <p class="tax-lede">
              Enter what your home is worth and see what it would cost you.
              Nothing is final — the council still has to vote.
            </p>`;
        return `
          <p class="tax-lede">
            On ${CT.fmtDate(nw.date)} the council set the rate at
            <strong>${CT.escapeHtml(nw.rate_display)}</strong>. Enter what your home is
            worth and see what it costs you.
          </p>`;
      }

      // The eyebrow over the headline: what stage this is at, and for which year.
      function statusHtml(tax) {
        const fy = tax.fiscal_year.replace("-", "–");
        // The dot pings while the number can still move. Once the rate is set
        // it stops: a pulse beside "Adopted" would read as something still
        // happening.
        return `
          <p class="eyebrow">
            <span class="tax-status-dot${isAdopted(tax) ? " is-done" : ""}" aria-hidden="true"></span>
            ${CT.escapeHtml(cap(tax.status))} · FY ${CT.escapeHtml(fy)}
          </p>`;
      }

      // The one fact a reader can still act on: nothing is settled, and there is a
      // date. Counts down from today, and disappears once both hearings are past.
      function nextHearingHtml(tax) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const asDate = (m) => new Date(m.date + "T12:00:00");
        const next = tax.meetings
          .filter((m) => m.upcoming && asDate(m) >= today)
          .sort((a, b) => (a.date < b.date ? -1 : 1))[0];
        if (!next) return "";

        const days = Math.round((asDate(next) - today) / 86400000);
        const when = days <= 0 ? "today" : days === 1 ? "tomorrow" : `in ${days} days`;
        // The one thing a resident can actually do about any of this, so it sits
        // above the estimator rather than below it — but small: a line saying
        // when, and a line saying they are allowed to speak. Most people do not
        // know a budget hearing takes public comment either.
        return `
          <aside class="act">
            <span class="act-pulse" aria-hidden="true"></span>
            <span class="act-body">
              <b class="act-head">${CT.escapeHtml(next.title)} ${when}</b>
              <span class="act-meta">${CT.fmtDate(next.date)} · You can speak before the council votes.</span>
            </span>
          </aside>`;
      }

      /* ---------------- estimator (the hero tool) ---------------- */

      // The default scenario: a $500,000 primary residence at the proposed rate.
      // The markup ships with these figures already filled in rather than a set
      // of hardcoded placeholders that JS overwrites a moment later — a stale
      // number that corrects itself in front of the reader reads as a glitch,
      // and it's the one number this page exists to state.
      const DEFAULT_VALUE = 500000;
      // Where the "some other rate" row opens: a round number between what the
      // city charges today and what it is asking for.
      const DEFAULT_CUSTOM = 0.0011;

      // A percentage typed into the estimator is measured against the rate in
      // effect today, so it matches the dollars the panel prints: a rate 50%
      // higher is a city tax bill 50% higher. One decimal, no trailing zero
      // noise, and never "-0.0".
      const fmtPct = (p) => (Math.abs(p) < 0.05 ? "0.0" : p.toFixed(1));
      // Read aloud rather than typed: past a hundred points the tenth is noise.
      const pctStr = (p) => (Math.abs(p) >= 100 ? Math.round(p).toLocaleString("en-US") : fmtPct(p));
      // A true minus, not a hyphen: these sit beside tabular figures.
      const signed = (p) => (p < -0.05 ? "−" : "+") + pctStr(Math.abs(p));

      // The one thing a reader has to be told about the percent field, because
      // the number most of them arrived with — the 183.02% in the motion, or
      // the 220.88% on the notice before it — is measured against a different
      // rate than the one they pay.
      function basisNote(tax) {
        const cur = tax.rates.current;
        const nw = newRate(tax);
        const cert = tax.rates.certified_2026;
        const overToday = fmtPct((nw.rate / cur.rate - 1) * 100);
        const base = `Percentages here are measured against the
          ${cur.rate.toFixed(6)} you pay today, the way the increase was read on June 16.`;
        if (!cert) return base;
        // A rate whose headline percentage is a ratio of revenue rather than of
        // rates carries `pct_rate_basis`; saying it "is measured against the
        // certified rate" would be wrong for those, and the noticed 220.88% is
        // one of them.
        return nw.pct_rate_basis
          ? `${base} The ${isAdopted(tax) ? "adopted" : "noticed"} +${nw.pct}% is the notice's own
             figure — a rise in revenue, not in the rate. The same rate is +${overToday}% against
             today's, and +${nw.pct_rate_basis}% against the
             ${CT.escapeHtml(cert.rate_display)} certified rate.`
          : `${base} The ${isAdopted(tax) ? "adopted" : "noticed"} +${nw.pct}% is measured
             against the ${CT.escapeHtml(cert.rate_display)} certified rate instead — the same rate is
             +${overToday}% against today's.`;
      }

      // What a rate raises across the whole city. The city's own schedule gives
      // two points; a rate nobody has published is priced off the taxable value
      // behind the rate the council set, which is the base a rate applies to.
      function cityBase(tax) {
        const nw = newRate(tax);
        return nw.revenue && nw.rate ? nw.revenue / nw.rate : 0;
      }

      function estimatorHtml(tax) {
        const cur = tax.rates.current;
        const nw = newRate(tax);
        const taxable = DEFAULT_VALUE * tax.residential_ratio;
        const now = taxable * cur.rate;
        const sel = taxable * nw.rate;
        const diff = sel - now;
        const hasRevenue = !!(cur.revenue && nw.revenue);
        return `
        <section class="estimator reveal" style="--i:1" id="estimate" aria-label="Property tax estimator">
          <div class="tax-tool">
            <div class="est-ask">
              <label class="ask-q" for="mv">What is your home worth?</label>
              <div class="valuerow">
                <span class="dollar" aria-hidden="true">$</span>
                <input class="value" id="mv" type="text" inputmode="numeric" value="${commas(DEFAULT_VALUE)}" aria-describedby="mv-help" />
              </div>
              <input type="range" id="mv-range" min="100000" max="3000000" step="5000" value="${DEFAULT_VALUE}" aria-label="What your home is worth" />
              <div class="rangeends" id="mv-help"><span>$100k</span><span>$3M</span></div>
              <p class="hint" id="ratio-note">${ratioNote(true, tax.residential_ratio)}</p>

              <div class="ask-type">
                <span class="flabel" id="lbl-type">This is my</span>
                <div class="seg" role="group" aria-labelledby="lbl-type">
                  <input type="radio" name="ptype" id="pt-home" value="primary" checked />
                  <label for="pt-home">Home I live in</label>
                  <input type="radio" name="ptype" id="pt-biz" value="other" />
                  <label for="pt-biz">Rental or business</label>
                </div>
              </div>
            </div>

            <!-- The answer, in the order a homeowner asks it: how much more,
                 per month, then per year, then the two totals it came from.
                 The rate that produced all of this is not on this panel at all —
                 it means nothing to someone who has never read a tax notice. -->
            <div class="bill-band" id="bill-band">
              <p class="bb-lead" id="res-lead">You would pay about</p>
              <p class="bb-hero mono" id="res-delta-month">${usd(diff / 12)}</p>
              <p class="bb-unit" id="res-delta-unit">more a month</p>
              <p class="bb-year" id="res-delta-text">${usd(diff)} more a year</p>

              <div class="bb-split" id="res-delta">
                <div class="bb-half">
                  <span class="bb-label">Your city tax now</span>
                  <span class="bb-num mono" id="now-year">${usd(now)}</span>
                  <span class="bb-sub">a year · <span id="now-month">${usd(now / 12)}</span> a month</span>
                </div>
                <div class="bb-half bb-new">
                  <span class="bb-label" id="res-scenario">${isAdopted(tax) ? "At the adopted rate" : "If this passes"}</span>
                  <span class="bb-num mono" id="res-total">${usd(sel)}</span>
                  <span class="bb-sub">a year · <span id="res-month">${usd(sel / 12)}</span> a month</span>
                </div>
              </div>

              <!-- The same rate seen from the other end: not what one household
                   pays, but what the whole city collects. It doesn't move with
                   the home value above it — this is every parcel in Eagle
                   Mountain — so it sits apart from the two halves. -->
              ${
                hasRevenue
                  ? `<div class="bb-city" id="bb-city">
                <span class="bb-label">What the city collects</span>
                <span class="bb-city-num mono" id="cw-total">${usd0(nw.revenue)}</span>
                <span class="bb-sub" id="cw-sub">a year · +${pctStr(
                  (nw.revenue / cur.revenue - 1) * 100
                )}% against the ${usd0(cur.revenue)} it collects today</span>
                <span class="bb-note" id="cw-note">${CT.escapeHtml(revNote(tax))}</span>
              </div>`
                  : ""
              }
            </div>

            <div class="est-rates">
              <span class="flabel" id="lbl-rate">Compare against another rate</span>
              <div class="rates" role="radiogroup" aria-labelledby="lbl-rate">
                <div class="rate">
                  <input type="radio" name="rate" id="r-current" value="current" />
                  <label for="r-current">
                    <span class="dot" aria-hidden="true"></span>
                    <span>
                      <span class="rname">What you pay today</span>
                      <span class="rmeta" data-perk="${cur.rate}"></span>
                    </span>
                    <span class="rrate mono">${cur.rate.toFixed(6)}</span>
                  </label>
                </div>

                <div class="rate is-new">
                  <input type="radio" name="rate" id="r-new" value="new" checked />
                  <label for="r-new">
                    <span class="dot" aria-hidden="true"></span>
                    <span>
                      <span class="rname">${isAdopted(tax) ? "What the council adopted" : "What the city is proposing"}</span>
                      <span class="rmeta" data-perk="${nw.rate}"></span>
                    </span>
                    <span class="rrate mono">${CT.escapeHtml(nw.rate_display)}</span>
                  </label>
                </div>

                <div class="rate is-custom">
                  <input type="radio" name="rate" id="r-custom" value="custom" />
                  <label for="r-custom">
                    <span class="dot" aria-hidden="true"></span>
                    <span>
                      <span class="rname">Some other rate</span>
                      <span class="rmeta" id="custom-meta">Type a rate or a percent, or drag</span>
                    </span>
                    <span class="rrate mono" id="custom-rate">0.001100</span>
                  </label>
                  <div class="customwrap" id="customwrap" hidden>
                    <!-- Two ways of saying the same scenario. Almost nobody
                         thinks in six-decimal rates; plenty of people arrive
                         having heard a percentage. Fill in either and the other
                         follows. -->
                    <div class="customedit">
                      <div class="cfield">
                        <label class="clabel" for="custom-num">Rate</label>
                        <div class="cnum">
                          <button type="button" class="cstep" id="custom-down" aria-label="Lower the rate">−</button>
                          <input id="custom-num" class="crate mono" type="text" inputmode="decimal"
                                 value="${DEFAULT_CUSTOM.toFixed(6)}" aria-describedby="custom-help" />
                          <button type="button" class="cstep" id="custom-up" aria-label="Raise the rate">+</button>
                        </div>
                      </div>
                      <div class="cfield">
                        <label class="clabel" for="custom-pct">% change from today</label>
                        <div class="cnum">
                          <button type="button" class="cstep" id="pct-down" aria-label="Lower the percentage">−</button>
                          <input id="custom-pct" class="crate cpct mono" type="text" inputmode="decimal"
                                 value="${fmtPct((DEFAULT_CUSTOM / cur.rate - 1) * 100)}" aria-describedby="custom-basis" />
                          <span class="csuffix" aria-hidden="true">%</span>
                          <button type="button" class="cstep" id="pct-up" aria-label="Raise the percentage">+</button>
                        </div>
                      </div>
                    </div>
                    <p class="hint chint" id="custom-basis">${basisNote(tax)}</p>
                    <input type="range" id="custom-range" min="0" max="3000" step="10" value="${Math.round(DEFAULT_CUSTOM * 1e6)}" aria-label="Custom tax rate" />
                    <div class="rangeends" id="custom-help"><span>0.000000</span><span>0.003000</span></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- The answer: today's bill and the chosen scenario's, side by side
                 on one ink band, with the difference called out across the foot
                 of both. Directly under the controls, in the order a printed
                 schedule states it — what you pay, then what is proposed. -->

            <p class="tool-foot">
              <strong>This is only the city's part of your property tax bill.</strong>
              Schools, the county and four others charge you separately — see below.
            </p>
          </div>

          <!-- One composed sentence for screen readers. The visible figures are
               not a live region: dragging a slider would otherwise fire a
               stream of announcements. -->
          <p class="sr-only" id="res-sr" aria-live="polite"></p>
        </section>`;
      }

      // Utah's assessment ratio, stated for whichever property type is selected.
      // Built from the data's own ratio rather than the literal "55%".
      const ratioNote = (primary, ratio) =>
        primary
          ? `Utah taxes a primary residence on ${+(ratio * 100).toFixed(1)}% of its market value.`
          : "Business, rental, and secondary property is taxed on its full market value.";

      function wireEstimator({ CURRENT, NEWRATE, RATIO, tax }) {
        const $ = (id) => document.getElementById(id);
        const mv = $("mv"),
          mvRange = $("mv-range"),
          customWrap = $("customwrap"),
          customRng = $("custom-range"),
          customNum = $("custom-num"),
          customPct = $("custom-pct"),
          customRate = $("custom-rate"),
          customMeta = $("custom-meta"),
          bignum = $("res-total"),
          // The headline figure, kept apart from `bignum`: that one is the small
          // scenario total, and the flash below belongs on the number the panel
          // exists to state.
          heronum = $("res-delta-month"),
          cityRow = $("bb-city"),
          srOut = $("res-sr");

        const CUR_REV = tax.rates.current.revenue || 0;
        const NEW_REV = newRate(tax).revenue || 0;
        const CITY_BASE = cityBase(tax);
        const NEW_NOTE = revNote(tax);
        const NEW_SHORT = isAdopted(tax) ? "At the adopted rate" : "If this passes";
        const NEW_NAME = isAdopted(tax) ? "adopted rate" : "proposed rate";
        // The two collections figures are counted on different years' assessed
        // values, which is why an unchanged rate still raises more. Saying which
        // year each one belongs to is the difference between that reading as
        // arithmetic and reading as a bug.
        const TAX_YEAR = parseInt(tax.fiscal_year, 10) || 0;

        // The custom rate is kept here, in millionths, rather than read back off
        // the slider: the slider snaps to its 0.000010 step, and a rate someone
        // typed out by hand should survive to its last digit.
        const RATE_MAX = parseInt(customRng.max, 10);
        const STEP = parseInt(customRng.step, 10);
        let customMicro = parseInt(customRng.value, 10);

        // The rate and the percent are one control wearing two faces. Both are
        // derived from `customMicro` — nothing is stored as a percentage, so the
        // two fields can never drift apart.
        const microToPct = (micro) => (CURRENT ? (micro / 1e6 / CURRENT - 1) * 100 : 0);
        const pctToMicro = (p) => CURRENT * 1e6 * (1 + p / 100);

        // `typed` names the field being edited, so a half-finished entry ("0.0"
        // on the way to "0.0018", or a lone "-") isn't reformatted out from
        // under the cursor. The other face always refreshes.
        const setCustom = (micro, typed) => {
          customMicro = Math.min(Math.max(Math.round(micro), 0), RATE_MAX);
          customRng.value = customMicro;
          $("r-custom").checked = true;
          customWrap.hidden = false;
          if (typed !== "rate") customNum.value = (customMicro / 1e6).toFixed(6);
          if (typed !== "pct") customPct.value = fmtPct(microToPct(customMicro));
          paint();
        };

        const value = () => {
          const n = parseInt(String(mv.value).replace(/[^0-9]/g, ""), 10);
          return isNaN(n) ? 0 : n;
        };
        const ratio = () => ($("pt-home").checked ? RATIO : 1);
        const chosen = () => {
          const v = document.querySelector('input[name="rate"]:checked').value;
          if (v === "current") return { key: v, rate: CURRENT, name: "current rate", short: "No change" };
          if (v === "new") return { key: v, rate: NEWRATE, name: NEW_NAME, short: NEW_SHORT };
          return { key: v, rate: customMicro / 1e6, name: "rate you picked", short: "At your rate" };
        };

        // Two of the three scenarios have a collections figure of their own
        // behind them; quote those rather than re-deriving them. Anything else
        // is scaled off the taxable value the city's own schedule implies.
        const cityRevenue = (sel) =>
          sel.key === "current" ? CUR_REV : sel.key === "new" ? NEW_REV : sel.rate * CITY_BASE;

        // The visible number updates on every slider tick; the announcement waits
        // for the reader to settle, so assistive tech gets one sentence, not fifty.
        let srTimer = 0;
        const announce = (msg) => {
          clearTimeout(srTimer);
          srTimer = setTimeout(() => { srOut.textContent = msg; }, 400);
        };

        function paint() {
          const primary = $("pt-home").checked;
          const taxable = value() * ratio();
          const sel = chosen();
          const now = taxable * CURRENT;
          const tax = taxable * sel.rate;

          const total = usd(tax);
          bignum.textContent = total;
          $("now-year").textContent = usd(now);
          // "$467.50" is seven characters; a mistyped market value can give
          // fifteen. Both cells step down together, so the two figures stay
          // the same size and remain comparable at a glance.
          const longest = Math.max(total.length, usd(now).length);
          [bignum, $("now-year")].forEach((el) => {
            el.classList.toggle("len-l", longest > 11 && longest <= 14);
            el.classList.toggle("len-xl", longest > 14);
          });

          $("res-month").textContent = usd(tax / 12);
          $("now-month").textContent = usd(now / 12);
          $("res-scenario").textContent = sel.short;
          $("ratio-note").textContent = ratioNote(primary, RATIO);

          const diff = tax - now;
          const same = Math.abs(diff) < 0.005;
          const band = $("bill-band");
          band.className = "bill-band " + (same ? "is-same" : diff > 0 ? "is-up" : "is-down");

          // "You would pay about $26.72 more a month" — the sentence a resident
          // came for, split across three lines so the figure can carry the weight.
          // At the current rate there is no difference to report, so the panel
          // answers the other obvious question instead — what you pay now —
          // rather than announcing "$0.00 different a month".
          $("res-lead").textContent = same ? "Your city tax would stay at" : "You would pay about";
          $("res-delta-month").textContent = same ? usd(tax / 12) : usd(Math.abs(diff) / 12);
          $("res-delta-unit").textContent = same ? "a month" : `${diff > 0 ? "more" : "less"} a month`;
          $("res-delta-text").textContent = same
            ? "No change from what you pay today"
            : `${usd(Math.abs(diff))} ${diff > 0 ? "more" : "less"} a year`;

          // Unopened, the row has to advertise that it is editable at all; once
          // it's the chosen scenario, the space is better spent on what the rate
          // means in dollars.
          const cr = customMicro / 1e6;
          customRate.textContent = cr.toFixed(6);
          customMeta.textContent =
            sel.key === "custom"
              ? usd(cr * 100000 * ratio()) + " a year per $100k · " + signed(microToPct(customMicro)) + "%"
              : "Type a rate or a percent, or drag";

          // What the same rate does to the city's own side of the ledger. The
          // figure a resident pays and the figure the city collects are the two
          // halves of the same argument, and only one of them was on this panel.
          if (cityRow) {
            const rev = cityRevenue(sel);
            const revDiff = rev - CUR_REV;
            const revSame = CUR_REV > 0 && Math.abs(revDiff) / CUR_REV < 0.0005;
            $("cw-total").textContent = usd0(rev);
            $("cw-sub").textContent = revSame
              ? "a year · about what it collects today"
              : `a year · ${signed((rev / CUR_REV - 1) * 100)}% against the ${usd0(CUR_REV)} it collects today`;
            $("cw-note").textContent =
              sel.key === "custom"
                ? `Estimated on the ${usdBig(CITY_BASE)} of ${TAX_YEAR || ""} taxable value behind the city's
                   schedule; today's total is collected on ${TAX_YEAR ? TAX_YEAR - 1 : "last year's"} values.`.replace(/\s+/g, " ")
                : sel.key === "new"
                  ? NEW_NOTE
                  : "From the city's published schedule.";
            cityRow.classList.toggle("is-up", !revSame && revDiff > 0);
          }

          // Every rate row is priced the same way, so the six-decimal figure
          // beside it is evidence rather than the thing being read.
          document.querySelectorAll("[data-perk]").forEach((el) => {
            el.textContent = usd(parseFloat(el.dataset.perk) * 100000 * ratio()) + " a year per $100k";
          });

          // The whole-bill panel shows the same property at every other taxing
          // entity's rate, so it follows the value and property type entered
          // here. It never follows the *rate* picker: those seven rates are
          // 2025's adopted figures, and the city's proposal is stated as its
          // own line under that table rather than mixed into them.
          if (BILL_SYNC) BILL_SYNC(value(), primary);

          announce(
            `Your city property tax at the ${sel.name} is ${usd(tax)} per year, ` +
              `${usd(tax / 12)} per month. ` +
              (same
                ? "The same as today."
                : `${usd(Math.abs(diff))} ${diff > 0 ? "more" : "less"} per year than the current rate.`) +
              (cityRow ? ` Citywide, that rate collects about ${usd0(cityRevenue(sel))} a year.` : "")
          );
        }

        // A changed scenario is a different answer, not a nudged one — say so.
        // Slider drags are excluded: a pulse per tick would be a strobe.
        // Named `numflash`, not `pulse`: the home page's motion ledger already
        // owns `.pulse` as a boxed component, and sharing the name dropped the
        // figure into a padded grey block for the length of the animation.
        const pulse = () => {
          heronum.classList.remove("numflash");
          void heronum.offsetWidth; // restart the animation
          heronum.classList.add("numflash");
        };
        heronum.addEventListener("animationend", () => heronum.classList.remove("numflash"));

        mv.addEventListener("input", () => {
          const n = value();
          if (n >= +mvRange.min && n <= +mvRange.max) mvRange.value = n;
          paint();
        });
        mv.addEventListener("blur", () => { mv.value = commas(value()); });
        mvRange.addEventListener("input", () => {
          mv.value = commas(parseInt(mvRange.value, 10));
          paint();
        });
        document.querySelectorAll('input[name="ptype"]').forEach((el) =>
          el.addEventListener("change", () => { paint(); pulse(); })
        );
        document.querySelectorAll('input[name="rate"]').forEach((el) =>
          el.addEventListener("change", () => {
            customWrap.hidden = !document.getElementById("r-custom").checked;
            paint();
            pulse();
          })
        );
        customRng.addEventListener("input", () => setCustom(parseInt(customRng.value, 10)));

        customNum.addEventListener("input", () => {
          const n = parseFloat(String(customNum.value).replace(/[^0-9.]/g, ""));
          if (isNaN(n)) return; // an empty or half-typed field isn't a rate yet
          setCustom(n * 1e6, "rate");
        });
        // Tidy the field to six places only once they're done with it, and never
        // leave a cleared field standing in for a rate that is still in effect.
        customNum.addEventListener("blur", () => {
          customNum.value = (customMicro / 1e6).toFixed(6);
        });
        customNum.addEventListener("keydown", (e) => {
          const dir = e.key === "ArrowUp" ? 1 : e.key === "ArrowDown" ? -1 : 0;
          if (!dir) return;
          e.preventDefault();
          setCustom(customMicro + dir * (e.shiftKey ? STEP * 10 : STEP));
        });

        $("custom-up").addEventListener("click", () => setCustom(customMicro + STEP));
        $("custom-down").addEventListener("click", () => setCustom(customMicro - STEP));

        // The percent field, wired the same way. A leading minus is kept so a
        // reader can type their way down to a cut, and the field is stepped in
        // whole points — a tenth of a point is under a millionth of a rate.
        const PCT_STEP = 1;
        const pctValue = () => {
          const raw = String(customPct.value).replace(/[^0-9.\-]/g, "");
          const n = parseFloat(raw);
          return isNaN(n) ? null : n;
        };
        const stepPct = (dir, big) => {
          const from = pctValue();
          const at = from === null ? microToPct(customMicro) : from;
          setCustom(pctToMicro(at + dir * PCT_STEP * (big ? 10 : 1)));
        };

        customPct.addEventListener("input", () => {
          const n = pctValue();
          if (n === null) return; // "-" or "" on the way to a number
          setCustom(pctToMicro(n), "pct");
        });
        // Snapping the rate to six decimals can move the percent a hair off what
        // was typed; on the way out, show the percent the rate actually is.
        customPct.addEventListener("blur", () => {
          customPct.value = fmtPct(microToPct(customMicro));
        });
        customPct.addEventListener("keydown", (e) => {
          const dir = e.key === "ArrowUp" ? 1 : e.key === "ArrowDown" ? -1 : 0;
          if (!dir) return;
          e.preventDefault();
          stepPct(dir, e.shiftKey);
        });

        $("pct-up").addEventListener("click", () => stepPct(1));
        $("pct-down").addEventListener("click", () => stepPct(-1));

        paint();
        srOut.textContent = ""; // don't announce the initial render
      }

      /* ---------------- measurements ----------------
         The estimator no longer pins anything: the band sits directly under the
         controls, in the order a printed schedule states it, and the whole card
         is short enough to hold both at once. What the stylesheet still needs is
         the topbar's real height — panels and controls scroll themselves into
         view against it, and it shrinks at the mobile breakpoint and grows with
         the safe-area inset, so it can't be a constant.
      */
      function measureTopbar() {
        const bar = document.querySelector(".topbar");
        const h = bar ? Math.round(bar.getBoundingClientRect().height) : 60;
        document.documentElement.style.setProperty("--topbar-h", h + "px");
        return h;
      }

      function wireMeasures() {
        let t = 0;
        const remeasure = () => {
          clearTimeout(t);
          t = setTimeout(measureTopbar, 150);
        };
        window.addEventListener("resize", remeasure);

        // Measuring once is a race: the topbar grows when the webfont replaces
        // the fallback and the brand wraps to two lines, and again if the body
        // switcher rewraps.
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureTopbar);
        if ("ResizeObserver" in window) {
          const bar = document.querySelector(".topbar");
          if (bar) new ResizeObserver(remeasure).observe(bar);
        }
      }

      /* ---------------- the three facts ----------------
         A hairline strip straight under the tool. A reader who works the
         estimator and stops still leaves with the headline: how big the increase
         is, what it does to the city's standing, and what it buys. Every figure
         is opened in full further down the page, so this states nothing it can't
         back up. The rank fact only renders when the county data loaded — the
         page is built to work without it.
      */
      function takeawayHtml(tax, county) {
        const nw = newRate(tax);
        const done = isAdopted(tax);
        // Ranked off the same rates the charts below draw, rather than off the
        // stored rank fields, so this strip cannot disagree with the bars.
        const em = county ? county.eagle_mountain : null;
        const rankNow = county ? cityOrder(county).findIndex((r) => r.name === EM) + 1 : 0;
        const rankNew = county ? rankByResulting(county) : 0;
        const times = nw.rate / tax.rates.current.rate;

        const rankFact = em
          ? `
            <li class="fact">
              <b class="shift"><span class="nb">${ordinal(county.cities.length - rankNow + 1)}-lowest</span> <span class="to" aria-hidden="true">→</span> <span class="nb">${ordinal(rankNew)}-highest</span></b>
              <p>Eagle Mountain charges nearly the least of the ${county.cities.length} cities in Utah
                County today. ${done ? "The new rate moves" : "This would move"} it into the top
                ${numWord(rankNew)}.</p>
            </li>`
          : "";

        return `
          <ul class="facts reveal${em ? "" : " two"}" style="--i:2" aria-label="What this means">
            <li class="fact">
              <b>About ${times.toFixed(1)}&times; more</b>
              <p>The city's part of your tax bill ${done ? "is" : "would be"} about
                ${times.toFixed(1)}× what it is today${
                  em ? " — the biggest increase any Utah County city has on the table this year" : ""
                }.</p>
            </li>
            ${rankFact}
            <li class="fact">
              <b>Sheriff's deputies</b>
              <p>The ${usd0(nw.revenue_increase || tax.revenue_increase)} it raises is set aside for
                policing — Eagle Mountain contracts with the Utah County Sheriff.</p>
            </li>
          </ul>`;
      }

      /* =========================================================================
         The argument

         Everything above this point is arithmetic: what the rate is, what it
         costs one household, where it sits against other cities. None of that
         tells a reader why the council says it needs the money, what was said in
         public before the vote, or what the people organising against it are
         actually organising against.

         This section carries that, and it has one rule: nothing goes in it that
         isn't a quotation from a recording of an open meeting or a citation to
         statute. The city's case and the case against it are both built out of
         the same material, and the section closes on the objections the record
         answers badly rather than on the ones it answers well — a page that only
         made the city's argument would be worth nothing to a reader trying to
         decide what they think.
         ========================================================================= */

      // A sourced quotation. The attribution is the load-bearing part: without a
      // meeting to click through to, every line here is just assertion.
      function srcQuote(s, cls) {
        if (!s) return "";
        const link =
          s.meeting != null
            ? `<a class="aq-src" href="meetings.html?id=${s.meeting}">${CT.fmtDate(s.date)} · Meeting #${s.meeting} <span aria-hidden="true">→</span></a>`
            : `<span class="aq-src">${CT.fmtDate(s.date)}</span>`;
        // Some of what was said aloud also exists in print. Where it does, the
        // document goes next to the quote rather than in a bibliography.
        const doc = s.doc
          ? `<a class="aq-doc" href="${s.doc.url}" rel="nofollow noopener">${CT.escapeHtml(s.doc.title)} (PDF) <span aria-hidden="true">↗</span></a>`
          : "";
        return `
          <figure class="arg-quote${cls ? " " + cls : ""}">
            ${s.quote ? `<blockquote>${CT.escapeHtml(s.quote)}</blockquote>` : ""}
            <figcaption>
              <span class="aq-who">${CT.escapeHtml(s.speaker || "")}</span>
              ${link}
              ${doc}
            </figcaption>
          </figure>`;
      }

      function caseSection(k) {
        return `
          <section class="tax-sec argument reveal" style="--i:5" id="s-argument" aria-labelledby="arg-title">
            <div class="sec-head">
              <p class="eyebrow"><span class="sec-num" aria-hidden="true">03</span>${CT.escapeHtml(k.eyebrow)}</p>
              <h2 class="sec-h2" id="arg-title">${CT.escapeHtml(k.title)}</h2>
              <p class="sec-sub">${CT.escapeHtml(k.sub)}</p>
            </div>

            ${argCase(k.case)}
            ${argDisplacement(k.displacement)}
            ${argStrain(k.strain)}
            ${argLedger(k.ledger)}
            ${argResponse(k.response)}
            ${argReferendum(k.referendum)}
            ${argCounter(k.counter)}

            <p class="arg-foot">${CT.escapeHtml(k.sources_note)}</p>
          </section>`;
      }

      /* Why the city says it needs it. Six figures rather than six paragraphs:
         the case is quantitative, and stating it as prose invites the reader to
         weigh it as opinion. */
      function argCase(c) {
        if (!c) return "";
        const cards = (c.points || [])
          .map(
            (p) => `
            <li class="astat">
              <b>${CT.escapeHtml(p.stat)}</b>
              <p>${CT.escapeHtml(p.text)}</p>
              ${srcQuote(p.source, "tight")}
            </li>`
          )
          .join("");
        return `
          <div class="arg-block">
            <h3 class="arg-h">${CT.escapeHtml(c.heading)}</h3>
            <p class="arg-lede">${CT.escapeHtml(c.lede)}</p>
            <ul class="arg-stats">${cards}</ul>
            ${
              c.closer
                ? `<div class="arg-closer">
                     <p>${CT.escapeHtml(c.closer.text)}</p>
                     ${srcQuote(c.closer.source)}
                   </div>`
                : ""
            }
          </div>`;
      }

      /* The "100% for public safety" charge, walked one step at a time. Numbered,
         because the whole dispute is that two true statements — the money all
         goes to the Sheriff, and the Sheriff's costs barely move — sound like a
         contradiction unless you are shown the order they happen in. */
      function argDisplacement(d) {
        if (!d) return "";
        const steps = (d.steps || [])
          .map(
            (s, i) => `
            <li class="astep">
              <span class="astep-n" aria-hidden="true">${i + 1}</span>
              <div class="astep-body">
                <p class="astep-label">${CT.escapeHtml(s.label)}</p>
                <p class="astep-text">${CT.escapeHtml(s.text)}</p>
                ${srcQuote(s.source, "tight")}
              </div>
            </li>`
          )
          .join("");

        const freed = d.freed
          ? `
          <div class="arg-freed">
            <h4 class="arg-h4">${CT.escapeHtml(d.freed.heading)}</h4>
            <p class="arg-note">${CT.escapeHtml(d.freed.note)}</p>
            <ul class="afreed">
              ${(d.freed.items || [])
                .map(
                  (it) => `<li><b>${CT.escapeHtml(it.figure)}</b><span>${CT.escapeHtml(it.text)}</span></li>`
                )
                .join("")}
            </ul>
            ${srcQuote(d.freed.source)}
          </div>`
          : "";

        return `
          <div class="arg-block">
            <h3 class="arg-h">${CT.escapeHtml(d.heading)}</h3>
            <p class="arg-lede">${CT.escapeHtml(d.lede)}</p>
            <ol class="arg-steps">${steps}</ol>
            ${freed}
          </div>`;
      }

      /* The transparency ledger. Two columns of the same complaint: what happened
         in public, and what the council itself conceded about how badly it was
         explained. Set side by side because the whole point is that both are true
         and they are not the same charge. */
      function argLedger(l) {
        if (!l) return "";
        const rows = (l.open.rows || [])
          .map(
            (r) => `
            <li class="aled${r.weight === "strong" ? " is-strong" : ""}">
              <a class="aled-when" href="meetings.html?id=${r.meeting}">${CT.fmtDate(r.date)}</a>
              <p>${CT.escapeHtml(r.text)}</p>
            </li>`
          )
          .join("");

        const always = (l.open.always || [])
          .map(
            (a) => `<li><p>${CT.escapeHtml(a.text)}</p>${srcQuote(a.source, "tight")}</li>`
          )
          .join("");

        const admits = (l.admitted.quotes || [])
          .map(
            (q) => `
            <figure class="aadmit">
              <blockquote>${CT.escapeHtml(q.quote)}</blockquote>
              <figcaption>${CT.escapeHtml(q.speaker)}</figcaption>
            </figure>`
          )
          .join("");

        return `
          <div class="arg-block">
            <h3 class="arg-h">${CT.escapeHtml(l.heading)}</h3>
            <p class="arg-lede">${CT.escapeHtml(l.lede)}</p>

            <div class="arg-two">
              <div class="arg-col">
                <h4 class="arg-h4">${CT.escapeHtml(l.open.heading)}</h4>
                <ol class="arg-ledger">${rows}</ol>
                <ul class="arg-always">${always}</ul>
              </div>
              <div class="arg-col arg-col-admit">
                <h4 class="arg-h4">${CT.escapeHtml(l.admitted.heading)}</h4>
                <p class="arg-note">${CT.escapeHtml(l.admitted.note)}</p>
                <div class="aadmit-list">${admits}</div>
              </div>
            </div>

            <p class="arg-punch">${CT.escapeHtml(l.distinction)}</p>
          </div>`;
      }

      /* What the hearing changed. The four deltas are the single most-missed fact
         about August 6 — the rate on the signs is not the rate that passed — so
         they get the largest type in the section. */
      function argResponse(r) {
        if (!r) return "";
        const deltas = (r.changes || [])
          .map(
            (c) => `
            <li class="adelta">
              <span class="adelta-label">${CT.escapeHtml(c.label)}</span>
              <b class="shift">
                <span class="nb was mono">${CT.escapeHtml(c.from)}</span>
                <span class="to" aria-hidden="true">→</span>
                <span class="nb now mono">${CT.escapeHtml(c.to)}</span>
              </b>
              <p>${CT.escapeHtml(c.text)}</p>
            </li>`
          )
          .join("");

        const commits = (r.commitments || [])
          .map((c) => `<li><p>${CT.escapeHtml(c.text)}</p>${srcQuote(c.source, "tight")}</li>`)
          .join("");

        return `
          <div class="arg-block arg-response">
            <h3 class="arg-h">${CT.escapeHtml(r.heading)}</h3>
            <p class="arg-lede">${CT.escapeHtml(r.lede)}</p>
            <ul class="arg-deltas">${deltas}</ul>
            <ul class="arg-commits">${commits}</ul>
            <p class="arg-vote">${CT.escapeHtml(r.vote)}</p>
            ${r.shortfall ? `<p class="arg-punch">${CT.escapeHtml(r.shortfall)}</p>` : ""}
            ${
              r.closer
                ? `<figure class="arg-quote">
                     <blockquote>${CT.escapeHtml(r.closer.quote)}</blockquote>
                     <figcaption><span class="aq-who">${CT.escapeHtml(r.closer.speaker)}</span></figcaption>
                   </figure>`
                : ""
            }
          </div>`;
      }

      /* The referendum, in three parts: the sequence, the bill, and the one real
         precedent. This was a closed panel of statute citations in the first
         draft and it read as legalese — the fix was to stop listing provisions
         and start telling it in order, with the money and the precedent as their
         own blocks rather than as two more bullets. It stays open on the page:
         it is the most actionable thing here right now. */
      function argReferendum(rf) {
        if (!rf) return "";

        const steps = (rf.steps || [])
          .map(
            (s, i) => `
            <li class="astep">
              <span class="astep-n" aria-hidden="true">${i + 1}</span>
              <div class="astep-body">
                <p class="astep-label">${CT.escapeHtml(s.label)}</p>
                <p class="astep-text">${CT.escapeHtml(s.text)}</p>
              </div>
            </li>`
          )
          .join("");

        // The two costs are deliberately the same shape, so the reader compares
        // "≈ $5.59M" against "Not published" and draws the obvious conclusion
        // without the page having to assert it.
        const cost = rf.cost
          ? `
          <div class="arg-cost">
            <h4 class="arg-h4">${CT.escapeHtml(rf.cost.heading)}</h4>
            <p class="arg-lede">${CT.escapeHtml(rf.cost.lede)}</p>
            <ul class="acost">
              ${(rf.cost.items || [])
                .map(
                  (it) => `
                  <li>
                    <b class="acost-fig">${CT.escapeHtml(it.figure)}</b>
                    <span class="acost-label">${CT.escapeHtml(it.label)}</span>
                    <p>${CT.escapeHtml(it.text)}</p>
                    ${srcQuote(it.source, "tight")}
                  </li>`
                )
                .join("")}
            </ul>
            <p class="arg-punch">${CT.escapeHtml(rf.cost.note)}</p>
          </div>`
          : "";

        const prec = rf.precedent
          ? `
          <div class="arg-precedent">
            <h4 class="arg-h4">${CT.escapeHtml(rf.precedent.heading)}</h4>
            <p class="aprec-text">${CT.escapeHtml(rf.precedent.text)}</p>
            <p class="arg-note">${CT.escapeHtml(rf.precedent.note)}</p>
          </div>`
          : "";

        return `
          <div class="arg-block arg-referendum" id="p-referendum">
            <h3 class="arg-h">${CT.escapeHtml(rf.heading)}</h3>
            <p class="arg-lede">${CT.escapeHtml(rf.lede)}</p>
            <ol class="arg-steps">${steps}</ol>
            ${cost}
            ${prec}
          </div>`;
      }

      /* The complaints and the cause. The strongest thing in the transcript is
         accidental: person after person opposed the increase and then described,
         in detail, the symptoms of the shortfall it was meant to close. Setting
         each complaint directly against the staffing fact that explains it is the
         only honest way to show that — quoting either half alone would be a
         rhetorical trick. */
      function argStrain(s) {
        if (!s) return "";

        const pairs = (s.pairs || [])
          .map(
            (p) => `
            <li class="apair">
              <figure class="apair-said">
                <blockquote>${CT.escapeHtml(p.said)}</blockquote>
                <figcaption>
                  <span class="aq-who">${CT.escapeHtml(p.who)}</span>
                  <a class="aq-src" href="meetings.html?id=${p.meeting}">${CT.fmtDate(p.date)} · Meeting #${p.meeting} <span aria-hidden="true">→</span></a>
                </figcaption>
              </figure>
              <div class="apair-why">
                <p class="apair-why-label">Why</p>
                <p>${CT.escapeHtml(p.because)}</p>
                ${srcQuote(p.bsrc, "tight")}
              </div>
            </li>`
          )
          .join("");

        const st = s.staffing
          ? `
          <div class="arg-staffing">
            <h4 class="arg-h4">${CT.escapeHtml(s.staffing.heading)}</h4>
            <ul class="afreed">
              ${(s.staffing.items || [])
                .map((i) => `<li><b class="mono">${CT.escapeHtml(i.figure)}</b><span>${CT.escapeHtml(i.text)}</span></li>`)
                .join("")}
            </ul>
            ${(s.staffing.quotes || []).map((q) => srcQuote(q)).join("")}
          </div>`
          : "";

        return `
          <div class="arg-block arg-strain">
            <h3 class="arg-h">${CT.escapeHtml(s.heading)}</h3>
            <p class="arg-lede">${CT.escapeHtml(s.lede)}</p>
            <ul class="arg-pairs">${pairs}</ul>
            ${st}
            <p class="arg-punch">${CT.escapeHtml(s.closer)}</p>
          </div>`;
      }

      /* Where the criticism lands. Last, and not hedged — the section has spent
         several screens setting out the city's case, and it does not get to skip
         the part where the case is weakest. */
      function argCounter(c) {
        if (!c) return "";
        const items = (c.items || [])
          .map((i) => `<li><p>${CT.escapeHtml(i.text)}</p>${srcQuote(i.source, "tight")}</li>`)
          .join("");

        const coming = c.coming
          ? `
          <div class="arg-coming">
            <h4 class="arg-h4">${CT.escapeHtml(c.coming.heading)}</h4>
            <p class="arg-note">${CT.escapeHtml(c.coming.text)}</p>
            <table class="tuf-table acoming">
              <tbody>
                ${(c.coming.rows || [])
                  .map(
                    (r) =>
                      `<tr><th scope="row">${CT.escapeHtml(r.who)}</th><td class="num">${CT.escapeHtml(r.amount)}</td></tr>`
                  )
                  .join("")}
              </tbody>
            </table>
            <p class="arg-note">${CT.escapeHtml(c.coming.note)}</p>
            ${srcQuote(c.coming.source, "tight")}
          </div>`
          : "";

        return `
          <div class="arg-block arg-counter">
            <h3 class="arg-h">${CT.escapeHtml(c.heading)}</h3>
            <p class="arg-lede">${CT.escapeHtml(c.lede)}</p>
            <ul class="arg-counters">${items}</ul>
            ${coming}
          </div>`;
      }

      /* ---------------- section wayfinding ----------------
         Four stacked closed panels give a reader no sense of what's inside. A
         row of chips names each topic up front and jumps to it — opening the
         panel on the way. Built from the same conditionals as the panels, so a
         chip never points at a section that didn't render.
      */
      function pictureNavHtml(county, state) {
        const items = [
          ["p-schedule", "The schedule"],
          state ? ["p-state-proposals", "Every Utah proposal"] : null,
          county && county.statewide ? ["p-statewide", "Statewide"] : null,
          ["p-source", "Sources"],
          ["p-record", "Timeline"],
        ].filter(Boolean);
        return `
          <nav class="picture-nav" aria-label="Jump to a section">
            ${items.map(([id, label]) => `<a class="pnav-link" href="#${id}" data-panel="${id}">${CT.escapeHtml(label)}</a>`).join("")}
          </nav>`;
      }

      /* Chips and in-page links glide to their target, opening it first if it is
         a panel. A shared URL that names one does the same on load. Both honour
         reduced-motion by dropping the smooth scroll. */
      function wirePictureNav() {
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const reveal = (id, focus) => {
          const target = document.getElementById(id);
          if (!target) return false;
          const isPanel = target.tagName === "DETAILS";
          if (isPanel) target.open = true;
          revealBars(target);
          target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
          // Keyboard users land on the panel they asked for, not back at the top.
          if (focus && isPanel) {
            const sum = target.querySelector("summary");
            if (sum) sum.focus({ preventScroll: true });
          }
          return true;
        };

        document.querySelectorAll("[data-panel]").forEach((a) => {
          a.addEventListener("click", (e) => {
            const id = a.getAttribute("data-panel");
            if (document.getElementById(id)) {
              e.preventDefault();
              history.replaceState(null, "", "#" + id);
              reveal(id, true);
            }
          });
        });

        // Deep link: a URL ending in #p-schedule (etc.) arrives with that panel open.
        if (location.hash.length > 1) reveal(location.hash.slice(1), false);
      }

      /* ---------------- disclosure panels ----------------
         Each panel is a native <details>: keyboard-operable, no JS to open, and
         collapsed by default so the page arrives calm. The schedule opens first
         so the section never reads as an empty stack of closed doors.
      */
      /* Caveats, sources and footnote keys are load-bearing for trust — a civic
         data page that hides how its numbers were derived isn't worth much — but
         they are not what anyone arrives to read, and left inline they were more
         than half the words on the page. Each set gets a closed disclosure
         instead: still one click from the chart it belongs to, still exportable,
         still in the DOM for search, and out of the way of the argument. */
      function finePrint(label, bodyHtml) {
        return `
        <details class="fine">
          <summary>${CT.escapeHtml(label)}</summary>
          <div class="fine-body">${bodyHtml}</div>
        </details>`;
      }

      // The title is a real <h3>, not a styled <b>. A summary may contain heading
      // content, and without it these four sections are invisible to the document
      // outline — a screen-reader user scanning by heading would jump straight
      // from "Where all of this comes from" to the meeting groups inside the last
      // panel, with no way to tell the four panels apart.
      function panel(title, sub, bodyHtml, open, id) {
        return `
        <details class="panel"${id ? ` id="${id}"` : ""}${open ? " open" : ""}>
          <summary>
            <span class="panel-tt">
              <h3>${title}</h3>
              <span>${sub}</span>
            </span>
            <span class="panel-chev" aria-hidden="true"></span>
          </summary>
          <div class="panel-body">${bodyHtml}</div>
        </details>`;
      }

      /* ---------------- the official schedule ----------------
         The six lines of the statutory Truth-in-Taxation schedule, in the order
         Mayor Gray read them on June 16 (meeting #726, item 17.B) — but carried
         at the rate the council actually adopted, not the one that was read.
         The schedule is a form the city has to fill in, not a document frozen
         to a proposal that lost; a reader who opens a panel called "the
         official schedule" wants the rate they will be billed at.

         Two of the six lines are quoted rather than computed: the rate and the
         percentage are the motion's own words. The other four are that rate
         applied to the same revenue base and the same two properties the city
         used, which is the only way to state them — nobody read a schedule for
         0.001500 aloud.

         The noticed figures are directly under the table rather than gone,
         because they are what the mailed notice, the county's combined ad and
         most of the signs in the city still say. That paragraph also owns the
         two wrinkles that used to sit in this table: the mayor read the
         percentage as +218% on the night, which is 0.001700 against the
         0.000534 then in effect rather than the recalculated certified rate the
         county returned on June 22; and the noticed 220.88% is a ratio of
         revenue rather than of rates, so it never quite fell out of the rate
         arithmetic — 0.001700 over the 0.000530 certified rate is +220.75%.
         The adopted 183.02% is the one figure that comes out the same on either
         basis, so the asterisk under this table has less to explain than it
         used to.

         Because of that, the noticed percentage below is labelled as the
         notice's own figure rather than as an increase over the certified rate.
         The adopted row is both, and says so.
      */
      function schedulePanel(tax) {
        const cur = tax.rates.current, prop = tax.rates.proposed;
        const certified = tax.rates.certified_2026;
        const home = tax.as_read.home, biz = tax.as_read.business;
        const nw = newRate(tax);
        const done = isAdopted(tax);

        // Rounded to cents before anything is subtracted, so the rise printed
        // beside a figure is the difference between the two figures on screen
        // rather than a cent off them.
        const cents = (n) => Math.round(n * 100) / 100;
        // Today's column is arithmetic on a rate that is already exact.
        const homeNow = cents(home.market_value * tax.residential_ratio * cur.rate);
        const bizNow = cents(biz.market_value * cur.rate);

        /* The other column. Before the vote it reproduces the dollar figures
           the mayor read aloud rather than recomputing them from the rounded
           rate, so the table matches the record to the cent. After it there is
           nothing spoken to reproduce: the rate and the percentage come from
           the motion, and the rest is that rate applied to the same base and
           the same two properties. */
        const col = done
          ? {
              rate: nw.rate_display,
              revenue: nw.revenue,
              newRevenue: nw.revenue - cur.revenue,
              pct: nw.pct,
              home: cents(home.market_value * tax.residential_ratio * nw.rate),
              biz: cents(biz.market_value * nw.rate),
            }
          : {
              rate: prop.rate_display,
              revenue: prop.revenue,
              newRevenue: tax.revenue_increase,
              pct: prop.pct,
              home: cents(home.proposed),
              biz: cents(biz.proposed),
            };

        // What the certified rate actually gives as a ratio of rates, stated
        // only where it differs from the percentage the row carries — which it
        // does whenever that percentage is the notice's own revenue figure.
        // Worked from the data, so it cannot drift if a rate is revised.
        const derived = (nw.rate / certified.rate - 1) * 100;
        const gapNote =
          Math.abs(derived - col.pct) >= 0.05
            ? ` The percentage on that row is the city's own, and it measures revenue: the rise in
                budgeted collections over last year, excluding eligible new growth. Measured instead
                as one rate against another, ${CT.escapeHtml(col.rate)} over the
                ${CT.escapeHtml(certified.rate_display)} certified rate is +${derived.toFixed(2)}%.`
            : "";
        // Before the vote, the one figure in the table that was not as spoken.
        const asReadNote =
          !done && tax.as_read.pct !== prop.pct
            ? ` <strong>On the night, this line was read as +${tax.as_read.pct}%</strong> —
                the same ${CT.escapeHtml(prop.rate_display)} measured against the
                ${cur.rate.toFixed(6)} then in effect, because Utah County did not return the
                recalculated certified rate until June 22. Every other figure in this table is
                as read.`
            : "";

        /* The new-revenue line is the one place the adopted column and the
           motion disagree on their face, and the reason is a base rather than a
           mistake — so it gets its own marker rather than a reader's suspicion. */
        const newRevNote =
          done && nw.revenue_increase
            ? ` <span aria-hidden="true">†</span> <strong>+${usd0(col.newRevenue)}</strong> is
                ${usd0(nw.revenue)} against the ${usd0(cur.revenue)} the city collects today, which is
                how the schedule states this line. The motion's own ${usd0(nw.revenue_increase)} is the
                same increase measured against last year's budgeted revenue excluding new growth.`
            : "";

        // The schedule the city published, for a reader who wants the noticed
        // figures in the original rather than in our sentence.
        const schedDoc = ((tax.documents || {}).items || []).find((d) =>
          /impact schedule/i.test(d.title || "")
        );
        const noticedNote = done
          ? `<p class="chart-foot">
               <strong>What was noticed.</strong> The schedule read on
               <a href="meetings.html?id=${tax.as_read.meeting_id}">June 16</a> was built on the
               ${CT.escapeHtml(prop.rate_display)} the council did not adopt:
               ${usd0(prop.revenue)} in revenue, +${usd0(tax.revenue_increase)} of it new,
               the +${prop.pct}% the notice states${
                 prop.pct_rate_basis ? ` (+${prop.pct_rate_basis}% measured rate against rate)` : ""
               }, ${usd(cents(home.proposed))} on the same
               ${usd0(home.market_value)} home and ${usd(cents(biz.proposed))} on the same business.
               Those are the figures on the mailed notice, and they are still what most of the signs
               say. On the night the percentage was read as +${tax.as_read.pct}% — the same
               ${CT.escapeHtml(prop.rate_display)} against the ${cur.rate.toFixed(6)} then in effect,
               because Utah County did not return the recalculated certified rate until June 22.${
                 schedDoc
                   ? ` The schedule as published:
                       <a href="${schedDoc.url}" rel="nofollow noopener">${CT.escapeHtml(schedDoc.title)}</a> (PDF).`
                   : ""
               }
             </p>`
          : "";

        const body = `
          <p class="panel-intro">
            ${
              done
                ? `The statutory schedule the city has to publish, carried at the
                   <strong>${CT.escapeHtml(nw.rate_display)}</strong> the council adopted on
                   <a href="meetings.html?id=${nw.meeting_id}">August 6</a>. The rate and the
                   +${nw.pct}% are the motion's own; the other four lines are that rate applied to the
                   same revenue base and the same two properties the city read into the record on
                   <a href="meetings.html?id=${tax.as_read.meeting_id}">June 16</a>.`
                : `Read aloud on <a href="meetings.html?id=${tax.as_read.meeting_id}">June 16</a>,
                   transcribed from the recording.`
            }
          </p>
          <div class="tablewrap">
            <table class="data schedule">
              <thead>
                <tr>
                  <th scope="col">City property tax</th>
                  <th scope="col" class="num">Current</th>
                  <th scope="col" class="num">${done ? "Adopted" : "Proposed"}</th>
                </tr>
              </thead>
              <tbody>
                <tr><td class="rowlabel">Tax rate</td>
                  <td class="num">${cur.rate.toFixed(6)}</td>
                  <td class="num">${CT.escapeHtml(col.rate)}</td></tr>
                <tr><td class="rowlabel">Revenue to the city</td>
                  <td class="num">${usd0(cur.revenue)}</td>
                  <td class="num">${usd0(col.revenue)}</td></tr>
                <tr><td class="rowlabel">New revenue to the city${
                  newRevNote ? ' <span class="ast" aria-hidden="true">†</span>' : ""
                }</td>
                  <td class="num">—</td>
                  <td class="num">+${usd0(col.newRevenue)}</td></tr>
                <tr><td class="rowlabel">Increase over the certified rate <span class="ast" aria-hidden="true">*</span></td>
                  <td class="num">—</td>
                  <td class="num">+${col.pct}%</td></tr>
                <tr><td class="rowlabel">Tax on a ${usd0(home.market_value)} home</td>
                  <td class="num">${usd(homeNow)}</td>
                  <td class="num">${usd(col.home)} <span class="rise">+${usd(col.home - homeNow)}</span></td></tr>
                <tr><td class="rowlabel">Tax on the average business (${usd0(biz.market_value)})</td>
                  <td class="num">${usd(bizNow)}</td>
                  <td class="num">${usd(col.biz)} <span class="rise">+${usd(col.biz - bizNow)}</span></td></tr>
              </tbody>
            </table>
          </div>
          <p class="chart-foot">
            <span aria-hidden="true">*</span> <strong>+${col.pct}%</strong> is
            ${CT.escapeHtml(col.rate)} against the ${CT.escapeHtml(certified.rate_display)}
            certified rate — ${
              done
                ? "the basis the motion states, and the one the city's notice used before it"
                : "the comparison the city's own notice uses, and the figure it states"
            }.${gapNote}${asReadNote}${newRevNote}
          </p>
          ${noticedNote}
`;
        return panel(
          "The official schedule",
          `The six lines of the city's Truth-in-Taxation schedule${done ? ", at the rate that passed" : ""}`,
          body, true, "p-schedule"
        );
      }

      /* ---------------- the whole bill ----------------
         The estimator answers "what does the city take?", and a reader who
         stops there can be left thinking the city's line is the property tax.
         It isn't: seven entities levy on an Eagle Mountain parcel, and the city
         is the fourth largest of them. This panel lays out all seven at their
         2025 final adopted rates — the ones on today's bills — so the city's
         new rate can be read against the bill it actually belongs to.

         The rates are fixed 2025 figures and the bars are drawn from them, so
         bar geometry never changes. Only the dollar figures move, and they
         follow the market value and property type entered in the estimator —
         every element carrying a dollar amount declares the rate it is derived
         from in `data-billrate`, and the sync function does the arithmetic.
      */
      function billSection(bill, tax) {
        const ents = [...bill.entities].sort((a, b) => b.rate - a.rate);
        const total = ents.reduce((s, e) => s + e.rate, 0);
        const city = ents.find((e) => e.is_city);
        const cityPos = ents.indexOf(city) + 1;
        const max = ents[0].rate;
        const share = (r) => (r / total) * 100;
        const pct1 = (n) => n.toFixed(1) + "%";
        // Summed rates land on 0.009376999999999998 in binary floating point;
        // the data attribute the sync reads back should carry the rate, not the
        // error term.
        const attrRate = (r) => r.toFixed(9);

        // What the city's new rate does to the bill as a whole, holding every
        // other entity at its 2025 rate — the only honest way to state it,
        // since no other entity has set a 2026 rate yet.
        const nw = newRate(tax).rate;
        const propTotal = total - city.rate + nw;
        const propPos = ents.filter((e) => !e.is_city && e.rate > nw).length + 1;
        const raised = ents.filter((e) => e.rate > e.certified).length;

        // One row per levy, laid out like the bill itself: who takes it, how much
        // of the whole it is, and what that comes to on this property. The bar
        // geometry is fixed 2025 rates; only the dollar column moves.
        const bars = ents
          .map((e) => {
            const tip = `${e.name} — ${rate6(e.rate)}, ${pct1(share(e.rate))} of the bill · ${e.what}`;
            return `
              <div class="levy-row ${e.is_city ? "is-city" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <div class="levy-name">${CT.escapeHtml(e.short)}</div>
                <div class="levy-bar-wrap">
                  <span class="levy-track">
                    <span class="levy-bar ${e.is_city ? "is-city" : ""}" style="width:${((e.rate / max) * 100).toFixed(2)}%"></span>
                  </span>
                  <span class="mono levy-rate">${rate6(e.rate)}</span>
                </div>
                <div class="mono levy-share">${pct1(share(e.rate))}</div>
                <div class="mono levy-amt" data-billrate="${attrRate(e.rate)}"></div>
              </div>`;
          })
          .join("");

        const rows = ents
          .map(
            (e) => `
              <tr${e.is_city ? ' class="is-city"' : ""}>
                <td class="rowlabel">
                  <b>${CT.escapeHtml(e.name)}</b>
                  <span class="bill-what">${CT.escapeHtml(e.what)}</span>
                </td>
                <td class="num">${rate6(e.rate)}</td>
                <td class="num">${pct1(share(e.rate))}</td>
                <td class="num" data-billrate="${attrRate(e.rate)}"></td>
              </tr>`
          )
          .join("");

        return `
          <section class="tax-sec reveal" style="--i:3" id="s-bill" aria-labelledby="bill-title">
            <div class="sec-head">
              <p class="eyebrow"><span class="sec-num" aria-hidden="true">01</span>Where your money goes</p>
              <h2 class="sec-h2" id="bill-title">The city gets ${Math.round(share(city.rate))}&cent; of every property tax dollar</h2>
              <p class="sec-sub">
                ${cap(numWord(ents.length))} different bodies tax your home, and the City Council
                controls only one of them. Schools take the most by far.
              </p>
            </div>

            <figure class="levy" data-tipscope>
              <figcaption class="sr-only">
                ${bill.rate_year} final adopted property tax rates for tax area ${CT.escapeHtml(bill.tax_area.code)},
                and what each takes from the property entered in the estimator.
              </figcaption>
              <div class="levy-head">
                <div>Who taxes your home</div>
                <div>Rate</div>
                <div>Share</div>
                <div data-billnoun="head"></div>
              </div>
              ${bars}
              <div class="levy-total">
