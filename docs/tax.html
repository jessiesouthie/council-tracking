    <!-- Same measure as the front page: this is a reading page with a tool at
         the top of it, not a table, so it shares the homepage's column. -->
    <main id="main" class="main-reading">
      <!-- The page is built from three fetches, so it can't render on first
           paint. Rather than a blank column that snaps to full height when the
           data lands, ship the shape of the page as static markup: a heading
           block and the estimator card at roughly their real sizes. It holds the
           scroll position steady (no layout shift) and tells the reader what is
           coming. render() replaces the whole thing. -->
      <div id="content" aria-busy="true">
        <!-- Without the .no-js rule in site.css hiding the skeleton, an
             unscripted browser would get this explanation *and* a skeleton
             shimmering underneath it forever. -->
        <noscript>
          <div class="tax-page">
            <div class="tax-fail">
              <p class="eyebrow">Needs JavaScript</p>
              <h1 class="tax-h1">The estimator needs JavaScript</h1>
              <p class="tax-lede">The figures behind it are public: the city's Truth-in-Taxation
                schedule was read into the record on June 16, 2026, and the
                <a href="meetings.html">meeting records</a> carry it in full.</p>
            </div>
          </div>
        </noscript>
        <!-- Inside .tax-page so the placeholder inherits this page's warm ink and
             rules rather than the site's navy — a skeleton in the wrong palette
             announces itself as scaffolding. -->
        <div class="tax-page tax-skeleton" role="status" aria-label="Loading the property tax estimator">
          <span class="sk-line sk-eyebrow"></span>
          <span class="sk-line sk-h1"></span>
          <span class="sk-line sk-h1 sk-h1-2"></span>
          <span class="sk-line sk-lede"></span>
          <span class="sk-line sk-lede sk-lede-2"></span>
          <div class="sk-card">
            <div class="sk-card-in">
              <span class="sk-line sk-field"></span>
              <span class="sk-line sk-field"></span>
            </div>
            <div class="sk-band"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer"><span>Data from Eagle Mountain CivicClerk portal</span></footer>

    <script src="site.js?v=20260721c"></script>
    <script>
      (async () => {
        const root = document.getElementById("content");
        const grab = (f) =>
          fetch(new URL(f, document.baseURI))
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
        // The county comparison and the full-bill breakdown are nice-to-haves;
        // the page still works without either.
        const [tax, county, bill] = await Promise.all([
          grab("data.tax.json"),
          grab("data.tax-county.json"),
          grab("data.tax-bill.json"),
        ]);

        root.removeAttribute("aria-busy");

        // A dead end needs a way out of it, not just an explanation. The retry
        // refetches in place rather than reloading the document, so a reader on
        // a flaky connection doesn't lose their scroll position.
        if (!tax) {
          root.innerHTML = `
            <div class="tax-page">
              <div class="tax-fail" role="alert">
                <p class="eyebrow">Couldn't load</p>
                <h1 class="tax-h1">The tax data didn't arrive</h1>
                <p class="tax-lede">This is usually a dropped connection rather than anything wrong
                  with the figures. Try again.</p>
                <p><button type="button" class="tx-btn" id="tax-retry">Try again</button></p>
              </div>
            </div>`;
          document.getElementById("tax-retry").addEventListener("click", (e) => {
            e.target.disabled = true;
            e.target.textContent = "Loading…";
            location.reload();
          });
          return;
        }

        // The estimator only describes the City Council's levy. Other bodies
        // on this site don't set a property tax rate, so say so rather than
        // showing council numbers under a planning-commission heading.
        if (CT.currentBody() !== tax.body) {
          root.innerHTML = `
            <div class="tax-page">
              <div class="tax-fail">
                <p class="eyebrow">Not this body</p>
                <h1 class="tax-h1">Only the City Council sets a property tax rate</h1>
                <p class="tax-lede">Switch the body picker in the header back to City Council to use
                  the estimator.</p>
              </div>
            </div>`;
          return;
        }

        render(tax, county, bill, root);
      })();

      const usd = (n) =>
        "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const usd0 = (n) => "$" + Math.round(n).toLocaleString("en-US");
      const commas = (n) => n.toLocaleString("en-US");
      const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
      // Small counts read as words in prose ("a bill with seven"); anything
      // past ten stays a numeral, as does every figure in a table or a chart.
      const NUM_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
      const numWord = (n) => NUM_WORDS[n] || String(n);

      /* =========================================================================
         The page reads as one continuous argument, in the order a resident would
         ask it: what would this cost me (the tool), how big is it (three facts),
         where does it sit on my actual bill (all seven levies), and where would
         the rate land against everyone else (the county charts). Those run flat,
         one after another, with nothing to open.

         What follows them is reference material — the six-line schedule as read,
         all 253 Utah cities, the paper trail, the meeting-by-meeting record. Real
         and sourced, but not what anyone came for, so it waits in collapsible
         panels rather than adding four screens to the scroll.
         ========================================================================= */

      function render(tax, county, bill, root) {
        const CURRENT = tax.rates.current.rate;
        const PROPOSED = tax.rates.proposed.rate;
        const RATIO = tax.residential_ratio;

        root.innerHTML = `
          <div class="tax-page">
            <header class="tax-hero reveal">
              ${statusHtml(tax)}
              <h1 class="tax-h1">Eagle Mountain wants to raise your property tax</h1>
              <p class="tax-lede">
                Enter what your home is worth and see what it would cost you.
                Nothing is final — the council still has to vote.
              </p>
              ${nextHearingHtml(tax)}
            </header>

            ${estimatorHtml(tax)}

            ${takeawayHtml(tax, county)}

            ${bill ? billSection(bill, tax) : ""}

            ${county ? countySection(county) : ""}

            <section class="learn reveal" style="--i:5" aria-labelledby="learn-title">
              <div class="sec-head">
                <p class="eyebrow"><span class="sec-num" aria-hidden="true">03</span>The record</p>
                <h2 class="sec-h2" id="learn-title">Where all of this comes from</h2>
                <p class="sec-sub">Open any of these for the detail behind the numbers.</p>
              </div>
              ${pictureNavHtml(county)}
              ${schedulePanel(tax)}
              ${county && county.statewide ? statewidePanel(county) : ""}
              ${sourcePanel(tax)}
              ${recordPanel(tax)}
            </section>
          </div>
        `;

        measureTopbar();
        // Wired before the estimator, so the estimator's first paint already
        // finds the bill breakdown and syncs its dollar figures to it.
        if (bill) wireBillPanel(bill);
        wireEstimator({ CURRENT, PROPOSED, RATIO, tax });
        wireMeasures();
        wirePictureNav();
        wireTableExports();
        if (county) {
          wireCountySwitch();
          wireChartTabs();
          wireStatewideTable();
          wireStatewideView();
          wireStatewideFilter();
        }
        // Tooltips are wired across every chart row on the page, so the bill
        // breakdown keeps them even on a load where the county data didn't come.
        if (county || bill) { wireChartTooltips(); wireBarReveal(); }
      }

      /* ---------------- hero ---------------- */

      // The eyebrow over the headline: what stage this is at, and for which year.
      function statusHtml(tax) {
        const fy = tax.fiscal_year.replace("-", "–");
        return `
          <p class="eyebrow">
            <span class="tax-status-dot" aria-hidden="true"></span>
            ${CT.escapeHtml(cap(tax.status))} · FY ${CT.escapeHtml(fy)}
          </p>`;
      }

      // The one fact a reader can still act on: nothing is settled, and there is a
      // date. Counts down from today, and disappears once both hearings are past.
      function nextHearingHtml(tax) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const asDate = (m) => new Date(m.date + "T12:00:00");
        const next = tax.meetings
          .filter((m) => m.upcoming && asDate(m) >= today)
          .sort((a, b) => (a.date < b.date ? -1 : 1))[0];
        if (!next) return "";

        const days = Math.round((asDate(next) - today) / 86400000);
        const when = days <= 0 ? "today" : days === 1 ? "tomorrow" : `in ${days} days`;
        // The one thing a resident can actually do about any of this, so it sits
        // above the estimator rather than below it — but small: a line saying
        // when, and a line saying they are allowed to speak. Most people do not
        // know a Truth-in-Taxation hearing takes public comment.
        return `
          <aside class="act">
            <span class="act-pulse" aria-hidden="true"></span>
            <span class="act-body">
              <b class="act-head">Public hearing ${when}</b>
              <span class="act-meta">${CT.fmtDate(next.date)} · You can speak before the council votes.</span>
            </span>
          </aside>`;
      }

      /* ---------------- estimator (the hero tool) ---------------- */

      // The default scenario: a $500,000 primary residence at the proposed rate.
      // The markup ships with these figures already filled in rather than a set
      // of hardcoded placeholders that JS overwrites a moment later — a stale
      // number that corrects itself in front of the reader reads as a glitch,
      // and it's the one number this page exists to state.
      const DEFAULT_VALUE = 500000;

      function estimatorHtml(tax) {
        const cur = tax.rates.current;
        const prop = tax.rates.proposed;
        const taxable = DEFAULT_VALUE * tax.residential_ratio;
        const now = taxable * cur.rate;
        const sel = taxable * prop.rate;
        const diff = sel - now;
        return `
        <section class="estimator reveal" style="--i:1" id="estimate" aria-label="Property tax estimator">
          <div class="tax-tool">
            <div class="est-ask">
              <label class="ask-q" for="mv">What is your home worth?</label>
              <div class="valuerow">
                <span class="dollar" aria-hidden="true">$</span>
                <input class="value" id="mv" type="text" inputmode="numeric" value="${commas(DEFAULT_VALUE)}" aria-describedby="mv-help" />
              </div>
              <input type="range" id="mv-range" min="100000" max="3000000" step="5000" value="${DEFAULT_VALUE}" aria-label="What your home is worth" />
              <div class="rangeends" id="mv-help"><span>$100k</span><span>$3M</span></div>
              <p class="hint" id="ratio-note">${ratioNote(true, tax.residential_ratio)}</p>

              <div class="ask-type">
                <span class="flabel" id="lbl-type">This is my</span>
                <div class="seg" role="group" aria-labelledby="lbl-type">
                  <input type="radio" name="ptype" id="pt-home" value="primary" checked />
                  <label for="pt-home">Home I live in</label>
                  <input type="radio" name="ptype" id="pt-biz" value="other" />
                  <label for="pt-biz">Rental or business</label>
                </div>
              </div>
            </div>

            <!-- The answer, in the order a homeowner asks it: how much more,
                 per month, then per year, then the two totals it came from.
                 The rate that produced all of this is not on this panel at all —
                 it means nothing to someone who has never read a tax notice. -->
            <div class="bill-band" id="bill-band">
              <p class="bb-lead" id="res-lead">You would pay about</p>
              <p class="bb-hero mono" id="res-delta-month">${usd(diff / 12)}</p>
              <p class="bb-unit" id="res-delta-unit">more a month</p>
              <p class="bb-year" id="res-delta-text">${usd(diff)} more a year</p>

              <div class="bb-split" id="res-delta">
                <div class="bb-half">
                  <span class="bb-label">Your city tax now</span>
                  <span class="bb-num mono" id="now-year">${usd(now)}</span>
                  <span class="bb-sub">a year · <span id="now-month">${usd(now / 12)}</span> a month</span>
                </div>
                <div class="bb-half bb-new">
                  <span class="bb-label" id="res-scenario">If this passes</span>
                  <span class="bb-num mono" id="res-total">${usd(sel)}</span>
                  <span class="bb-sub">a year · <span id="res-month">${usd(sel / 12)}</span> a month</span>
                </div>
              </div>
            </div>

            <div class="est-rates">
              <span class="flabel" id="lbl-rate">Compare against another rate</span>
              <div class="rates" role="radiogroup" aria-labelledby="lbl-rate">
                <div class="rate">
                  <input type="radio" name="rate" id="r-current" value="current" />
                  <label for="r-current">
                    <span class="dot" aria-hidden="true"></span>
                    <span>
                      <span class="rname">What you pay today</span>
                      <span class="rmeta" data-perk="${cur.rate}"></span>
                    </span>
                    <span class="rrate mono">${cur.rate.toFixed(6)}</span>
                  </label>
                </div>

                <div class="rate is-proposed">
                  <input type="radio" name="rate" id="r-proposed" value="proposed" checked />
                  <label for="r-proposed">
                    <span class="dot" aria-hidden="true"></span>
                    <span>
                      <span class="rname">What the city is proposing</span>
                      <span class="rmeta" data-perk="${prop.rate}"></span>
                    </span>
                    <span class="rrate mono">${CT.escapeHtml(prop.rate_display)}</span>
                  </label>
                </div>

                <div class="rate is-custom">
                  <input type="radio" name="rate" id="r-custom" value="custom" />
                  <label for="r-custom">
                    <span class="dot" aria-hidden="true"></span>
                    <span>
                      <span class="rname">Some other rate</span>
                      <span class="rmeta" id="custom-meta">Type a rate, or drag</span>
                    </span>
                    <span class="rrate mono" id="custom-rate">0.001100</span>
                  </label>
                  <div class="customwrap" id="customwrap" hidden>
                    <div class="customedit">
                      <label class="clabel" for="custom-num">Rate</label>
                      <div class="cnum">
                        <button type="button" class="cstep" id="custom-down" aria-label="Lower the rate">−</button>
                        <input id="custom-num" class="crate mono" type="text" inputmode="decimal"
                               value="0.001100" aria-describedby="custom-help" />
                        <button type="button" class="cstep" id="custom-up" aria-label="Raise the rate">+</button>
                      </div>
                    </div>
                    <input type="range" id="custom-range" min="0" max="3000" step="10" value="1100" aria-label="Custom tax rate" />
                    <div class="rangeends" id="custom-help"><span>0.000000</span><span>0.003000</span></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- The answer: today's bill and the chosen scenario's, side by side
                 on one ink band, with the difference called out across the foot
                 of both. Directly under the controls, in the order a printed
                 schedule states it — what you pay, then what is proposed. -->

            <p class="tool-foot">
              <strong>This is only the city's part of your property tax bill.</strong>
              Schools, the county and four others charge you separately — see below.
            </p>
          </div>

          <!-- One composed sentence for screen readers. The visible figures are
               not a live region: dragging a slider would otherwise fire a
               stream of announcements. -->
          <p class="sr-only" id="res-sr" aria-live="polite"></p>
        </section>`;
      }

      // Utah's assessment ratio, stated for whichever property type is selected.
      // Built from the data's own ratio rather than the literal "55%".
      const ratioNote = (primary, ratio) =>
        primary
          ? `Utah taxes a primary residence on ${+(ratio * 100).toFixed(1)}% of its market value.`
          : "Business, rental, and secondary property is taxed on its full market value.";

      function wireEstimator({ CURRENT, PROPOSED, RATIO }) {
        const $ = (id) => document.getElementById(id);
        const mv = $("mv"),
          mvRange = $("mv-range"),
          customWrap = $("customwrap"),
          customRng = $("custom-range"),
          customNum = $("custom-num"),
          customRate = $("custom-rate"),
          customMeta = $("custom-meta"),
          bignum = $("res-total"),
          srOut = $("res-sr");

        // The custom rate is kept here, in millionths, rather than read back off
        // the slider: the slider snaps to its 0.000010 step, and a rate someone
        // typed out by hand should survive to its last digit.
        const RATE_MAX = parseInt(customRng.max, 10);
        const STEP = parseInt(customRng.step, 10);
        let customMicro = parseInt(customRng.value, 10);

        // `typed` keeps a half-finished entry ("0.0" on the way to "0.0018")
        // from being reformatted out from under the cursor.
        const setCustom = (micro, typed) => {
          customMicro = Math.min(Math.max(Math.round(micro), 0), RATE_MAX);
          customRng.value = customMicro;
          $("r-custom").checked = true;
          customWrap.hidden = false;
          if (!typed) customNum.value = (customMicro / 1e6).toFixed(6);
          paint();
        };

        const value = () => {
          const n = parseInt(String(mv.value).replace(/[^0-9]/g, ""), 10);
          return isNaN(n) ? 0 : n;
        };
        const ratio = () => ($("pt-home").checked ? RATIO : 1);
        const chosen = () => {
          const v = document.querySelector('input[name="rate"]:checked').value;
          if (v === "current") return { rate: CURRENT, name: "current rate", short: "No change" };
          if (v === "proposed") return { rate: PROPOSED, name: "proposed rate", short: "If this passes" };
          return { rate: customMicro / 1e6, name: "rate you picked", short: "At your rate" };
        };

        // The visible number updates on every slider tick; the announcement waits
        // for the reader to settle, so assistive tech gets one sentence, not fifty.
        let srTimer = 0;
        const announce = (msg) => {
          clearTimeout(srTimer);
          srTimer = setTimeout(() => { srOut.textContent = msg; }, 400);
        };

        function paint() {
          const primary = $("pt-home").checked;
          const taxable = value() * ratio();
          const sel = chosen();
          const now = taxable * CURRENT;
          const tax = taxable * sel.rate;

          const total = usd(tax);
          bignum.textContent = total;
          $("now-year").textContent = usd(now);
          // "$467.50" is seven characters; a mistyped market value can give
          // fifteen. Both cells step down together, so the two figures stay
          // the same size and remain comparable at a glance.
          const longest = Math.max(total.length, usd(now).length);
          [bignum, $("now-year")].forEach((el) => {
            el.classList.toggle("len-l", longest > 11 && longest <= 14);
            el.classList.toggle("len-xl", longest > 14);
          });

          $("res-month").textContent = usd(tax / 12);
          $("now-month").textContent = usd(now / 12);
          $("res-scenario").textContent = sel.short;
          $("ratio-note").textContent = ratioNote(primary, RATIO);

          const diff = tax - now;
          const same = Math.abs(diff) < 0.005;
          const band = $("bill-band");
          band.className = "bill-band " + (same ? "is-same" : diff > 0 ? "is-up" : "is-down");

          // "You would pay about $26.72 more a month" — the sentence a resident
          // came for, split across three lines so the figure can carry the weight.
          // At the current rate there is no difference to report, so the panel
          // answers the other obvious question instead — what you pay now —
          // rather than announcing "$0.00 different a month".
          $("res-lead").textContent = same ? "Your city tax would stay at" : "You would pay about";
          $("res-delta-month").textContent = same ? usd(tax / 12) : usd(Math.abs(diff) / 12);
          $("res-delta-unit").textContent = same ? "a month" : `${diff > 0 ? "more" : "less"} a month`;
          $("res-delta-text").textContent = same
            ? "No change from what you pay today"
            : `${usd(Math.abs(diff))} ${diff > 0 ? "more" : "less"} a year`;

          // Unopened, the row has to advertise that it is editable at all; once
          // it's the chosen scenario, the space is better spent on what the rate
          // means in dollars.
          const cr = customMicro / 1e6;
          customRate.textContent = cr.toFixed(6);
          customMeta.textContent = usd(cr * 100000 * ratio()) + " a year per $100k";

          // Every rate row is priced the same way, so the six-decimal figure
          // beside it is evidence rather than the thing being read.
          document.querySelectorAll("[data-perk]").forEach((el) => {
            el.textContent = usd(parseFloat(el.dataset.perk) * 100000 * ratio()) + " a year per $100k";
          });

          // The whole-bill panel shows the same property at every other taxing
          // entity's rate, so it follows the value and property type entered
          // here. It never follows the *rate* picker: those seven rates are
          // 2025's adopted figures, and the city's proposal is stated as its
          // own line under that table rather than mixed into them.
          if (BILL_SYNC) BILL_SYNC(value(), primary);

          announce(
            `Your city property tax at the ${sel.name} is ${usd(tax)} per year, ` +
              `${usd(tax / 12)} per month. ` +
              (same
                ? "The same as today."
                : `${usd(Math.abs(diff))} ${diff > 0 ? "more" : "less"} per year than the current rate.`)
          );
        }

        // A changed scenario is a different answer, not a nudged one — say so.
        // Slider drags are excluded: a pulse per tick would be a strobe.
        // Named `numflash`, not `pulse`: the home page's motion ledger already
        // owns `.pulse` as a boxed component, and sharing the name dropped the
        // figure into a padded grey block for the length of the animation.
        const pulse = () => {
          bignum.classList.remove("numflash");
          void bignum.offsetWidth; // restart the animation
          bignum.classList.add("numflash");
        };
        bignum.addEventListener("animationend", () => bignum.classList.remove("numflash"));

        mv.addEventListener("input", () => {
          const n = value();
          if (n >= +mvRange.min && n <= +mvRange.max) mvRange.value = n;
          paint();
        });
        mv.addEventListener("blur", () => { mv.value = commas(value()); });
        mvRange.addEventListener("input", () => {
          mv.value = commas(parseInt(mvRange.value, 10));
          paint();
        });
        document.querySelectorAll('input[name="ptype"]').forEach((el) =>
          el.addEventListener("change", () => { paint(); pulse(); })
        );
        document.querySelectorAll('input[name="rate"]').forEach((el) =>
          el.addEventListener("change", () => {
            customWrap.hidden = !document.getElementById("r-custom").checked;
            paint();
            pulse();
          })
        );
        customRng.addEventListener("input", () => setCustom(parseInt(customRng.value, 10)));

        customNum.addEventListener("input", () => {
          const n = parseFloat(String(customNum.value).replace(/[^0-9.]/g, ""));
          if (isNaN(n)) return; // an empty or half-typed field isn't a rate yet
          setCustom(n * 1e6, true);
        });
        // Tidy the field to six places only once they're done with it, and never
        // leave a cleared field standing in for a rate that is still in effect.
        customNum.addEventListener("blur", () => {
          customNum.value = (customMicro / 1e6).toFixed(6);
        });
        customNum.addEventListener("keydown", (e) => {
          const dir = e.key === "ArrowUp" ? 1 : e.key === "ArrowDown" ? -1 : 0;
          if (!dir) return;
          e.preventDefault();
          setCustom(customMicro + dir * (e.shiftKey ? STEP * 10 : STEP));
        });

        $("custom-up").addEventListener("click", () => setCustom(customMicro + STEP));
        $("custom-down").addEventListener("click", () => setCustom(customMicro - STEP));

        paint();
        srOut.textContent = ""; // don't announce the initial render
      }

      /* ---------------- measurements ----------------
         The estimator no longer pins anything: the band sits directly under the
         controls, in the order a printed schedule states it, and the whole card
         is short enough to hold both at once. What the stylesheet still needs is
         the topbar's real height — panels and controls scroll themselves into
         view against it, and it shrinks at the mobile breakpoint and grows with
         the safe-area inset, so it can't be a constant.
      */
      function measureTopbar() {
        const bar = document.querySelector(".topbar");
        const h = bar ? Math.round(bar.getBoundingClientRect().height) : 60;
        document.documentElement.style.setProperty("--topbar-h", h + "px");
        return h;
      }

      function wireMeasures() {
        let t = 0;
        const remeasure = () => {
          clearTimeout(t);
          t = setTimeout(measureTopbar, 150);
        };
        window.addEventListener("resize", remeasure);

        // Measuring once is a race: the topbar grows when the webfont replaces
        // the fallback and the brand wraps to two lines, and again if the body
        // switcher rewraps.
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureTopbar);
        if ("ResizeObserver" in window) {
          const bar = document.querySelector(".topbar");
          if (bar) new ResizeObserver(remeasure).observe(bar);
        }
      }

      /* ---------------- the three facts ----------------
         A hairline strip straight under the tool. A reader who works the
         estimator and stops still leaves with the headline: how big the increase
         is, what it does to the city's standing, and what it buys. Every figure
         is opened in full further down the page, so this states nothing it can't
         back up. The rank fact only renders when the county data loaded — the
         page is built to work without it.
      */
      function takeawayHtml(tax, county) {
        const pct = tax.rates.proposed.pct;
        const em = county ? county.eagle_mountain : null;

        const rankFact = em
          ? `
            <li class="fact">
              <b class="shift"><span class="nb">${ordinal(em.total_cities - em.rank_current + 1)}-lowest</span> <span class="to" aria-hidden="true">→</span> <span class="nb">${ordinal(em.rank_proposed)}-highest</span></b>
              <p>Eagle Mountain charges nearly the least of the ${em.total_cities} cities in Utah County
                today. This would move it near the top.</p>
            </li>`
          : "";

        return `
          <ul class="facts reveal${em ? "" : " two"}" style="--i:2" aria-label="What this would mean">
            <li class="fact">
              <b>About 3&times; more</b>
              <p>The city's part of your tax bill would roughly triple${em ? " — the biggest jump any Utah County city is asking for this year" : ""}.</p>
            </li>
            ${rankFact}
            <li class="fact">
              <b>Sheriff's deputies</b>
              <p>The ${usd0(tax.revenue_increase)} it raises is set aside for policing — Eagle Mountain
                contracts with the Utah County Sheriff.</p>
            </li>
          </ul>`;
      }

      /* ---------------- section wayfinding ----------------
         Four stacked closed panels give a reader no sense of what's inside. A
         row of chips names each topic up front and jumps to it — opening the
         panel on the way. Built from the same conditionals as the panels, so a
         chip never points at a section that didn't render.
      */
      function pictureNavHtml(county) {
        const items = [
          ["p-schedule", "The schedule"],
          county && county.statewide ? ["p-statewide", "Statewide"] : null,
          ["p-source", "Sources"],
          ["p-record", "Timeline"],
        ].filter(Boolean);
        return `
          <nav class="picture-nav" aria-label="Jump to a section">
            ${items.map(([id, label]) => `<a class="pnav-link" href="#${id}" data-panel="${id}">${CT.escapeHtml(label)}</a>`).join("")}
          </nav>`;
      }

      /* Chips and in-page links glide to their target, opening it first if it is
         a panel. A shared URL that names one does the same on load. Both honour
         reduced-motion by dropping the smooth scroll. */
      function wirePictureNav() {
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const reveal = (id, focus) => {
          const target = document.getElementById(id);
          if (!target) return false;
          const isPanel = target.tagName === "DETAILS";
          if (isPanel) target.open = true;
          revealBars(target);
          target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
          // Keyboard users land on the panel they asked for, not back at the top.
          if (focus && isPanel) {
            const sum = target.querySelector("summary");
            if (sum) sum.focus({ preventScroll: true });
          }
          return true;
        };

        document.querySelectorAll("[data-panel]").forEach((a) => {
          a.addEventListener("click", (e) => {
            const id = a.getAttribute("data-panel");
            if (document.getElementById(id)) {
              e.preventDefault();
              history.replaceState(null, "", "#" + id);
              reveal(id, true);
            }
          });
        });

        // Deep link: a URL ending in #p-schedule (etc.) arrives with that panel open.
        if (location.hash.length > 1) reveal(location.hash.slice(1), false);
      }

      /* ---------------- disclosure panels ----------------
         Each panel is a native <details>: keyboard-operable, no JS to open, and
         collapsed by default so the page arrives calm. The schedule opens first
         so the section never reads as an empty stack of closed doors.
      */
      /* Caveats, sources and footnote keys are load-bearing for trust — a civic
         data page that hides how its numbers were derived isn't worth much — but
         they are not what anyone arrives to read, and left inline they were more
         than half the words on the page. Each set gets a closed disclosure
         instead: still one click from the chart it belongs to, still exportable,
         still in the DOM for search, and out of the way of the argument. */
      function finePrint(label, bodyHtml) {
        return `
        <details class="fine">
          <summary>${CT.escapeHtml(label)}</summary>
          <div class="fine-body">${bodyHtml}</div>
        </details>`;
      }

      // The title is a real <h3>, not a styled <b>. A summary may contain heading
      // content, and without it these four sections are invisible to the document
      // outline — a screen-reader user scanning by heading would jump straight
      // from "Where all of this comes from" to the meeting groups inside the last
      // panel, with no way to tell the four panels apart.
      function panel(title, sub, bodyHtml, open, id) {
        return `
        <details class="panel"${id ? ` id="${id}"` : ""}${open ? " open" : ""}>
          <summary>
            <span class="panel-tt">
              <h3>${title}</h3>
              <span>${sub}</span>
            </span>
            <span class="panel-chev" aria-hidden="true"></span>
          </summary>
          <div class="panel-body">${bodyHtml}</div>
        </details>`;
      }

      /* ---------------- the schedule as read ----------------
         The schedule Mayor Gray read on June 16 (meeting #726, item 17.B), line
         item for line item, in his order.

         The percentage line is the one figure not reproduced as spoken. The
         mayor read 218%, which is 0.001700 against 0.000534 — the rate then in
         effect, because the county had not yet returned the recalculated
         certified rate. The row states the 220.9% from the city's own
         Truth-in-Taxation notice instead, measured against the recalculated
         certified rate the county returned on June 22.

         Both of those numbers are now under the table, because a table billed as
         "read aloud on June 16" cannot quietly carry a figure that was not. The
         footnote owns one more wrinkle: 220.9% does not fall out of the
         arithmetic. The city never published the certified rate as a rate
         — the notice's $314.03 on a $488,000 home implies 0.00053014, its own
         220.9% implies 0.00052976, and both round to the 0.000530 shown here,
         which gives 220.8%. A tenth of a point, and the page states it rather
         than leaving a reader to find it with a calculator.

         Note it is a rate-to-rate figure either way. The schedule's own revenue
         lines — $2,839,998 against $9,798,139 — imply 245%, a different measure,
         which is why this row is not labelled as a change in revenue.
      */
      function schedulePanel(tax) {
        const cur = tax.rates.current, prop = tax.rates.proposed;
        const certified = tax.rates.certified_2026;
        const home = tax.as_read.home, biz = tax.as_read.business;
        // Both worked from the data, so neither can drift if a rate is revised:
        // what the rounded certified rate actually gives, and what was read on
        // the night. Each clause renders only when it differs from the row.
        const derived = ((prop.rate / certified.rate - 1) * 100).toFixed(1);
        const gapNote =
          derived !== String(prop.pct)
            ? ` Worked from the rounded ${CT.escapeHtml(certified.rate_display)}, the same
                comparison gives +${derived}% — the city has never published the certified rate
                as a rate, and the tenth of a point is rounding inside it.`
            : "";
        const asReadNote =
          tax.as_read.pct !== prop.pct
            ? ` <strong>On the night, this line was read as +${tax.as_read.pct}%</strong> —
                the same ${CT.escapeHtml(prop.rate_display)} measured against the
                ${cur.rate.toFixed(6)} then in effect, because Utah County did not return the
                recalculated certified rate until June 22. Every other figure in this table is
                as read.`
            : "";
        // The proposed column reproduces the dollar figures the mayor read aloud rather
        // than recomputing them from the rounded rate, so the table matches the record
        // to the cent. The current column is arithmetic on a rate that is already exact.
        const homeNow = home.market_value * tax.residential_ratio * cur.rate;
        const bizNow = biz.market_value * cur.rate;
        const body = `
          <p class="panel-intro">
            Read aloud on <a href="meetings.html?id=${tax.as_read.meeting_id}">June 16</a>, transcribed
            from the recording.
          </p>
          <div class="tablewrap">
            <table class="data schedule">
              <thead>
                <tr>
                  <th scope="col">City property tax</th>
                  <th scope="col" class="num">Current</th>
                  <th scope="col" class="num">Proposed</th>
                </tr>
              </thead>
              <tbody>
                <tr><td class="rowlabel">Tax rate</td>
                  <td class="num">${cur.rate.toFixed(6)}</td>
                  <td class="num">${CT.escapeHtml(prop.rate_display)}</td></tr>
                <tr><td class="rowlabel">Revenue to the city</td>
                  <td class="num">${usd0(cur.revenue)}</td>
                  <td class="num">${usd0(prop.revenue)}</td></tr>
                <tr><td class="rowlabel">New revenue to the city</td>
                  <td class="num">—</td>
                  <td class="num">+${usd0(tax.revenue_increase)}</td></tr>
                <tr><td class="rowlabel">Increase over the certified rate <span class="ast" aria-hidden="true">*</span></td>
                  <td class="num">—</td>
                  <td class="num">+${prop.pct}%</td></tr>
                <tr><td class="rowlabel">Tax on a ${usd0(home.market_value)} home</td>
                  <td class="num">${usd(homeNow)}</td>
                  <td class="num">${usd(home.proposed)} <span class="rise">+${usd(home.increase)}</span></td></tr>
                <tr><td class="rowlabel">Tax on the average business (${usd0(biz.market_value)})</td>
                  <td class="num">${usd(bizNow)}</td>
                  <td class="num">${usd(biz.proposed)} <span class="rise">+${usd(biz.increase)}</span></td></tr>
              </tbody>
            </table>
          </div>
          <p class="chart-foot">
            <span aria-hidden="true">*</span> <strong>+${prop.pct}%</strong> is
            ${CT.escapeHtml(prop.rate_display)} against the ${CT.escapeHtml(certified.rate_display)}
            certified rate — the comparison the city's own notice uses, and the figure it
            states.${gapNote}${asReadNote}
          </p>
`;
        return panel("The official schedule", "The six lines of the city's Truth-in-Taxation schedule", body, true, "p-schedule");
      }

      /* ---------------- the whole bill ----------------
         The estimator answers "what does the city take?", and a reader who
         stops there can be left thinking the city's line is the property tax.
         It isn't: seven entities levy on an Eagle Mountain parcel, and the city
         is the fourth largest of them. This panel lays out all seven at their
         2025 final adopted rates — the ones on today's bills — so the city's
         proposal can be read against the bill it actually belongs to.

         The rates are fixed 2025 figures and the bars are drawn from them, so
         bar geometry never changes. Only the dollar figures move, and they
         follow the market value and property type entered in the estimator —
         every element carrying a dollar amount declares the rate it is derived
         from in `data-billrate`, and the sync function does the arithmetic.
      */
      function billSection(bill, tax) {
        const ents = [...bill.entities].sort((a, b) => b.rate - a.rate);
        const total = ents.reduce((s, e) => s + e.rate, 0);
        const city = ents.find((e) => e.is_city);
        const cityPos = ents.indexOf(city) + 1;
        const max = ents[0].rate;
        const share = (r) => (r / total) * 100;
        const pct1 = (n) => n.toFixed(1) + "%";
        // Summed rates land on 0.009376999999999998 in binary floating point;
        // the data attribute the sync reads back should carry the rate, not the
        // error term.
        const attrRate = (r) => r.toFixed(9);

        // What the city's proposal would do to the bill as a whole, holding
        // every other entity at its 2025 rate — the only honest way to state
        // it, since no other entity has set a 2026 rate yet.
        const prop = tax.rates.proposed.rate;
        const propTotal = total - city.rate + prop;
        const propPos = ents.filter((e) => !e.is_city && e.rate > prop).length + 1;
        const raised = ents.filter((e) => e.rate > e.certified).length;

        // One row per levy, laid out like the bill itself: who takes it, how much
        // of the whole it is, and what that comes to on this property. The bar
        // geometry is fixed 2025 rates; only the dollar column moves.
        const bars = ents
          .map((e) => {
            const tip = `${e.name} — ${rate6(e.rate)}, ${pct1(share(e.rate))} of the bill · ${e.what}`;
            return `
              <div class="levy-row ${e.is_city ? "is-city" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <div class="levy-name">${CT.escapeHtml(e.short)}</div>
                <div class="levy-bar-wrap">
                  <span class="levy-track">
                    <span class="levy-bar ${e.is_city ? "is-city" : ""}" style="width:${((e.rate / max) * 100).toFixed(2)}%"></span>
                  </span>
                  <span class="mono levy-rate">${rate6(e.rate)}</span>
                </div>
                <div class="mono levy-share">${pct1(share(e.rate))}</div>
                <div class="mono levy-amt" data-billrate="${attrRate(e.rate)}"></div>
              </div>`;
          })
          .join("");

        const rows = ents
          .map(
            (e) => `
              <tr${e.is_city ? ' class="is-city"' : ""}>
                <td class="rowlabel">
                  <b>${CT.escapeHtml(e.name)}</b>
                  <span class="bill-what">${CT.escapeHtml(e.what)}</span>
                </td>
                <td class="num">${rate6(e.rate)}</td>
                <td class="num">${pct1(share(e.rate))}</td>
                <td class="num" data-billrate="${attrRate(e.rate)}"></td>
              </tr>`
          )
          .join("");

        return `
          <section class="tax-sec reveal" style="--i:3" id="s-bill" aria-labelledby="bill-title">
            <div class="sec-head">
              <p class="eyebrow"><span class="sec-num" aria-hidden="true">01</span>Where your money goes</p>
              <h2 class="sec-h2" id="bill-title">The city gets ${Math.round(share(city.rate))}&cent; of every property tax dollar</h2>
              <p class="sec-sub">
                ${cap(numWord(ents.length))} different bodies tax your home, and the City Council
                controls only one of them. Schools take the most by far.
              </p>
            </div>

            <figure class="levy" data-tipscope>
              <figcaption class="sr-only">
                ${bill.rate_year} final adopted property tax rates for tax area ${CT.escapeHtml(bill.tax_area.code)},
                and what each takes from the property entered in the estimator.
              </figcaption>
              <div class="levy-head">
                <div>Who taxes your home</div>
                <div>Rate</div>
                <div>Share</div>
                <div data-billnoun="head"></div>
              </div>
              ${bars}
              <div class="levy-total">
                <div>Total property tax</div>
                <div class="levy-bar-wrap">
                  <span class="levy-track"></span>
                  <span class="mono levy-rate levy-rate-total">${rate6(total)}</span>
                </div>
                <div class="mono levy-share">100%</div>
                <div class="mono levy-amt" data-billrate="${attrRate(total)}"></div>
              </div>
            </figure>

            <div class="note">
              <b>If the city's proposal passes</b>
              <p>
                Your whole bill goes from
                <strong><span data-billrate="${attrRate(total)}"></span></strong> to
                <strong><span data-billrate="${attrRate(propTotal)}"></span></strong> — up
                ${pct1(((propTotal - total) / total) * 100)} — and the city moves from the
                ${ordinal(cityPos)}-largest line on it to the ${ordinal(propPos)}-largest.
              </p>
              <p class="note-fine">Every other entity held at its ${bill.rate_year} rate; none has set a
                ${bill.rate_year + 1} rate yet.</p>
            </div>

            ${
              /* The table carries what the compact rows can't: what each entity
                 actually does with the money. It is also what the export toolbar
                 hangs off, so the numbers can be taken away as CSV. */ ""
            }
            <details class="tableview">
              <summary>See what each one pays for</summary>
              <div class="tablewrap">
                <table class="data bill" id="bill-breakdown">
                  <thead>
                    <tr>
                      <th scope="col">Who taxes your home</th>
                      <th scope="col" class="num">${bill.rate_year} rate</th>
                      <th scope="col" class="num">Share</th>
                      <th scope="col" class="num" data-billnoun="head"></th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rows}
                    <tr class="is-total">
                      <td class="rowlabel"><b>Total property tax</b></td>
                      <td class="num">${rate6(total)}</td>
                      <td class="num">100%</td>
                      <td class="num" data-billrate="${attrRate(total)}"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </details>

            ${finePrint(
              "About these numbers",
              `<ul>
                ${bill.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}
                <li>${CT.escapeHtml(bill.tax_area.note)}
                  <ul>
                    ${bill.variants
                      .map((v) => `<li><b>${CT.escapeHtml(v.name)}</b> — ${CT.escapeHtml(v.note)}</li>`)
                      .join("")}
                  </ul>
                </li>
              </ul>
              <p class="src">
                Rates: <a href="${bill.source.url}" rel="nofollow noopener">${CT.escapeHtml(bill.source.title)}</a>,
                ${CT.escapeHtml(bill.source.publisher)} — ${CT.escapeHtml(bill.source.page)},
                published ${CT.fmtDate(bill.source.published)}.
              </p>`
            )}
          </section>`;
      }

      /* The estimator drives this panel's dollar figures. Everything carrying a
         `data-billrate` is a rate times the taxable value; everything carrying
         `data-billnoun` is the phrase describing the property those figures are
         about. Nothing structural is rewritten, so the export toolbar attached
         under the table survives every update and exports what is on screen. */
      let BILL_SYNC = null;

      function wireBillPanel(bill) {
        const root = document.getElementById("s-bill");
        if (!root) return;
        const figs = [...root.querySelectorAll("[data-billrate]")];
        const nouns = [...root.querySelectorAll("[data-billnoun]")];

        BILL_SYNC = (marketValue, isPrimary) => {
          const taxable = marketValue * (isPrimary ? bill.residential_ratio : 1);
          figs.forEach((el) => {
            el.textContent = usd(taxable * parseFloat(el.dataset.billrate));
          });
          // A column header has to stay short; a sentence can say the whole
          // thing, including that a non-primary property is taxed on its full
          // value rather than 55% of it.
          nouns.forEach((el) => {
            el.textContent =
              el.dataset.billnoun === "head"
                ? isPrimary
                  ? `On a ${usd0(marketValue)} home`
                  : `On ${usd0(marketValue)} of other property`
                : isPrimary
                  ? `a ${usd0(marketValue)} primary residence`
                  : `a ${usd0(marketValue)} business or rental property`;
          });
        };

        // A first pass at the panel's own default, so the markup is never blank
        // if the estimator hasn't painted yet.
        BILL_SYNC(bill.sample_value, true);
      }

      /* ---------------- the paper trail ---------------- */
      function sourcePanel(tax) {
        const body = `
          <blockquote class="record">
            <p>“${CT.escapeHtml(tax.source.quote)}”</p>
            <footer>
              ${CT.escapeHtml(tax.source.speaker)}, reading the required tax schedule —
              <a href="meetings.html?id=${tax.source.meeting_id}">meeting #${tax.source.meeting_id}, ${CT.fmtDate(tax.source.date)}</a>
            </footer>
          </blockquote>

          <p class="derivation">
            <strong>How the proposed rate checks out.</strong> ${CT.escapeHtml(tax.rates.proposed.derivation)}
          </p>

          <p class="derivation">
            <strong>Minutes and recording.</strong> ${CT.escapeHtml(tax.source.minutes)}
            Council approved the June 16 minutes on ${CT.fmtDate(tax.source.minutes_approved)}.
          </p>`;
        return panel("Where these numbers come from", "The quote on the record, and the arithmetic that reproduces it", body, false, "p-source");
      }

      /* ---------------- county comparison charts ----------------
         Two measures (a rate, and a percent change) never share one axis, so
         they are two charts. Each is a single series: every bar the same
         recessive ink, Eagle Mountain lifted out in the accent. The accent /
         neutral pair clears CVD separation in both themes; the proposed
         segment is told apart by texture and a direct label, not a second hue.
      */

      const EM = "Eagle Mountain";
      const rate6 = (r) => r.toFixed(6);
      function ordinal(n) {
        if (n % 100 >= 11 && n % 100 <= 13) return n + "th";
        return n + ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
      }

      function countySection(c) {
        const utahN = c.cities.length;
        const sl = c.salt_lake;

        const utahNotes = finePrint(
          "About these numbers",
          `<ul>${c.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}</ul>
            <p class="src">
              Rates: <a href="${c.rate_source.url}" rel="nofollow noopener">${CT.escapeHtml(c.rate_source.title)}</a>,
              ${CT.escapeHtml(c.rate_source.publisher)}.
              Proposed increases: <a href="${c.proposal_source.url}" rel="nofollow noopener">${CT.escapeHtml(c.proposal_source.publisher)}</a>,
              reporting the ${c.proposal_year} truth-in-taxation notices.
            </p>`
        );

        return `
          <section class="tax-sec reveal" style="--i:4" id="s-compare" aria-labelledby="compare-title">
            <div class="sec-head">
              <p class="eyebrow"><span class="sec-num" aria-hidden="true">02</span>Compared to nearby cities</p>
              <h2 class="sec-h2" id="compare-title">Eagle Mountain charges less than almost everyone</h2>
              <p class="sec-sub">
                Eagle Mountain has the <strong>second-lowest</strong> city rate of the ${utahN} in Utah
                County today. The proposal would make it the <strong>third-highest</strong>.
              </p>
            </div>

          ${sl ? `<div class="switch-row">
            <p class="switch-label" id="scope-hint">Compare against</p>
            <div class="scope-switch" role="radiogroup" aria-labelledby="scope-hint">
              <button type="button" role="radio" id="scope-utah" data-scope="utah" aria-checked="true" tabindex="0">Utah County</button>
              <button type="button" role="radio" id="scope-slc" data-scope="slc" aria-checked="false" tabindex="-1">Salt Lake County</button>
            </div>
          </div>` : ""}

          <div class="county">
            <div class="scope-panel" data-scope-panel="utah">
              <div class="switch-row">
                <p class="switch-label" id="view-utah">View</p>
                <div class="chart-tabs" role="tablist" aria-labelledby="view-utah">
                  <button role="tab" id="tab-rate" aria-controls="panel-rate" aria-selected="true" tabindex="0">
                    Rate today
                  </button>
                  <button role="tab" id="tab-inc" aria-controls="panel-inc" aria-selected="false" tabindex="-1">
                    Proposed increase
                  </button>
                </div>
              </div>
              <div role="tabpanel" id="panel-rate" aria-labelledby="tab-rate">${rateChartHtml(c)}</div>
              <div role="tabpanel" id="panel-inc" aria-labelledby="tab-inc" hidden>${increaseChartHtml(c)}</div>
              ${utahNotes}
            </div>

            ${sl ? `<div class="scope-panel" data-scope-panel="slc" hidden>
              <div class="switch-row">
                <p class="switch-label" id="view-slc">View</p>
                <div class="chart-tabs" role="tablist" aria-labelledby="view-slc">
                  <button role="tab" id="tab-sl-rate" aria-controls="panel-sl-rate" aria-selected="true" tabindex="0">
                    Rate today
                  </button>
                  <button role="tab" id="tab-sl-inc" aria-controls="panel-sl-inc" aria-selected="false" tabindex="-1">
                    Proposed increase
                  </button>
                </div>
              </div>
              <div role="tabpanel" id="panel-sl-rate" aria-labelledby="tab-sl-rate">${saltLakeChartHtml(sl)}</div>
              <div role="tabpanel" id="panel-sl-inc" aria-labelledby="tab-sl-inc" hidden>${saltLakeIncreaseChartHtml(sl)}</div>
              ${saltLakeNotes(sl)}
            </div>` : ""}
          </div>
          </section>`;
      }

      /* --- Salt Lake County: current rates, Eagle Mountain dropped in as a
         dashed out-of-county reference so you can read where it would fall.
         Salt Lake County's metro townships and several cities fund police and
         fire through separate county service areas, so their city-levy bars
         understate what residents pay — flagged with † and spelled out below. */
      function saltLakeChartHtml(sl) {
        const em = sl.eagle_mountain;
        const ref = { name: EM, current_rate: sl.reference.current_rate, isRef: true };
        const rows = [...sl.cities, ref].sort((a, b) => b.current_rate - a.current_rate);
        const max = axisMax(rows.map((r) => r.current_rate));
        // Salt Lake County's own median: Eagle Mountain is a visitor on this
        // chart and must not shift the middle of the county it is measured against.
        const med = medianLine(sl.cities.map((r) => r.current_rate), max, "median");
        let offCount = 0;

        const bars = rows
          .map((r) => {
            const isRef = r.isRef;
            const off = r.current_rate > max;
            if (off) offCount++;
            const frac = Math.min(Math.max(r.current_rate / max, 0.004), 1);
            const ext = r.external_services ? '<span class="ast" aria-hidden="true">†</span>' : "";
            const tip = isRef
              ? `${EM} — ${rate6(r.current_rate)} (Utah County, shown for comparison)`
              : `${r.name} — ${rate6(r.current_rate)}${r.external_services ? " · general city levy only; funds police/fire through separate service areas" : ""}`;
            return `
              <div class="crow ${isRef ? "is-em is-ref" : ""} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(isRef ? EM : r.name)}${ext}</span>
                <span class="ctrack">
                  <span class="cbar ${isRef ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(frac)}"></span>
                  ${med.tick}
                  ${valCell(frac, off, rate6(r.current_rate))}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart">
          <figcaption>
            <h3>City property tax rate, today — Salt Lake County</h3>
            <p>Each city's own general levy. Eagle Mountain is dropped in dashed, as an
               out-of-county reference.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>City levy</span>
            <span class="lg"><i class="sw sw-ref"></i>Eagle Mountain (reference)</span>
            ${MED_LEGEND}
          </div>
          <div class="chart-body">${med.rail}${bars}</div>
          <p class="chart-foot">
            Dashed line: the median Salt Lake County city levy, ${rate6(med.value)} — Eagle Mountain,
            as a visitor here, is left out of it.
            <span aria-hidden="true">†</span> Funds police/fire through separate service districts, not shown
            in these bars.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "City levy"],
            rows.map((r) => [r.isRef ? EM + " (ref.)" : r.name, rate6(r.current_rate)])
          )}
        </figure>`;
      }

      /* --- Salt Lake County chart 2: where the 2026 proposals would leave each
         city. Same cities, same rate axis as the current-rate chart, re-sorted by
         the rate each would end up at. Solid segment = today's rate; hatched
         segment = the noticed increase on top. Eagle Mountain is kept as the same
         dashed out-of-county reference, now showing its proposed rate. */
      function saltLakeIncreaseChartHtml(sl) {
        const em = sl.eagle_mountain;
        const ref = {
          name: EM,
          current_rate: sl.reference.current_rate,
          resulting_rate: sl.reference.proposed_rate,
          isRef: true,
        };
        const resOf = (r) => (r.isRef ? r.resulting_rate : resultingRate(sl, r));
        const all = [...sl.cities, ref];
        const nowRank = new Map(
          [...all].sort((a, b) => b.current_rate - a.current_rate).map((x, i) => [x.name, i + 1])
        );
        const rows = [...all].sort((a, b) => resOf(b) - resOf(a));
        const max = axisMax(rows.map(resOf));
        const med = medianLine(sl.cities.map(resOf), max, "median"); // county only — see chart 1
        const proposing = sl.proposals.length;
        let offCount = 0;
        // Rank Eagle Mountain's proposed rate against everyone's *resulting* rate
        // (each city's own increase applied), so the caption can't drift from the bars.
        const emResRank = rows.findIndex((r) => r.isRef) + 1;

        const bars = rows
          .map((r, i) => {
            const isRef = r.isRef;
            const p = isRef ? null : proposalFor(sl, r.name);
            const res = resOf(r);
            const off = res > max;
            if (off) offCount++;
            const fNow = Math.min(Math.max(r.current_rate / max, 0.004), 1);
            const fRes = Math.min(res / max, 1);
            const hasInc = isRef || !!p;
            const moved = nowRank.get(r.name) - (i + 1);

            const ext = !isRef && r.external_services ? '<span class="ast" aria-hidden="true">†</span>' : "";
            const levy = p && p.levy ? '<span class="ast" aria-hidden="true">‡</span>' : "";

            const tip = isRef
              ? `${EM} — ${rate6(r.current_rate)} → ${rate6(res)} (Utah County, shown for comparison)`
              : p
                ? `${r.name} — ${rate6(r.current_rate)} → ${rate6(res)} (+${p.pct}%, derived rate) · ${p.purpose}`
                : `${r.name} — no increase noticed; holds at ${rate6(r.current_rate)}`;

            return `
              <div class="crow ${isRef ? "is-em is-ref" : ""} ${hasInc ? "" : "no-prop"} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(isRef ? EM : r.name)}${ext}${levy}</span>
                <span class="ctrack">
                  ${hasInc ? `<span class="cbar cprop ${isRef ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(fRes)}"></span>` : ""}
                  <span class="cbar ${isRef ? "cem" : ""} ${off && !hasInc ? "bar-off" : ""}" style="width:${barSpan(fNow)}"></span>
                  ${med.tick}
                  ${valCell(fRes, off, `${rate6(res)}${moved > 0 ? `<span class="cmove up" aria-hidden="true">▲${moved}</span><span class="sr-only"> up ${moved} places</span>` : ""}`)}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart chart--wide-val">
          <figcaption>
            <h3>Where the ${sl.proposal_year} proposals would leave each city — Salt Lake County</h3>
            <p>${proposing} of ${sl.cities.length} cities noticed a ${sl.proposal_year} increase.
               Eagle Mountain is the dashed reference.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Rate today</span>
            <span class="lg"><i class="sw sw-prop-neutral"></i>Proposed increase</span>
            <span class="lg"><i class="sw sw-ref"></i>Eagle Mountain (reference)</span>
            ${MED_LEGEND}
          </div>
          <div class="chart-body">${med.rail}${bars}</div>
          <p class="chart-foot">
            Dashed line: the median Salt Lake County rate if every proposal passes, ${rate6(med.value)}.
            <span aria-hidden="true">†</span> Funds police/fire through separate service districts.
            <span aria-hidden="true">‡</span> Dedicated levy, not the general rate.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "Rate today", "Rate if it passes", "Increase", "Purpose"],
            rows.map((r) => {
              const p = r.isRef ? null : proposalFor(sl, r.name);
              return [
                r.isRef ? EM + " (ref.)" : r.name,
                rate6(r.current_rate),
                rate6(resOf(r)),
                r.isRef ? "reference" : p ? `+${p.pct}% (${p.rate_source})` : "No increase noticed",
                r.isRef ? "—" : p ? p.purpose : "—",
              ];
            })
          )}
        </figure>`;
      }

      function saltLakeNotes(sl) {
        return finePrint(
          "About these numbers",
          `<ul>${sl.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}</ul>
            <p class="src">
              Rates: <a href="${sl.rate_source.url}" rel="nofollow noopener">${CT.escapeHtml(sl.rate_source.title)}</a>,
              ${CT.escapeHtml(sl.rate_source.publisher)} — ${sl.rate_year} final adopted, city levy only.
              ${sl.proposal_source ? `Proposed increases: <a href="${sl.proposal_source.notice_url || sl.proposal_source.url}" rel="nofollow noopener">Salt Lake County ${sl.proposal_year} truth-in-taxation notices</a> (per-city purposes via <a href="${sl.proposal_source.url}" rel="nofollow noopener">${CT.escapeHtml(sl.proposal_source.publisher)}</a>).` : ""}
            </p>`
        );
      }

      // Both charts list the same cities in the same order, so toggling swaps the
      // values in place instead of reshuffling the rows out from under the reader.
      const cityOrder = (c) => [...c.cities].sort((a, b) => b.current_rate - a.current_rate);
      const proposalFor = (c, name) => c.proposals.find((p) => p.city === name) || null;

      /* --- shared bar geometry ---------------------------------------------
         Linear-interpolated quantile over an ascending array — the same
         definition a spreadsheet's PERCENTILE uses. One implementation for the
         axis's outlier fence, the charts' median line and the statewide quartile
         cuts, so those three can never disagree about where the 75th percentile
         of the same numbers is. */
      function quantileOf(asc, p) {
        const i = (asc.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
        return asc[lo] + (asc[hi] - asc[lo]) * (i - lo);
      }
      const quantile = (values, p) => quantileOf([...values].sort((a, b) => a - b), p);
      const medianOf = (values) => quantile(values, 0.5);

      /* A couple of cities (e.g. Vineyard) levy ~2x everyone else, and left to
         their own devices they stretch the axis so the other two dozen — the
         middle of the pack, where Eagle Mountain lives — collapse into unreadable
         stubs. So the axis maxes out at the top of the *main cluster*, not the
         literal max: anything past the Tukey upper fence (Q3 + 1.5·IQR) is drawn
         to the edge and flagged as running off the top of the scale. When the
         data has no such outlier the fence catches nothing and this is just
         max·1.02, exactly as before. Recomputed per chart so the weekly ingest
         can move the cutoff on its own. */
      function axisMax(values) {
        const v = [...values].sort((a, b) => a - b);
        const q3 = quantileOf(v, 0.75), q1 = quantileOf(v, 0.25);
        const fence = q3 + 1.5 * (q3 - q1);
        const inRange = v.filter((x) => x <= fence);
        return (inRange.length ? inRange[inRange.length - 1] : v[v.length - 1]) * 1.02;
      }
      // Each bar is drawn to a fraction of (track width − label gutter), so the
      // value can ride just past the bar's end without ever overflowing the row.
      const barSpan = (frac) => `calc(${frac.toFixed(4)} * (100% - var(--track-gutter)))`;
      const valCell = (frac, off, inner) =>
        `<span class="cval" style="left:${barSpan(frac)}">${inner}${off ? '<span class="offmark" aria-hidden="true"> ↑</span>' : ""}</span>`;
      const OFF_NOTE = `<span aria-hidden="true">↑</span> Past the top of the scale; exact figure still shown.`;

      /* --- the median line -------------------------------------------------
         Bars sorted high to low answer "who is highest" but never "what is
         normal", so a chart of two dozen cities leaves the reader to eyeball the
         middle. A dashed rule at the median of the values the chart draws gives
         every bar a second reading: above the middle city, or below it.

         It is drawn as a tick inside each row's track rather than as one rule
         laid over the chart, because the geometry underneath it moves — the name
         column and the value gutter are both narrower on a phone — and an
         overlay positioned in page pixels would slide off the bars at the first
         breakpoint. Each tick inherits the track it sits in, so the line stays
         on the number at every width. The label rides in a header rail built
         from the same row grid, for the same reason.

         The rule and its flag are decoration: the figure is also stated in the
         chart's footnote, which is what a screen reader gets. */
      function medianLine(values, max, label) {
        const med = medianOf(values);
        const at = barSpan(Math.min(Math.max(med / max, 0), 1));
        return {
          value: med,
          tick: `<span class="mtick" style="left:${at}" aria-hidden="true"></span>`,
          rail: `
            <div class="crow medrow" aria-hidden="true">
              <span class="cname medname">${CT.escapeHtml(label)}</span>
              <span class="ctrack"><span class="mflag" style="left:${at}">${rate6(med)}</span></span>
            </div>`,
        };
      }
      const MED_LEGEND = `<span class="lg"><i class="sw sw-med"></i>Median</span>`;

      /* --- chart 1: current rate only, no proposal --- */
      function rateChartHtml(c) {
        const rows = cityOrder(c);
        const max = axisMax(rows.map((r) => r.current_rate));
        const med = medianLine(rows.map((r) => r.current_rate), max, "median");
        let offCount = 0;

        const bars = rows
          .map((r) => {
            const isEM = r.name === EM;
            const off = r.current_rate > max;
            if (off) offCount++;
            const frac = Math.min(r.current_rate / max, 1);
            const tip = `${r.name} — ${rate6(r.current_rate)}${r.mostly_other_county ? " (mostly Salt Lake Co.)" : ""}`;
            return `
              <div class="crow ${isEM ? "is-em" : ""} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(r.name)}${r.mostly_other_county ? '<span class="ast" aria-hidden="true">*</span>' : ""}</span>
                <span class="ctrack">
                  <span class="cbar ${isEM ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(frac)}"></span>
                  ${med.tick}
                  ${valCell(frac, off, rate6(r.current_rate))}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart">
          <figcaption>
            <h3>City property tax rate, today</h3>
            <p>Utah County municipalities, city levy only.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Current rate</span>
            <span class="lg"><i class="sw sw-em"></i>Eagle Mountain</span>
            ${MED_LEGEND}
          </div>
          <div class="chart-body">${med.rail}${bars}</div>
          <p class="chart-foot">
            Dashed line: the median Utah County city levy, ${rate6(med.value)} — half of these
            ${rows.length} cities charge more, half less.
            <span aria-hidden="true">*</span> Mostly in Salt Lake County.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(["City", "Current rate"], rows.map((r) => [r.name, rate6(r.current_rate)]))}
        </figure>`;
      }

      /* --- chart 2: where the proposals leave each city ---
         Same 26 cities, same rate axis as chart 1, re-sorted by the rate each
         city would end up at. Solid segment = today's rate; hatched segment =
         the proposed increase on top of it.
      */
      const resultingRate = (c, city) => {
        const p = proposalFor(c, city.name);
        return p ? p.resulting_rate : city.current_rate;
      };

      function increaseChartHtml(c) {
        const nowRank = new Map(cityOrder(c).map((x, i) => [x.name, i + 1]));
        const rows = [...c.cities].sort((a, b) => resultingRate(c, b) - resultingRate(c, a));
        const max = axisMax(rows.map((r) => resultingRate(c, r)));
        const med = medianLine(rows.map((r) => resultingRate(c, r)), max, "median");
        const proposing = c.proposals.length;
        let offCount = 0;

        const bars = rows
          .map((city, i) => {
            const p = proposalFor(c, city.name);
            const isEM = city.name === EM;
            const res = resultingRate(c, city);
            const off = res > max;
            if (off) offCount++;
            const fNow = Math.min(city.current_rate / max, 1);
            const fRes = Math.min(res / max, 1);
            const moved = nowRank.get(city.name) - (i + 1);

            const mark = p && p.rate_source === "approximate" ? '<span class="ast" aria-hidden="true">‡</span>' : "";
            const levy = p && p.levy ? '<span class="ast" aria-hidden="true">†</span>' : "";

            const tip = p
              ? `${city.name} — ${rate6(city.current_rate)} → ${rate6(res)} (+${p.pct}%, ${p.rate_source === "published" ? "published rate" : p.rate_source + " rate"}) · ${p.purpose}`
              : `${city.name} — no increase proposed; holds at ${rate6(city.current_rate)}`;

            return `
              <div class="crow ${isEM ? "is-em" : ""} ${p ? "" : "no-prop"} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(city.name)}${levy}${mark}</span>
                <span class="ctrack">
                  ${p ? `<span class="cbar cprop ${isEM ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(fRes)}"></span>` : ""}
                  <span class="cbar ${isEM ? "cem" : ""} ${off && !p ? "bar-off" : ""}" style="width:${barSpan(fNow)}"></span>
                  ${med.tick}
                  ${valCell(fRes, off, `${rate6(res)}${moved > 0 ? `<span class="cmove up" aria-hidden="true">▲${moved}</span><span class="sr-only"> up ${moved} places</span>` : ""}`)}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart chart--wide-val">
          <figcaption>
            <h3>Where the ${c.proposal_year} proposals would leave each city</h3>
            <p>${proposing} of ${rows.length} cities are proposing an increase. Re-sorted by the rate
               each would end up at.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Rate today</span>
            <span class="lg"><i class="sw sw-prop-neutral"></i>Proposed increase</span>
            <span class="lg"><i class="sw sw-em"></i>Eagle Mountain</span>
            ${MED_LEGEND}
          </div>
          <div class="chart-body">${med.rail}${bars}</div>
          <p class="chart-foot">
            Dashed line: the median rate if every proposal passes, ${rate6(med.value)}.
            <span aria-hidden="true">†</span> Dedicated levy, not the general rate.
            <span aria-hidden="true">‡</span> Approximate.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "Rate today", "Rate if it passes", "Increase", "Purpose"],
            rows.map((city) => {
              const p = proposalFor(c, city.name);
              return [
                city.name,
                rate6(city.current_rate),
                p ? rate6(p.resulting_rate) : rate6(city.current_rate),
                p ? `+${p.pct}% (${p.rate_source})` : "No increase proposed",
                p ? p.purpose : "—",
              ];
            })
          )}
        </figure>`;
      }

      // Tabs: click, plus Left/Right/Home/End per the WAI-ARIA tabs pattern.
      // Each .chart-tabs group is wired independently — the Utah County and Salt
      // Lake County tablists must not deselect each other's panels.
      function wireChartTabs() {
        document.querySelectorAll(".chart-tabs").forEach((group) => {
          const tabs = [...group.querySelectorAll('[role="tab"]')];
          if (!tabs.length) return;

          const select = (tab) => {
            tabs.forEach((t) => {
              const on = t === tab;
              t.setAttribute("aria-selected", String(on));
              t.tabIndex = on ? 0 : -1;
              const p = document.getElementById(t.getAttribute("aria-controls"));
              p.hidden = !on;
              // A chart that was hidden never scrolled into view, so its bars are
              // still armed at zero width. Draw them now that it is on screen.
              if (on) revealBars(p);
            });
            tab.focus();
          };

          tabs.forEach((tab, i) => {
            tab.addEventListener("click", () => select(tab));
            tab.addEventListener("keydown", (e) => {
              const k = e.key;
              let next = null;
              if (k === "ArrowRight") next = tabs[(i + 1) % tabs.length];
              else if (k === "ArrowLeft") next = tabs[(i - 1 + tabs.length) % tabs.length];
              else if (k === "Home") next = tabs[0];
              else if (k === "End") next = tabs[tabs.length - 1];
              if (next) {
                e.preventDefault();
                select(next);
              }
            });
          });
        });
      }

      // Every chart ships a table view — identity is never carried by color alone.
      function tableView(head, rows) {
        return `
        <details class="tableview">
          <summary>View as table</summary>
          <div class="tablewrap">
            <table class="data">
              <thead><tr>${head.map((h) => `<th scope="col">${CT.escapeHtml(h)}</th>`).join("")}</tr></thead>
              <tbody>${rows
                .map((r) => `<tr>${r.map((cell) => `<td>${CT.escapeHtml(String(cell))}</td>`).join("")}</tr>`)
                .join("")}</tbody>
            </table>
          </div>
        </details>`;
      }

      /* ---------------- table export ----------------
         Every data table on the page — the official schedule, each chart's
         "View as table" fallback, and the statewide rankings — gets a small
         toolbar beneath it to take the numbers away as CSV or onto the
         clipboard. The rendered DOM is the single source, so whatever rows and
         sort order the reader is looking at is exactly what exports. Wired once,
         after render, so it covers tables added by any panel without each panel
         having to opt in. */
      function wireTableExports() {
        document.querySelectorAll("table.data").forEach((table, i) => {
          const anchor = table.closest(".tablewrap") || table;
          const after = anchor.nextElementSibling;
          if (after && after.classList.contains("table-export")) return; // idempotent

          const name = exportName(table, i);
          const bar = document.createElement("div");
          bar.className = "table-export";
          bar.innerHTML = `
            <span class="tx-exp-label">Export</span>
            <button type="button" class="tx-exp-btn" data-act="csv">Download CSV</button>
            <button type="button" class="tx-exp-btn" data-act="copy">Copy</button>
            <span class="tx-exp-note" role="status" aria-live="polite"></span>`;
          anchor.after(bar);

          const note = bar.querySelector(".tx-exp-note");
          let noteTimer = 0;
          const flash = (msg) => {
            note.textContent = msg;
            clearTimeout(noteTimer);
            noteTimer = setTimeout(() => { note.textContent = ""; }, 2500);
          };

          bar.querySelector('[data-act="csv"]').addEventListener("click", () => {
            downloadCsv(tableToCsv(table), name + ".csv");
            flash("Downloaded");
          });
          bar.querySelector('[data-act="copy"]').addEventListener("click", async () => {
