            flash((await copyText(tableToCsv(table))) ? "Copied" : "Copy failed");
          });
        });
      }

      // A stable, human-readable filename for the exported table: its own
      // caption or heading, falling back to the panel it lives in.
      function exportName(table, i) {
        const h3 = table.closest("figure")?.querySelector("figcaption h3");
        const summ = table.closest("details.panel")?.querySelector("summary .panel-tt h3");
        const raw = (h3 && h3.textContent) || table.id || (summ && summ.textContent) || `table-${i + 1}`;
        const slug = raw.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
        return "eagle-mountain-" + (slug || "table");
      }

      // A cell's exported text is its visible text minus the decorations that
      // aren't data: sort arrows, rank-move chevrons, the "today/proposed"
      // pill, footnote asterisks, and screen-reader-only spans.
      function cellCsvText(el) {
        const c = el.cloneNode(true);
        c.querySelectorAll(".sarrow, .cmove, .you-pill, .prop-pill, .sr-only, .offmark, .ast").forEach((n) => n.remove());
        return c.textContent.replace(/\s+/g, " ").trim();
      }

      const csvField = (s) => (/[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);

      // What exports is what is on screen: current sort order, and — once the
      // statewide table can be filtered — only the rows that survived the filter.
      // Exporting 253 hidden rows from a table showing three would be a surprise.
      function tableToCsv(table) {
        const line = (tr) => [...tr.querySelectorAll("th,td")].map((c) => csvField(cellCsvText(c))).join(",");
        const lines = [];
        table.querySelectorAll("thead tr").forEach((tr) => lines.push(line(tr)));
        table.querySelectorAll("tbody tr").forEach((tr) => {
          // The percentile dividers are furniture, not rows of data — a spreadsheet
          // wants the 253 cities and their Q column, not three labelled rules.
          if (!tr.hidden && !tr.classList.contains("qdiv")) lines.push(line(tr));
        });
        return lines.join("\r\n");
      }

      function downloadCsv(csv, filename) {
        // A BOM so Excel reads it as UTF-8 (the †/‡ footnote marks survive).
        const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) { /* fall through to the legacy path */ }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch (e) {
          return false;
        }
      }

      /* ---------------- statewide ranking ----------------
         All 253 Utah municipalities ranked by their own city levy — the same
         city-only measure as the county charts. A single sortable table rather
         than a chart: 253 bars would be a wall, but the reader can sort by rank,
         name, or rate and find any city, with Eagle Mountain's row lit up. */
      function statewidePanel(county) {
        const sw = county.statewide;
        const src = county.rate_source;
        const em = sw.eagle_mountain;
        const N = sw.total_cities;

        // Every noticed 2026 proposal this site tracks — Utah County and Salt
        // Lake County both — keyed by city name to its resulting rate, the same
        // figure the county charts draw. Eagle Mountain is pinned to the
        // statewide dataset's own proposed_rate so the two never drift apart.
        const proposedRate = new Map();
        [...(county.proposals || []), ...((county.salt_lake && county.salt_lake.proposals) || [])]
          .forEach((p) => { if (p.resulting_rate != null) proposedRate.set(p.city, p.resulting_rate); });
        proposedRate.set(EM, em.proposed_rate);
        const othersCount = proposedRate.size - 1; // proposing cities besides Eagle Mountain

        // Rank high → low: rank 1 is the highest city levy in the state.
        // Current-rate ranking — all cities as they are billed today, highest first.
        const current = [...sw.cities]
          .sort((a, b) => b.rate - a.rate)
          .map((r, i) => ({ name: r.name, rate: r.rate, rank: i + 1 }));
        const curRank = new Map(current.map((r) => [r.name, r.rank]));

        // Proposed ranking — swap in every tracked proposal's resulting rate and
        // re-rank, still highest first. Cities with no noticed 2026 proposal keep
        // today's rate: Utah's other 2026 rates aren't certified until after the
        // August hearings, so only the proposals this site tracks are placed.
        const proposed = sw.cities
          .map((r) => ({ name: r.name, rate: proposedRate.has(r.name) ? proposedRate.get(r.name) : r.rate }))
          .sort((a, b) => b.rate - a.rate)
          .map((r, i) => ({ name: r.name, rate: r.rate, rank: i + 1 }));

        const emCur = current.find((r) => r.name === EM).rank; // counted from the top
        const emProp = proposed.find((r) => r.name === EM).rank; // counted from the top
        const climbed = emCur - emProp; // places gained climbing toward #1
        const emCurLow = N - emCur + 1; // the same current rank, counted from the bottom

        /* ---- percentile groups ----
           A rank out of 253 is a precise answer to a question nobody asked. What
           a reader wants from a list this long is which part of it they are in,
           so the ranking is cut into four equal groups and every row carries its
           own.

           Cut by position rather than by rate, so the four groups come out the
           same size — 253 doesn't divide by four, so they run 63/64/63/63 — and
           each boundary falls between two rows, where a line can be drawn and
           labelled. The cost is that cities tied at a boundary rate can land on
           either side of it; the footnote says so.

           Labelled in percentiles, never as "Q1"–"Q4": on a page about tax years
           and budget cycles, a Q-number reads as a quarter of the calendar, and
           the statistical convention runs the other way anyway (the "first
           quartile" is the lowest 25%). Group 1 here is the highest-rate 25%, so
           every label says top/bottom or names the percentile band outright. */
        const cutsFor = (n) => [1, 2, 3].map((k) => Math.round((n * k) / 4)); // last rank in group 1, 2, 3
        const quartileOf = (rank, cuts) => (rank <= cuts[0] ? 1 : rank <= cuts[1] ? 2 : rank <= cuts[2] ? 3 : 4);
        // Three registers for the same four groups: a heading, a chip short
        // enough for a table cell, and a form that can sit inside a sentence.
        const QWHAT = { 1: "Highest rates", 2: "Above the middle", 3: "Below the middle", 4: "Lowest rates" };
        const QCHIP = { 1: "Top 25%", 2: "51–75th", 3: "26–50th", 4: "Bottom 25%" };
        const QBAND = {
          1: "the top 25% of Utah cities",
          2: "the 51st–75th percentile",
          3: "the 26th–50th percentile",
          4: "the bottom 25% of Utah cities",
        };

        // Everything the strip, the dividers and the summary sentence need about
        // one ranking, read off that ranking once — so no two of them can end up
        // describing a different table.
        const readingOf = (list) => {
          const n = list.length;
          const cuts = cutsFor(n);
          const rates = list.map((r) => r.rate);
          const emRow = list.find((r) => r.name === EM);
          const bands = [1, 2, 3, 4].map((q) => {
            const rows = list.filter((r) => quartileOf(r.rank, cuts) === q);
            return {
              q,
              n: rows.length,
              hi: rows[0].rate,
              lo: rows[rows.length - 1].rate,
              hasEM: rows.some((r) => r.name === EM),
            };
          });
          return {
            cuts, bands, em: emRow,
            emQ: quartileOf(emRow.rank, cuts),
            median: quantile(rates, 0.5),
            p25: quantile(rates, 0.25),
            p75: quantile(rates, 0.75),
            // The percentile a reader means by "where does mine sit": the share
            // of the other cities levying less than this one.
            emPct: Math.round(((n - emRow.rank) / (n - 1)) * 100),
          };
        };
        const readCur = readingOf(current);
        const readProp = readingOf(proposed);

        // The three lines drawn through the table. The middle one is the median —
        // the single figure that says what a normal Utah city charges.
        const dividersFor = (rd) => [
          { after: rd.cuts[0], cls: "", label: "75th percentile · a quarter of Utah's cities are above this line", value: rd.p75 },
          { after: rd.cuts[1], cls: " is-median", label: "The middle · half of Utah's cities are above this line", value: rd.median },
          { after: rd.cuts[2], cls: "", label: "25th percentile · a quarter of Utah's cities are below this line", value: rd.p25 },
        ];

        const dividerHtml = (d) => `
          <tr class="qdiv${d.cls}" data-after="${d.after}">
            <td colspan="4">
              <span class="qdiv-l">${d.label}</span>
              <span class="qdiv-v">${rate6(d.value)}</span>
            </td>
          </tr>`;

        const rowHtml = (r, rd, view) => {
          const isEM = r.name === EM;
          const q = quartileOf(r.rank, rd.cuts);
          const hasProp = view === "proposed" && proposedRate.has(r.name);
          const moved = hasProp ? curRank.get(r.name) - r.rank : 0; // places climbed
          const movedHtml =
            moved > 0
              ? ` <span class="cmove up" title="up ${moved} places">▲${moved}</span>`
              : "";
          const tag = isEM
            ? ` <span class="you-pill">${view === "proposed" ? "proposed" : "today"}</span>`
            : hasProp
              ? ` <span class="prop-pill" title="Noticed 2026 increase applied">proposed</span>`
              : "";
          return `<tr${isEM ? ' class="is-em-row"' : ""} data-rank="${r.rank}" data-rate="${r.rate}" data-q="${q}" data-name="${CT.escapeHtml(r.name)}">
            <td class="num qlead q${q}">${r.rank}</td>
            <td>${CT.escapeHtml(r.name)}${tag}</td>
            <td class="num">${rate6(r.rate)}${movedHtml}</td>
            <td class="qcell"><span class="qchip q${q}" title="${QWHAT[q]} — ${QBAND[q]}">${QCHIP[q]}</span></td>
          </tr>`;
        };

        // Dividers are spliced into the rank-ordered rows from the bottom up, so
        // each insertion leaves the indices above it alone.
        const rowsHtml = (list, rd, view) => {
          const out = list.map((r) => rowHtml(r, rd, view));
          [...dividersFor(rd)].reverse().forEach((d) => out.splice(d.after, 0, dividerHtml(d)));
          return out.join("");
        };

        // The four groups as buttons: what each covers, how many cities are in
        // it, which one Eagle Mountain is in — and, pressed, it filters the
        // ranking down to that group alone.
        const stripHtml = (rd) => `
          <p class="qsum">
            The middle Utah city levies <b>${rate6(rd.median)}</b>. Eagle Mountain's
            <b>${rate6(rd.em.rate)}</b> is higher than <b>${rd.emPct}%</b> of the ${N}
            cities — putting it in <b class="q-in q${rd.emQ}">${QBAND[rd.emQ]}</b> by rate.
          </p>
          <div class="qstrip" role="group" aria-label="Percentile groups. Choosing one filters the table below.">
            ${rd.bands
              .map(
                (b) => `
              <button type="button" class="qseg q${b.q}${b.hasEM ? " has-em" : ""}" data-q="${b.q}"
                      aria-pressed="false" title="Show only ${QBAND[b.q]}">
                <span class="qseg-head"><span class="qchip q${b.q}">${QCHIP[b.q]}</span>${QWHAT[b.q]}</span>
                <span class="qseg-range">${rate6(b.lo)} – ${rate6(b.hi)}</span>
                <span class="qseg-n">${b.n} cities${b.hasEM ? ' · <span class="qseg-em">Eagle Mountain</span>' : ""}</span>
              </button>`
              )
              .join("")}
          </div>`;

        const tableHtml = (id, list, rd, view) => `
          <div class="tablewrap statewide-wrap">
            <table class="data statewide" id="${id}">
              <thead><tr>
                <th scope="col" class="num sortable" data-key="rank" aria-sort="ascending" tabindex="0">Rank<span class="sarrow" aria-hidden="true"> ▲</span></th>
                <th scope="col" class="sortable" data-key="name" aria-sort="none" tabindex="0">City<span class="sarrow" aria-hidden="true"></span></th>
                <th scope="col" class="num sortable" data-key="rate" aria-sort="none" tabindex="0">City levy<span class="sarrow" aria-hidden="true"></span></th>
                <th scope="col" class="sortable" data-key="q" aria-sort="none" tabindex="0">Percentile<span class="sarrow" aria-hidden="true"></span></th>
              </tr></thead>
              <tbody>${rowsHtml(list, rd, view)}</tbody>
            </table>
          </div>`;

        const body = `
          <p class="panel-intro">
            All ${N} Utah cities by their own levy, highest first, split into four
            equal groups by percentile. Eagle Mountain is <strong>${ordinal(emCur)}</strong>
            today — in ${QBAND[readCur.emQ]} — and would be
            <strong>${ordinal(emProp)}</strong> with the 2026 proposals applied,
            a climb of ${climbed} places into ${QBAND[readProp.emQ]}.
          </p>

          <div class="sw-tools">
            <div class="scope-switch stateview-switch" role="radiogroup" aria-label="Which rate to rank by">
              <button type="button" role="radio" id="sv-current" data-view="current" aria-checked="true" tabindex="0">Rate today</button>
              <button type="button" role="radio" id="sv-proposed" data-view="proposed" aria-checked="false" tabindex="-1">With 2026 proposals</button>
            </div>
            <!-- ${N} rows is past the point where scrolling is a way to find
                 anything. Sorting answers "who is highest"; this answers the
                 question most people actually arrive with, which is "where is
                 mine". Filters both rankings at once so switching between them
                 keeps the same city in view. -->
            <div class="sw-find">
              <label class="sr-only" for="sw-q">Find a city</label>
              <span class="sw-find-ico" aria-hidden="true"></span>
              <input type="search" id="sw-q" class="sw-q" placeholder="Find a city" autocomplete="off"
                     spellcheck="false" aria-describedby="sw-count" />
            </div>
          </div>
          <p class="sw-count" id="sw-count" role="status" aria-live="polite"></p>

          <p class="sw-empty" id="sw-empty" hidden>
            No Utah city or town matches that. Check the spelling, or
            <button type="button" class="tx-link" id="sw-clear">clear the filter</button>.
          </p>

          <div class="stateview" data-view-panel="current">
            ${stripHtml(readCur)}
            ${tableHtml("statewide-current", current, readCur, "current")}
          </div>
          <div class="stateview" data-view-panel="proposed" hidden>
            ${stripHtml(readProp)}
            ${tableHtml("statewide-proposed", proposed, readProp, "proposed")}
            <p class="chart-foot">
              ${othersCount + 1} tracked increases applied, each marked
              <span class="prop-pill">proposed</span>. Every other city is at today's rate,
              so the percentile groups here move only as far as those increases push them.
            </p>
          </div>

          <p class="chart-foot">
            The four groups are percentiles — where a city sits among the ${N}, not a time of
            year. They are cut by position in the ranking, so each holds about ${Math.round(N / 4)}
            cities; two cities on the same rate can fall either side of a boundary. The three
            lines through the table are the 75th percentile, the median and the 25th percentile.
            They show while the table is in rank order and unfiltered.
            City levy only — not your total bill. Source:
            <a href="${src.url}" rel="nofollow noopener">${CT.escapeHtml(src.title)}</a>.
          </p>`;
        return panel("Where Eagle Mountain ranks statewide", `Its current rate — and its proposal — against all ${N} Utah cities, by percentile`, body, false, "p-statewide");
      }

      // The scope switch swaps the whole comparison between Utah County (both
      // tabs) and Salt Lake County (current rates only). Radiogroup semantics,
      // arrow-key operable, per the WAI-ARIA radio pattern.
      function wireCountySwitch() {
        const radios = [...document.querySelectorAll('.scope-switch [role="radio"]')];
        if (!radios.length) return;
        const panelFor = (r) => document.querySelector(`[data-scope-panel="${r.dataset.scope}"]`);
        const select = (radio) => {
          radios.forEach((r) => {
            const on = r === radio;
            r.setAttribute("aria-checked", String(on));
            r.tabIndex = on ? 0 : -1;
            const p = panelFor(r);
            if (p) p.hidden = !on;
            if (on && p) revealBars(p);
          });
          radio.focus();
        };
        radios.forEach((radio, i) => {
          radio.addEventListener("click", () => select(radio));
          radio.addEventListener("keydown", (e) => {
            let next = null;
            if (e.key === "ArrowRight" || e.key === "ArrowDown") next = radios[(i + 1) % radios.length];
            else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = radios[(i - 1 + radios.length) % radios.length];
            if (next) { e.preventDefault(); select(next); }
          });
        });
      }

      /* The percentile boundaries only mean something while the table is in rank
         order and showing every city. A line labelled "the median" sitting
         between two alphabetically adjacent rows, or between two survivors of a
         filter, would be a plain lie — so the dividers are re-placed after every
         sort and withdrawn the moment either condition breaks. Called by both
         the sorter and the filter, and it reads the state it needs off the DOM
         so neither has to tell the other anything. */
      function syncDividers(table) {
        const tbody = table.tBodies[0];
        const rankTh = table.querySelector('th[data-key="rank"]');
        const inRankOrder = rankTh && rankTh.getAttribute("aria-sort") === "ascending";
        const q = document.getElementById("sw-q");
        const filtered =
          !!(q && q.value.trim()) || !!document.querySelector('.qseg[aria-pressed="true"]');
        tbody.querySelectorAll("tr.qdiv").forEach((d) => {
          d.hidden = true;
          const anchor = inRankOrder && !filtered
            ? tbody.querySelector(`tr[data-rank="${d.dataset.after}"]`)
            : null;
          if (anchor) { anchor.after(d); d.hidden = false; }
          // Parked at the top, out of the sorted run — not the bottom, where a
          // hidden row would take `tr:last-child` off the last real city and
          // leave it wearing a border the table doesn't give its last row.
          else tbody.insertBefore(d, tbody.firstChild);
        });
      }

      // Click or Enter/Space on a header sorts a statewide table. Rank, rate and
      // percentile sort numerically, city by name; re-activating a column flips it.
      // Wires both the "today" and "with the proposal" tables independently.
      function wireStatewideTable() {
        document.querySelectorAll("table.data.statewide").forEach((table) => {
          const tbody = table.tBodies[0];
          const rows = [...tbody.querySelectorAll("tr[data-name]")]; // the cities; dividers are placed, not sorted
          let curKey = "rank", curDir = 1;
          const val = (tr, key) =>
            key === "name" ? tr.dataset.name.toLowerCase()
              : parseFloat(key === "rank" ? tr.dataset.rank : key === "q" ? tr.dataset.q : tr.dataset.rate);
          const sort = (key) => {
            curDir = key === curKey ? -curDir : 1;
            curKey = key;
            rows.sort((a, b) => {
              const va = val(a, key), vb = val(b, key);
              // Whole percentile groups tie by definition, so ties fall back to the
              // ranking rather than to whatever order the last sort left behind.
              if (va === vb) return +a.dataset.rank - +b.dataset.rank;
              return va < vb ? -curDir : curDir;
            });
            rows.forEach((r) => tbody.appendChild(r));
            table.querySelectorAll("th.sortable").forEach((th) => {
              const on = th.dataset.key === key;
              th.setAttribute("aria-sort", on ? (curDir > 0 ? "ascending" : "descending") : "none");
              th.querySelector(".sarrow").textContent = on ? (curDir > 0 ? " ▲" : " ▼") : "";
            });
            syncDividers(table);
          };
          table.querySelectorAll("th.sortable").forEach((th) => {
            th.addEventListener("click", () => sort(th.dataset.key));
            th.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sort(th.dataset.key); }
            });
          });
        });
      }

      /* Find-a-city. Filters both statewide rankings on every keystroke — 253
         rows is small enough that debouncing would only add lag — and reports
         the count to a live region so it is announced rather than merely seen.
         Ranks are never renumbered: a filtered row keeps its real standing, which
         is the whole point of looking a city up. */
      function wireStatewideFilter() {
        const q = document.getElementById("sw-q");
        if (!q) return;
        const count = document.getElementById("sw-count");
        const empty = document.getElementById("sw-empty");
        const clear = document.getElementById("sw-clear");
        const tables = [...document.querySelectorAll("table.data.statewide")];
        const rowsOf = (t) => [...t.tBodies[0].querySelectorAll("tr[data-name]")];
        const total = tables[0] ? rowsOf(tables[0]).length : 0;
        // Both views carry their own strip; pressing a group in one presses it
        // in the other, so switching between them keeps the same 63 cities.
        const segs = [...document.querySelectorAll(".qseg")];
        let activeQ = 0; // 0 = every group

        const apply = () => {
          const term = q.value.trim().toLowerCase();
          let shown = 0;
          tables.forEach((t, i) => {
            let n = 0;
            rowsOf(t).forEach((tr) => {
              const hit =
                (!term || tr.dataset.name.toLowerCase().includes(term)) &&
                (!activeQ || +tr.dataset.q === activeQ);
              tr.hidden = !hit;
              if (hit) n++;
            });
            syncDividers(t);
            if (i === 0) shown = n;
          });
          const on = !!term || !!activeQ;
          empty.hidden = shown > 0;
          // "1 of 253 cities" — the noun agrees with the total, not the count.
          count.textContent = !on ? "" : shown === 0 ? "No matches" : `${shown} of ${total} cities`;
          // A short list has nothing to scroll; let the box shrink to it.
          document.querySelectorAll(".statewide-wrap").forEach((w) =>
            w.classList.toggle("is-filtered", on && shown <= 12)
          );
        };

        segs.forEach((seg) => {
          seg.addEventListener("click", () => {
            const qn = +seg.dataset.q;
            activeQ = activeQ === qn ? 0 : qn; // pressing the pressed one clears it
            segs.forEach((s) => s.setAttribute("aria-pressed", String(+s.dataset.q === activeQ)));
            apply();
          });
        });

        q.addEventListener("input", apply);
        // Esc clears, the convention for a search field.
        q.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && q.value) { e.preventDefault(); q.value = ""; apply(); }
        });
        clear.addEventListener("click", () => {
          q.value = "";
          activeQ = 0;
          segs.forEach((s) => s.setAttribute("aria-pressed", "false"));
          apply();
          q.focus();
        });
      }

      // The statewide "rate today" / "with the proposal" toggle. Same radiogroup
      // pattern as the county switch.
      function wireStatewideView() {
        const radios = [...document.querySelectorAll('.stateview-switch [role="radio"]')];
        if (!radios.length) return;
        const panelFor = (r) => document.querySelector(`[data-view-panel="${r.dataset.view}"]`);
        const select = (radio) => {
          radios.forEach((r) => {
            const on = r === radio;
            r.setAttribute("aria-checked", String(on));
            r.tabIndex = on ? 0 : -1;
            const p = panelFor(r);
            if (p) p.hidden = !on;
          });
          radio.focus();
        };
        radios.forEach((radio, i) => {
          radio.addEventListener("click", () => select(radio));
          radio.addEventListener("keydown", (e) => {
            let next = null;
            if (e.key === "ArrowRight" || e.key === "ArrowDown") next = radios[(i + 1) % radios.length];
            else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = radios[(i - 1 + radios.length) % radios.length];
            if (next) { e.preventDefault(); select(next); }
          });
        });
      }

      /* ---------------- bars drawing themselves ----------------
         The one orchestrated moment on the page. Each chart's bars sweep out
         from the baseline as the chart scrolls into view, staggered down the
         list, so a wall of two dozen rates arrives as a ranking being drawn
         rather than as a block that was already there.

         Three things this has to survive:
         · Reduced motion — then it never arms at all, and the bars are simply
           drawn. Nothing here is the only way to read a value.
         · Hidden tab panels — a chart inside `hidden` never intersects, so
           switching tabs would reveal a panel of zero-width bars. Every switch
           calls revealBars() on what it just showed.
         · Anything going wrong — the armed state is added by JS and cleared by a
           timeout, so a failed observer degrades to visible bars, not to none.
      */
      const BAR_GROUPS = ".chart-body, .levy";

      function revealBars(scope) {
        (scope || document).querySelectorAll(".bars-armed").forEach((g) => {
          g.querySelectorAll(".cbar, .levy-bar").forEach((b, i) => {
            b.style.setProperty("--r", Math.min(i, 26));
          });
          g.classList.remove("bars-armed");
          g.classList.add("bars-in");
        });
      }

      function wireBarReveal() {
        if (!("IntersectionObserver" in window)) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const groups = [...document.querySelectorAll(BAR_GROUPS)];
        if (!groups.length) return;
        groups.forEach((g) => g.classList.add("bars-armed"));

        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (!e.isIntersecting) return;
              revealBars(e.target.parentElement || e.target);
              io.unobserve(e.target);
            });
          },
          { rootMargin: "0px 0px -10% 0px", threshold: 0.06 }
        );
        groups.forEach((g) => io.observe(g));

        /* The observer alone is not enough, and the failure is bad: an armed bar
           is an *invisible* bar, and its value column is invisible with it. A
           jump — an in-page anchor, a browser Find, restoring a scroll position,
           anything that moves the page without passing through the intervening
           pixels — can leave a chart behind the viewport having never once
           intersected it, and it then stays blank for as long as the reader is
           on the page.

           So the observer only owns the *nice* case. This sweep owns
           correctness: on any scroll, anything at or above the fold is drawn
           whether or not it was ever seen. It detaches once nothing is armed. */
        const sweep = () => {
          const armed = document.querySelectorAll(".bars-armed");
          if (!armed.length) {
            window.removeEventListener("scroll", sweep);
            return;
          }
          const vh = window.innerHeight;
          armed.forEach((g) => {
            if (g.getBoundingClientRect().top < vh) revealBars(g.parentElement || g);
          });
        };
        window.addEventListener("scroll", sweep, { passive: true });

        // And a backstop, for a reader who simply never scrolls.
        setTimeout(() => revealBars(document), 2500);
      }

      // One shared tooltip element, positioned to the hovered (mouse) or
      // tapped (touch) row. The exact-value data it carries also lives in each
      // chart's "View as table" fallback, so nothing here is the sole source.
      function wireChartTooltips() {
        const tip = document.createElement("div");
        tip.className = "chart-tip";
        tip.setAttribute("role", "status");
        tip.hidden = true;
        document.body.appendChild(tip);

        let openRow = null;   // row whose tip is currently showing
        let viaTap = false;   // opened by touch — needs an explicit dismiss

        const show = (row) => {
          openRow = row;
          tip.textContent = row.dataset.tip;
          tip.hidden = false;
          const r = row.getBoundingClientRect();
          const t = tip.getBoundingClientRect();
          let left = r.left + window.scrollX + 12;
          left = Math.min(left, window.scrollX + document.documentElement.clientWidth - t.width - 10);
          tip.style.left = Math.max(window.scrollX + 6, left) + "px";
          // Prefer above the row; flip below when sitting above would clip the
          // top of the viewport (e.g. tabbing/tapping the first row up top).
          const clipsTop = r.top - t.height - 8 < 8;
          tip.style.top = (clipsTop ? r.bottom + 8 : r.top - t.height - 8) + window.scrollY + "px";
        };
        const hide = () => { openRow = null; viaTap = false; tip.hidden = true; };

        document.querySelectorAll(".crow[data-tip], .levy-row[data-tip]").forEach((row) => {
          // Mouse: hover shows the tip.
          row.addEventListener("mouseenter", () => { if (!viaTap) show(row); });
          row.addEventListener("mouseleave", () => { if (!viaTap) hide(); });
          // Touch: no hover, so a tap toggles the tip.
          row.addEventListener("pointerdown", (e) => {
            if (e.pointerType === "mouse") return;
            e.stopPropagation();
            if (openRow === row) hide();
            else { viaTap = true; show(row); }
          });
        });
        // A tap elsewhere, or any scroll, dismisses a tapped-open tip.
        document.addEventListener("pointerdown", () => { if (viaTap) hide(); });
        window.addEventListener("scroll", hide, { passive: true });
      }

      /* ---------------- the meeting record ----------------
         A chronology, grouped by relevance rather than by date — what is coming,
         what happened, what led up to it. Each group carries its own spine, so
         one continuous line can't run backwards at a seam.
      */
      function recordPanel(tax) {
        const order = ["hearing", "record", "context"];
        const groups = order
          .map((g) => {
            const items = tax.meetings
              .filter((m) => m.group === g)
              .sort((a, b) => (a.date < b.date ? -1 : 1));
            if (!items.length) return "";
            const meta = tax.groups[g];
            return `
              <section class="rail-group rail-${g}">
                <h4 class="rail-group-title">${CT.escapeHtml(meta.label)}</h4>
                <p class="rail-group-note">${CT.escapeHtml(meta.note)}</p>
                <ol class="rail-line">
                  ${items
                    .map(
                      (m) => `<li class="rail-item">
                        <span class="rail-node" aria-hidden="true"></span>
                        ${meetingCard(m)}
                      </li>`
                    )
                    .join("")}
                </ol>
              </section>`;
          })
          .join("");
        return panel("Every meeting it moved through", "Two hearings still ahead, then the full record and what led up to it", groups, false, "p-record");
      }

      function meetingCard(m) {
        const badges = [
          m.transcript ? `<span class="mini-pill tx">Transcript</span>` : "",
          m.upcoming ? `<span class="mini-pill up">Upcoming</span>` : "",
          m.no_mention ? `<span class="mini-pill ctx">Context only</span>` : "",
        ].join("");

        const items = (m.items || [])
          .map(
            (it) => `
            <li>
              <span class="iref">${CT.escapeHtml(it.ref)}</span>
              <span class="itext">${CT.escapeHtml(it.text)}</span>
              <span class="iout ${/^passed/i.test(it.outcome) ? "ok" : "unk"}">${CT.escapeHtml(it.outcome)}</span>
            </li>`
          )
          .join("");

        const head = `
          <div class="mc-head">
            <span class="mc-kind">${CT.escapeHtml(m.kind)}</span>
            <span class="mc-date">${CT.fmtDate(m.date)}</span>
          </div>
          <p class="mc-title">${CT.escapeHtml(m.title)}</p>
          <p class="mc-note">${CT.escapeHtml(m.note)}</p>
          ${items ? `<ul class="mc-items">${items}</ul>` : ""}
          ${badges ? `<div class="mc-badges">${badges}</div>` : ""}
        `;

        // No meeting id means nothing to link to yet — a scheduled future
        // hearing. Render it as a card, not a dead link.
        if (m.id == null) {
          return `<article class="tax-card is-upcoming">${head}</article>`;
        }
        return `<a class="tax-card" href="meetings.html?id=${m.id}">
          ${head}
          <span class="mc-go">Meeting #${m.id} <span aria-hidden="true">→</span></span>
        </a>`;
      }
    </script>
  </body>
</html>
