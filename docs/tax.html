    <script src="site.js?v=20260721c"></script>
    <script>
      (async () => {
        const root = document.getElementById("content");
        const grab = (f) =>
          fetch(new URL(f, document.baseURI))
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
        // The county comparison is a nice-to-have; the page still works without it.
        const [tax, county] = await Promise.all([grab("data.tax.json"), grab("data.tax-county.json")]);

        if (!tax) {
          root.innerHTML = `<h1 class="page-title">Property tax</h1>
            <p class="page-sub">Tax data couldn't be loaded. Reload the page to try again.</p>`;
          return;
        }

        // The estimator only describes the City Council's levy. Other bodies
        // on this site don't set a property tax rate, so say so rather than
        // showing council numbers under a planning-commission heading.
        if (CT.currentBody() !== tax.body) {
          root.innerHTML = `<h1 class="page-title">Property tax</h1>
            <p class="page-sub">Only the City Council sets a property tax rate. Switch to City Council to use the estimator.</p>`;
          return;
        }

        render(tax, county, root);
      })();

      const usd = (n) =>
        "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const usd0 = (n) => "$" + Math.round(n).toLocaleString("en-US");
      const commas = (n) => n.toLocaleString("en-US");
      const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

      /* =========================================================================
         The page is built estimator-first: the headline asks a question, and the
         tool that answers it is the very next thing. Everything else — the
         official schedule, the county comparison, the paper trail, the meeting
         record — is real and sourced, but it is supporting detail, so it lives in
         calm collapsible panels the reader opens on demand rather than a wall of
         tables on arrival.
         ========================================================================= */

      function render(tax, county, root) {
        const CURRENT = tax.rates.current.rate;
        const PROPOSED = tax.rates.proposed.rate;
        const RATIO = tax.residential_ratio;

        root.innerHTML = `
          <div class="tax-page">
            <header class="tax-hero reveal">
              ${statusHtml(tax)}
              <h1 class="tax-h1">What would this cost you?</h1>
              <p class="tax-lede">
                Eagle Mountain wants to raise its city property tax to fund its
                public safety contract with the Utah County Sheriff's Office. Put in
                what your home is worth to see the city's share of your bill — what
                you pay now, and what's proposed.
              </p>
              ${nextHearingHtml(tax)}
            </header>

            ${estimatorHtml(tax)}

            ${takeawayHtml(tax, county)}

            <section class="learn reveal" style="--i:3" aria-labelledby="learn-title">
              <h2 class="learn-title" id="learn-title">The fuller picture</h2>
              <p class="learn-sub">
                The estimate is the short version. Open any of these for where the
                numbers come from and how the decision has moved so far.
              </p>
              ${pictureNavHtml(county)}
              ${schedulePanel(tax)}
              ${county ? countyPanel(county) : ""}
              ${county && county.statewide ? statewidePanel(county) : ""}
              ${sourcePanel(tax)}
              ${recordPanel(tax)}
            </section>
          </div>
        `;

        measureTopbar();
        wireEstimator({ CURRENT, PROPOSED, RATIO, tax });
        wireStickyResult();
        wirePictureNav();
        wireTableExports();
        if (county) {
          wireCountySwitch();
          wireChartTabs();
          wireChartTooltips();
          wireStatewideTable();
          wireStatewideView();
        }
      }

      /* ---------------- hero ---------------- */

      // A small, friendly status line: what stage this is at, and for which year.
      function statusHtml(tax) {
        const fy = tax.fiscal_year.replace("-", "–");
        return `
          <span class="tax-status">
            <span class="tax-status-dot" aria-hidden="true"></span>
            ${CT.escapeHtml(cap(tax.status))} increase · FY ${CT.escapeHtml(fy)}
          </span>`;
      }

      // The one fact a reader can still act on: nothing is settled, and there is a
      // date. Counts down from today, and disappears once both hearings are past.
      function nextHearingHtml(tax) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const asDate = (m) => new Date(m.date + "T12:00:00");
        const next = tax.meetings
          .filter((m) => m.upcoming && asDate(m) >= today)
          .sort((a, b) => (a.date < b.date ? -1 : 1))[0];
        if (!next) return "";

        const days = Math.round((asDate(next) - today) / 86400000);
        const when = days <= 0 ? "today" : days === 1 ? "tomorrow" : `in ${days} days`;
        return `
          <p class="tax-next">
            <span class="nh-pulse" aria-hidden="true"></span>
            <span><b>Next up · ${when}.</b> ${CT.escapeHtml(next.title)}, ${CT.fmtDate(next.date)}.
            The rate isn't final until the hearings are done.</span>
          </p>`;
      }

      /* ---------------- estimator (the hero tool) ---------------- */

      // The default scenario: a $500,000 primary residence at the proposed rate.
      // The markup ships with these figures already filled in rather than a set
      // of hardcoded placeholders that JS overwrites a moment later — a stale
      // number that corrects itself in front of the reader reads as a glitch,
      // and it's the one number this page exists to state.
      const DEFAULT_VALUE = 500000;

      function estimatorHtml(tax) {
        const cur = tax.rates.current;
        const prop = tax.rates.proposed;
        const taxable = DEFAULT_VALUE * tax.residential_ratio;
        const d = {
          now: taxable * cur.rate,
          sel: taxable * prop.rate,
        };
        d.diff = d.sel - d.now;
        d.fill = (n) => (n / Math.max(d.now, d.sel, 0.01)) * 100;
        return `
        <section class="estimator reveal" style="--i:1" id="estimate">
          <div class="tax-tool">
            <span id="tool-sentinel" aria-hidden="true"></span>

            <!-- The answer, at the top of the tool and pinned while you work the
                 controls below it. On a phone this is the difference between
                 seeing the number and scrolling for it. -->
            <div class="tool-out">
              <div class="out-main">
                <p class="rlabel">
                  Your city property tax at the <span class="scen" id="res-scenario">proposed rate</span>
                </p>
                <p class="bignum" id="res-total">${usd(d.sel)}</p>
                <p class="permonth" id="res-month">${usd(d.sel / 12)} per month</p>
              </div>

              <div class="out-compare">
                <div id="res-delta" class="delta up">
                  <span class="arrow" aria-hidden="true">▲</span>
                  <span id="res-delta-text">${usd(d.diff)} more per year
                    <span class="per">· ${usd(d.diff / 12)}/mo</span></span>
                </div>

                <div class="bars" aria-hidden="true">
                  <div class="bar now">
                    <span class="bl">Today</span>
                    <span class="track"><span class="fill" id="bar-now" style="width:${d.fill(d.now)}%"></span></span>
                    <span class="bv" id="bv-now">${usd(d.now)}</span>
                  </div>
                  <div class="bar sel">
                    <span class="bl" id="bl-sel">Proposed</span>
                    <span class="track"><span class="fill" id="bar-sel" style="width:${d.fill(d.sel)}%"></span></span>
                    <span class="bv" id="bv-sel">${usd(d.sel)}</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="tool-inputs">
              <div class="input-pair">
                <div class="field">
                  <span class="flabel" id="lbl-type">Property type</span>
                  <div class="seg" role="group" aria-labelledby="lbl-type">
                    <input type="radio" name="ptype" id="pt-home" value="primary" checked />
                    <label for="pt-home">Primary residence</label>
                    <input type="radio" name="ptype" id="pt-biz" value="other" />
                    <label for="pt-biz">Commercial</label>
                  </div>
                </div>

                <div class="field">
                  <label class="flabel" for="mv">What's it worth?</label>
                  <div class="valuerow">
                    <span class="dollar" aria-hidden="true">$</span>
                    <input class="value" id="mv" type="text" inputmode="numeric" value="${commas(DEFAULT_VALUE)}" aria-describedby="mv-help" />
                  </div>
                  <input type="range" id="mv-range" min="100000" max="3000000" step="5000" value="${DEFAULT_VALUE}" aria-label="Market value" />
                  <div class="rangeends" id="mv-help"><span>$100k</span><span>$3M</span></div>
                </div>
              </div>

              <div class="field">
                <span class="flabel" id="lbl-rate">Which rate?</span>
                <div class="rates" role="radiogroup" aria-labelledby="lbl-rate">
                  <div class="rate">
                    <input type="radio" name="rate" id="r-current" value="current" />
                    <label for="r-current">
                      <span class="dot" aria-hidden="true"></span>
                      <span>
                        <span class="rname">${CT.escapeHtml(cur.label)}</span>
                        <span class="rmeta">${CT.escapeHtml(cur.note)}</span>
                      </span>
                      <span class="rrate">${cur.rate.toFixed(6)}</span>
                    </label>
                  </div>

                  <div class="rate is-proposed">
                    <input type="radio" name="rate" id="r-proposed" value="proposed" checked />
                    <label for="r-proposed">
                      <span class="dot" aria-hidden="true"></span>
                      <span>
                        <span class="rname">${CT.escapeHtml(prop.label)}</span>
                        <span class="rmeta">${CT.escapeHtml(prop.note)}</span>
                      </span>
                      <span class="rrate">${CT.escapeHtml(prop.rate_display)}</span>
                    </label>
                  </div>

                  <div class="rate is-custom">
                    <input type="radio" name="rate" id="r-custom" value="custom" />
                    <label for="r-custom">
                      <span class="dot" aria-hidden="true"></span>
                      <span>
                        <span class="rname">Try another rate</span>
                        <span class="rmeta" id="custom-meta">Type a rate, or drag</span>
                      </span>
                      <span class="rrate" id="custom-rate">0.001100</span>
                    </label>
                    <div class="customwrap" id="customwrap" hidden>
                      <div class="customedit">
                        <label class="clabel" for="custom-num">Rate</label>
                        <div class="cnum">
                          <button type="button" class="cstep" id="custom-down" aria-label="Lower the rate">−</button>
                          <input id="custom-num" class="crate" type="text" inputmode="decimal"
                                 value="0.001100" aria-describedby="custom-help" />
                          <button type="button" class="cstep" id="custom-up" aria-label="Raise the rate">+</button>
                        </div>
                      </div>
                      <input type="range" id="custom-range" min="0" max="3000" step="10" value="1100" aria-label="Custom tax rate" />
                      <div class="rangeends" id="custom-help"><span>0.000000</span><span>0.003000</span></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="tool-foot">
              <p><strong>This is the city's share only.</strong> Your full bill also includes county, school district, and other levies the city doesn't set.</p>
              <p>${CT.escapeHtml(tax.residential_ratio_note)}</p>
            </div>
          </div>

          <!-- One composed sentence for screen readers. The visible figures are
               not a live region: dragging a slider would otherwise fire a
               stream of announcements. -->
          <p class="sr-only" id="res-sr" aria-live="polite"></p>
        </section>`;
      }

      function wireEstimator({ CURRENT, PROPOSED, RATIO }) {
        const $ = (id) => document.getElementById(id);
        const mv = $("mv"),
          mvRange = $("mv-range"),
          customWrap = $("customwrap"),
          customRng = $("custom-range"),
          customNum = $("custom-num"),
          customRate = $("custom-rate"),
          customMeta = $("custom-meta"),
          bignum = $("res-total"),
          srOut = $("res-sr");

        // The custom rate is kept here, in millionths, rather than read back off
        // the slider: the slider snaps to its 0.000010 step, and a rate someone
        // typed out by hand should survive to its last digit.
        const RATE_MAX = parseInt(customRng.max, 10);
        const STEP = parseInt(customRng.step, 10);
        let customMicro = parseInt(customRng.value, 10);

        // `typed` keeps a half-finished entry ("0.0" on the way to "0.0018")
        // from being reformatted out from under the cursor.
        const setCustom = (micro, typed) => {
          customMicro = Math.min(Math.max(Math.round(micro), 0), RATE_MAX);
          customRng.value = customMicro;
          $("r-custom").checked = true;
          customWrap.hidden = false;
          if (!typed) customNum.value = (customMicro / 1e6).toFixed(6);
          paint();
        };

        const value = () => {
          const n = parseInt(String(mv.value).replace(/[^0-9]/g, ""), 10);
          return isNaN(n) ? 0 : n;
        };
        const ratio = () => ($("pt-home").checked ? RATIO : 1);
        const chosen = () => {
          const v = document.querySelector('input[name="rate"]:checked').value;
          if (v === "current") return { rate: CURRENT, name: "current rate", bar: "Current" };
          if (v === "proposed") return { rate: PROPOSED, name: "proposed rate", bar: "Proposed" };
          return { rate: customMicro / 1e6, name: "rate you picked", bar: "Yours" };
        };

        // The visible number updates on every slider tick; the announcement waits
        // for the reader to settle, so assistive tech gets one sentence, not fifty.
        let srTimer = 0;
        const announce = (msg) => {
          clearTimeout(srTimer);
          srTimer = setTimeout(() => { srOut.textContent = msg; }, 400);
        };

        function paint() {
          const taxable = value() * ratio();
          const sel = chosen();
          const now = taxable * CURRENT;
          const tax = taxable * sel.rate;

          const total = usd(tax);
          bignum.textContent = total;
          // "$467.50" is seven characters; a mistyped market value can give
          // fifteen. Step the display size down rather than let it run into
          // the comparison bars.
          bignum.classList.toggle("len-l", total.length > 11 && total.length <= 14);
          bignum.classList.toggle("len-xl", total.length > 14);

          $("res-month").textContent = usd(tax / 12) + " per month";
          $("res-scenario").textContent = sel.name;

          const diff = tax - now;
          const same = Math.abs(diff) < 0.005;
          const d = $("res-delta");
          d.className = "delta " + (same ? "same" : diff > 0 ? "up" : "down");
          d.querySelector(".arrow").textContent = same ? "=" : diff > 0 ? "▲" : "▼";
          $("res-delta-text").innerHTML = same
            ? "Same as today"
            : `${usd(Math.abs(diff))} ${diff > 0 ? "more" : "less"} per year ` +
              `<span class="per">· ${usd(Math.abs(diff) / 12)}/mo</span>`;

          const max = Math.max(now, tax, 0.01);
          $("bar-now").style.width = (now / max) * 100 + "%";
          $("bar-sel").style.width = (tax / max) * 100 + "%";
          $("bv-now").textContent = usd(now);
          $("bv-sel").textContent = usd(tax);
          $("bl-sel").textContent = sel.bar;

          // Unopened, the row has to advertise that it is editable at all; once
          // it's the chosen scenario, the space is better spent on what the rate
          // means in dollars.
          const cr = customMicro / 1e6;
          customRate.textContent = cr.toFixed(6);
          customMeta.textContent = $("r-custom").checked
            ? usd(cr * 100000 * ratio()) + " per $100k of value"
            : "Type a rate, or drag";

          announce(
            `Your city property tax at the ${sel.name} is ${usd(tax)} per year, ` +
              `${usd(tax / 12)} per month. ` +
              (same
                ? "The same as today."
                : `${usd(Math.abs(diff))} ${diff > 0 ? "more" : "less"} per year than the current rate.`)
          );
        }

        // A changed scenario is a different answer, not a nudged one — say so.
        // Slider drags are excluded: a pulse per tick would be a strobe.
        // Named `numflash`, not `pulse`: the home page's motion ledger already
        // owns `.pulse` as a boxed component, and sharing the name dropped the
        // figure into a padded grey block for the length of the animation.
        const pulse = () => {
          bignum.classList.remove("numflash");
          void bignum.offsetWidth; // restart the animation
          bignum.classList.add("numflash");
        };
        bignum.addEventListener("animationend", () => bignum.classList.remove("numflash"));

        mv.addEventListener("input", () => {
          const n = value();
          if (n >= +mvRange.min && n <= +mvRange.max) mvRange.value = n;
          paint();
        });
        mv.addEventListener("blur", () => { mv.value = commas(value()); });
        mvRange.addEventListener("input", () => {
          mv.value = commas(parseInt(mvRange.value, 10));
          paint();
        });
        document.querySelectorAll('input[name="ptype"]').forEach((el) =>
          el.addEventListener("change", () => { paint(); pulse(); })
        );
        document.querySelectorAll('input[name="rate"]').forEach((el) =>
          el.addEventListener("change", () => {
            customWrap.hidden = !document.getElementById("r-custom").checked;
            paint();
            pulse();
          })
        );
        customRng.addEventListener("input", () => setCustom(parseInt(customRng.value, 10)));

        customNum.addEventListener("input", () => {
          const n = parseFloat(String(customNum.value).replace(/[^0-9.]/g, ""));
          if (isNaN(n)) return; // an empty or half-typed field isn't a rate yet
          setCustom(n * 1e6, true);
        });
        // Tidy the field to six places only once they're done with it, and never
        // leave a cleared field standing in for a rate that is still in effect.
        customNum.addEventListener("blur", () => {
          customNum.value = (customMicro / 1e6).toFixed(6);
        });
        customNum.addEventListener("keydown", (e) => {
          const dir = e.key === "ArrowUp" ? 1 : e.key === "ArrowDown" ? -1 : 0;
          if (!dir) return;
          e.preventDefault();
          setCustom(customMicro + dir * (e.shiftKey ? STEP * 10 : STEP));
        });

        $("custom-up").addEventListener("click", () => setCustom(customMicro + STEP));
        $("custom-down").addEventListener("click", () => setCustom(customMicro - STEP));

        paint();
        srOut.textContent = ""; // don't announce the initial render
      }

      /* ---------------- sticky result banner ----------------
         The banner pins under the topbar, so the topbar's real height has to be
         a number the stylesheet can read. Measured rather than assumed: it
         shrinks at the mobile breakpoint and grows with the safe-area inset.
      */
      // Also publishes the banner's height, so `scroll-margin-top` can keep a
      // tabbed-to control from landing behind it.
      function measureTopbar() {
        const root = document.documentElement;
        const bar = document.querySelector(".topbar");
        const out = document.querySelector(".tool-out");
        const h = bar ? Math.round(bar.getBoundingClientRect().height) : 60;
        root.style.setProperty("--topbar-h", h + "px");
        if (out) root.style.setProperty("--out-h", Math.round(out.getBoundingClientRect().height) + "px");
        return h;
      }

      // A zero-height sentinel at the top of the card. Once it leaves the pin
      // line, the banner is stuck — that's when it earns a shadow and loses its
      // rounded corners. Nothing about the banner's size changes, so pinning
      // can't shift the content below it and re-trigger the observer.
      function wireStickyResult() {
        const out = document.querySelector(".tool-out");
        const sentinel = document.getElementById("tool-sentinel");
        if (!out || !sentinel || !("IntersectionObserver" in window)) return;

        let io = null;
        const attach = () => {
          if (io) io.disconnect();
          const top = measureTopbar() + 1;
          io = new IntersectionObserver(
            ([e]) => out.classList.toggle("is-pinned", !e.isIntersecting && e.boundingClientRect.top < top),
            { rootMargin: `-${top}px 0px 0px 0px`, threshold: 0 }
          );
          io.observe(sentinel);
        };

        let t = 0;
        const remeasure = () => {
          clearTimeout(t);
          t = setTimeout(attach, 150);
        };

        attach();
        window.addEventListener("resize", remeasure);

        // Measuring once is a race. The topbar grows when Inter replaces
        // the fallback and the brand wraps to two lines, and it grows again if
        // the body switcher rewraps — either way the banner would pin behind a
        // bar taller than the height we recorded.
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(attach);
        if ("ResizeObserver" in window) {
          const bar = document.querySelector(".topbar");
          if (bar) new ResizeObserver(remeasure).observe(bar);
        }
      }

      /* ---------------- the takeaway ----------------
         The bridge from the tool to the detail. A reader who works the estimator
         and stops still leaves with the headline: how big the increase is, what
         it does to the city's standing, and what it buys. Every figure here is
         opened in full inside a panel below, so this states nothing it can't
         back up. The rank cards only render when the county data loaded — the
         page is built to work without it.
      */
      function takeawayHtml(tax, county) {
        const pct = tax.rates.proposed.pct;
        const em = county ? county.eagle_mountain : null;

        const incTxt = em
          ? "over the certified rate — the largest increase any Utah County city is asking for this year."
          : `over the ${CT.escapeHtml(tax.rates.certified_2026.rate_display)} certified rate.`;

        const rankCard = em
          ? `
            <li class="tk">
              <span class="tk-kicker">Where it ranks</span>
              <span class="tk-fig shift">${ordinal(em.total_cities - em.rank_current + 1)}-lowest <span class="to" aria-hidden="true">→</span> ${ordinal(em.rank_proposed)}-highest</span>
              <span class="tk-txt">Eagle Mountain's city property tax rate among the county's ${em.total_cities} cities — where it sits today, and where this proposal would put it.</span>
            </li>`
          : "";

        return `
          <section class="takeaway reveal" style="--i:2" aria-labelledby="takeaway-title">
            <h2 class="takeaway-title" id="takeaway-title">What this would mean</h2>
            <ul class="takeaway-list${em ? "" : " two"}">
              <li class="tk">
                <span class="tk-kicker">The increase</span>
                <span class="tk-fig">+${pct}%</span>
                <span class="tk-txt">${incTxt}</span>
              </li>
              ${rankCard}
              <li class="tk">
                <span class="tk-kicker">What it pays for</span>
                <span class="tk-fig word">Public safety</span>
                <span class="tk-txt">The new revenue funds the city's public safety contract with the Utah County Sheriff's Office — the deputies, patrol, and dispatch that make up Eagle Mountain's police coverage — keeping pace with the city's growth.</span>
              </li>
            </ul>
            ${em ? `<p class="takeaway-link"><a href="#p-compare" data-panel="p-compare">See how Eagle Mountain compares across the county <span aria-hidden="true">→</span></a></p>` : ""}
          </section>`;
      }

      /* ---------------- section wayfinding ----------------
         Five stacked closed panels give a reader no sense of what's inside. A
         row of chips names each topic up front and jumps to it — opening the
         panel on the way. Built from the same conditionals as the panels, so a
         chip never points at a section that didn't render.
      */
      function pictureNavHtml(county) {
        const items = [
          ["p-schedule", "Schedule"],
          county ? ["p-compare", "Compare"] : null,
          county && county.statewide ? ["p-statewide", "Statewide"] : null,
          ["p-source", "Sources"],
          ["p-record", "Timeline"],
        ].filter(Boolean);
        return `
          <nav class="picture-nav" aria-label="Jump to a section">
            ${items.map(([id, label]) => `<a class="pnav-link" href="#${id}" data-panel="${id}">${CT.escapeHtml(label)}</a>`).join("")}
          </nav>`;
      }

      /* Chips and the takeaway link open their target panel and glide to it;
         a shared URL that names a panel does the same on load. Both honour
         reduced-motion by dropping the smooth scroll. */
      function wirePictureNav() {
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const reveal = (id, focus) => {
          const target = document.getElementById(id);
          if (!target || target.tagName !== "DETAILS") return false;
          target.open = true;
          target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
          // Keyboard users land on the panel they asked for, not back at the top.
          if (focus) {
            const sum = target.querySelector("summary");
            if (sum) sum.focus({ preventScroll: true });
          }
          return true;
        };

        document.querySelectorAll("[data-panel]").forEach((a) => {
          a.addEventListener("click", (e) => {
            const id = a.getAttribute("data-panel");
            if (document.getElementById(id)) {
              e.preventDefault();
              history.replaceState(null, "", "#" + id);
              reveal(id, true);
            }
          });
        });

        // Deep link: a URL ending in #p-compare (etc.) arrives with that panel open.
        if (location.hash.length > 1) reveal(location.hash.slice(1), false);
      }

      /* ---------------- disclosure panels ----------------
         Each panel is a native <details>: keyboard-operable, no JS to open, and
         collapsed by default so the page arrives calm. The schedule opens first
         so the section never reads as an empty stack of closed doors.
      */
      function panel(title, sub, bodyHtml, open, id) {
        return `
        <details class="panel"${id ? ` id="${id}"` : ""}${open ? " open" : ""}>
          <summary>
            <span class="panel-tt">
              <b>${title}</b>
              <span>${sub}</span>
            </span>
            <span class="panel-chev" aria-hidden="true">▾</span>
          </summary>
          <div class="panel-body">${bodyHtml}</div>
        </details>`;
      }

      /* ---------------- the schedule as read ----------------
         The schedule Mayor Gray read on June 16 (meeting #726, item 17.B), line
         item for line item, in his order.

         The percentage line is the one figure not reproduced as spoken. The
         mayor read 218%, which is 0.001700 against 0.000534 — the rate then in
         effect, because the county had not yet returned the recalculated
         certified rate. Against the 0.000530 it did return on June 22, the same
         proposal is 220.9%, and that is the number in the city's own
         Truth-in-Taxation notice. So the row states the percentage the proposed
         rate actually carries, and the note under the table says what was read
         aloud and why the two differ.

         Note it is a rate-to-rate figure either way. The schedule's own revenue
         lines — $2,839,998 against $9,798,139 — imply 245%, a different measure
         (tax.revenue_ratio_pct), which is why this row is not labelled as a
         change in revenue.
      */
      function schedulePanel(tax) {
        const cur = tax.rates.current, prop = tax.rates.proposed;
        const certified = tax.rates.certified_2026;
        const home = tax.as_read.home, biz = tax.as_read.business;
        // The proposed column reproduces the dollar figures the mayor read aloud rather
        // than recomputing them from the rounded rate, so the table matches the record
        // to the cent. The current column is arithmetic on a rate that is already exact.
        const homeNow = home.market_value * tax.residential_ratio * cur.rate;
        const bizNow = biz.market_value * cur.rate;
        const body = `
          <p class="panel-intro">
            The schedule Mayor Gray read aloud on
            <a href="meetings.html?id=${tax.as_read.meeting_id}">June 16</a>, transcribed from the recording.
            The percentage is the one line stated against the certified rate the county
            returned afterwards, rather than as he read it — the note under the table has both.
          </p>
          <div class="tablewrap">
            <table class="data schedule">
              <thead>
                <tr>
                  <th scope="col">City property tax</th>
                  <th scope="col" class="num">Current</th>
                  <th scope="col" class="num">Proposed</th>
                </tr>
              </thead>
              <tbody>
                <tr><td class="rowlabel">Tax rate</td>
                  <td class="num">${cur.rate.toFixed(6)}</td>
                  <td class="num">${CT.escapeHtml(prop.rate_display)}</td></tr>
                <tr><td class="rowlabel">Revenue to the city</td>
                  <td class="num">${usd0(cur.revenue)}</td>
                  <td class="num">${usd0(prop.revenue)}</td></tr>
                <tr><td class="rowlabel">New revenue to the city</td>
                  <td class="num">—</td>
                  <td class="num">+${usd0(tax.revenue_increase)}</td></tr>
                <tr><td class="rowlabel">Increase over the certified rate <span class="ast" aria-hidden="true">*</span></td>
                  <td class="num">—</td>
                  <td class="num">+${prop.pct}%</td></tr>
                <tr><td class="rowlabel">Tax on a ${usd0(home.market_value)} home</td>
                  <td class="num">${usd(homeNow)}</td>
                  <td class="num">${usd(home.proposed)} <span class="rise">+${usd(home.increase)}</span></td></tr>
                <tr><td class="rowlabel">Tax on the average business (${usd0(biz.market_value)})</td>
                  <td class="num">${usd(bizNow)}</td>
                  <td class="num">${usd(biz.proposed)} <span class="rise">+${usd(biz.increase)}</span></td></tr>
              </tbody>
            </table>
          </div>
          <p class="chart-foot schedule-foot">
            <span aria-hidden="true">*</span>
            <strong>+${prop.pct}%</strong> is the proposed ${CT.escapeHtml(prop.rate_display)} against the
            ${CT.escapeHtml(certified.rate_display)} certified rate — the comparison the city's own
            Truth-in-Taxation notice uses. Mayor Gray read this line as ${tax.as_read.pct}% on June 16,
            measured against the ${cur.rate.toFixed(6)} rate then in effect; the county did not return the
            recalculated certified rate until June 22, after the schedule was read.
            Either way it is a comparison of rates, not of collections — the schedule's own revenue lines,
            ${usd0(cur.revenue)} against ${usd0(prop.revenue)}, work out to ${tax.revenue_ratio_pct}%.
          </p>`;
        return panel("The official schedule", "The six lines of the city's Truth-in-Taxation schedule", body, true, "p-schedule");
      }

      /* ---------------- the paper trail ---------------- */
      function sourcePanel(tax) {
        const body = `
          <blockquote class="record">
            <p>“${CT.escapeHtml(tax.source.quote)}”</p>
            <footer>
              ${CT.escapeHtml(tax.source.speaker)}, reading the required tax schedule —
              <a href="meetings.html?id=${tax.source.meeting_id}">meeting #${tax.source.meeting_id}, ${CT.fmtDate(tax.source.date)}</a>
            </footer>
          </blockquote>

          <p class="derivation">
            <strong>How the proposed rate checks out.</strong> ${CT.escapeHtml(tax.rates.proposed.derivation)}
          </p>

          <p class="derivation">
            <strong>Minutes and recording.</strong> ${CT.escapeHtml(tax.source.minutes)}
            Council approved the June 16 minutes on ${CT.fmtDate(tax.source.minutes_approved)}.
          </p>`;
        return panel("Where these numbers come from", "The quote on the record, and the arithmetic that reproduces it", body, false, "p-source");
      }

      /* ---------------- county comparison charts ----------------
         Two measures (a rate, and a percent change) never share one axis, so
         they are two charts. Each is a single series: every bar the same
         recessive ink, Eagle Mountain lifted out in the accent. The accent /
         neutral pair clears CVD separation in both themes; the proposed
         segment is told apart by texture and a direct label, not a second hue.
      */

      const EM = "Eagle Mountain";
      const rate6 = (r) => r.toFixed(6);
      function ordinal(n) {
        if (n % 100 >= 11 && n % 100 <= 13) return n + "th";
        return n + ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
      }

      function countyPanel(c) {
        const utahN = c.cities.length;
        const sl = c.salt_lake;

        const utahNotes = `
          <div class="county-notes">
            <h3>About these numbers</h3>
            <ul>${c.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}</ul>
            <p class="src">
              Rates: <a href="${c.rate_source.url}" rel="nofollow noopener">${CT.escapeHtml(c.rate_source.title)}</a>,
              ${CT.escapeHtml(c.rate_source.publisher)}.
              Proposed increases: <a href="${c.proposal_source.url}" rel="nofollow noopener">${CT.escapeHtml(c.proposal_source.publisher)}</a>,
              reporting the ${c.proposal_year} truth-in-taxation notices.
            </p>
          </div>`;

        const body = `
          <p class="panel-intro county-lede">
            Eagle Mountain levies the <strong>second-lowest city property tax rate</strong> of the
            ${utahN} municipalities in Utah County today. At the proposed rate it would have the
            <strong>third-highest</strong> — the largest increase any city in the county is asking
            for this year, by a wide margin. Switch to Salt Lake County to see where its rate falls
            among its Wasatch Front neighbours.
          </p>

          ${sl ? `<div class="switch-row">
            <p class="switch-label" id="scope-hint">Compare against</p>
            <div class="scope-switch" role="radiogroup" aria-labelledby="scope-hint">
              <button type="button" role="radio" id="scope-utah" data-scope="utah" aria-checked="true" tabindex="0">Utah County</button>
              <button type="button" role="radio" id="scope-slc" data-scope="slc" aria-checked="false" tabindex="-1">Salt Lake County</button>
            </div>
          </div>` : ""}

          <div class="county">
            <div class="scope-panel" data-scope-panel="utah">
              <div class="switch-row">
                <p class="switch-label" id="view-utah">View</p>
                <div class="chart-tabs" role="tablist" aria-labelledby="view-utah">
                  <button role="tab" id="tab-rate" aria-controls="panel-rate" aria-selected="true" tabindex="0">
                    Rate today
                  </button>
                  <button role="tab" id="tab-inc" aria-controls="panel-inc" aria-selected="false" tabindex="-1">
                    Proposed increase
                  </button>
                </div>
              </div>
              <div role="tabpanel" id="panel-rate" aria-labelledby="tab-rate">${rateChartHtml(c)}</div>
              <div role="tabpanel" id="panel-inc" aria-labelledby="tab-inc" hidden>${increaseChartHtml(c)}</div>
              ${utahNotes}
            </div>

            ${sl ? `<div class="scope-panel" data-scope-panel="slc" hidden>
              <div class="switch-row">
                <p class="switch-label" id="view-slc">View</p>
                <div class="chart-tabs" role="tablist" aria-labelledby="view-slc">
                  <button role="tab" id="tab-sl-rate" aria-controls="panel-sl-rate" aria-selected="true" tabindex="0">
                    Rate today
                  </button>
                  <button role="tab" id="tab-sl-inc" aria-controls="panel-sl-inc" aria-selected="false" tabindex="-1">
                    Proposed increase
                  </button>
                </div>
              </div>
              <div role="tabpanel" id="panel-sl-rate" aria-labelledby="tab-sl-rate">${saltLakeChartHtml(sl)}</div>
              <div role="tabpanel" id="panel-sl-inc" aria-labelledby="tab-sl-inc" hidden>${saltLakeIncreaseChartHtml(sl)}</div>
              ${saltLakeNotes(sl)}
            </div>` : ""}
          </div>`;
        return panel("How Eagle Mountain compares", "Its rate against Utah County and Salt Lake County cities", body, false, "p-compare");
      }

      /* --- Salt Lake County: current rates, Eagle Mountain dropped in as a
         dashed out-of-county reference so you can read where it would fall.
         Salt Lake County's metro townships and several cities fund police and
         fire through separate county service areas, so their city-levy bars
         understate what residents pay — flagged with † and spelled out below. */
      function saltLakeChartHtml(sl) {
        const em = sl.eagle_mountain;
        const ref = { name: EM, current_rate: sl.reference.current_rate, isRef: true };
        const rows = [...sl.cities, ref].sort((a, b) => b.current_rate - a.current_rate);
        const max = axisMax(rows.map((r) => r.current_rate));
        let offCount = 0;

        const bars = rows
          .map((r) => {
            const isRef = r.isRef;
            const off = r.current_rate > max;
            if (off) offCount++;
            const frac = Math.min(Math.max(r.current_rate / max, 0.004), 1);
            const ext = r.external_services ? '<span class="ast" aria-hidden="true">†</span>' : "";
            const tip = isRef
              ? `${EM} — ${rate6(r.current_rate)} (Utah County, shown for comparison)`
              : `${r.name} — ${rate6(r.current_rate)}${r.external_services ? " · general city levy only; funds police/fire through separate service areas" : ""}`;
            return `
              <div class="crow ${isRef ? "is-em is-ref" : ""} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(isRef ? EM : r.name)}${ext}</span>
                <span class="ctrack">
                  <span class="cbar ${isRef ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(frac)}"></span>
                  ${valCell(frac, off, rate6(r.current_rate))}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart">
          <figcaption>
            <h3>City property tax rate, today — Salt Lake County</h3>
            <p>Each city's own general levy. Eagle Mountain (Utah County) is dropped in as a dashed
               reference: its current rate would be the ${ordinal(em.rank_current_low)}-lowest of these
               ${em.total_with_reference}, and the proposed rate would move it to the
               ${ordinal(em.rank_proposed_high)}-highest.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>City levy</span>
            <span class="lg"><i class="sw sw-ref"></i>Eagle Mountain (reference)</span>
          </div>
          <div class="chart-body">${bars}</div>
          <p class="chart-foot">
            <span aria-hidden="true">†</span> Levies little or no general city rate; funds police and fire
            (and, for the metro townships, most services) through separate countywide service districts not
            shown in these bars.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "City levy"],
            rows.map((r) => [r.isRef ? EM + " (ref.)" : r.name, rate6(r.current_rate)])
          )}
        </figure>`;
      }

      /* --- Salt Lake County chart 2: where the 2026 proposals would leave each
         city. Same cities, same rate axis as the current-rate chart, re-sorted by
         the rate each would end up at. Solid segment = today's rate; hatched
         segment = the noticed increase on top. Eagle Mountain is kept as the same
         dashed out-of-county reference, now showing its proposed rate. */
      function saltLakeIncreaseChartHtml(sl) {
        const em = sl.eagle_mountain;
        const ref = {
          name: EM,
          current_rate: sl.reference.current_rate,
          resulting_rate: sl.reference.proposed_rate,
          isRef: true,
        };
        const resOf = (r) => (r.isRef ? r.resulting_rate : resultingRate(sl, r));
        const all = [...sl.cities, ref];
        const nowRank = new Map(
          [...all].sort((a, b) => b.current_rate - a.current_rate).map((x, i) => [x.name, i + 1])
        );
        const rows = [...all].sort((a, b) => resOf(b) - resOf(a));
        const max = axisMax(rows.map(resOf));
        const proposing = sl.proposals.length;
        let offCount = 0;
        // Rank Eagle Mountain's proposed rate against everyone's *resulting* rate
        // (each city's own increase applied), so the caption can't drift from the bars.
        const emResRank = rows.findIndex((r) => r.isRef) + 1;

        const bars = rows
          .map((r, i) => {
            const isRef = r.isRef;
            const p = isRef ? null : proposalFor(sl, r.name);
            const res = resOf(r);
            const off = res > max;
            if (off) offCount++;
            const fNow = Math.min(Math.max(r.current_rate / max, 0.004), 1);
            const fRes = Math.min(res / max, 1);
            const hasInc = isRef || !!p;
            const moved = nowRank.get(r.name) - (i + 1);

            const ext = !isRef && r.external_services ? '<span class="ast" aria-hidden="true">†</span>' : "";
            const levy = p && p.levy ? '<span class="ast" aria-hidden="true">‡</span>' : "";

            const tip = isRef
              ? `${EM} — ${rate6(r.current_rate)} → ${rate6(res)} (Utah County, shown for comparison)`
              : p
                ? `${r.name} — ${rate6(r.current_rate)} → ${rate6(res)} (+${p.pct}%, derived rate) · ${p.purpose}`
                : `${r.name} — no increase noticed; holds at ${rate6(r.current_rate)}`;

            return `
              <div class="crow ${isRef ? "is-em is-ref" : ""} ${hasInc ? "" : "no-prop"} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(isRef ? EM : r.name)}${ext}${levy}</span>
                <span class="ctrack">
                  ${hasInc ? `<span class="cbar cprop ${isRef ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(fRes)}"></span>` : ""}
                  <span class="cbar ${isRef ? "cem" : ""} ${off && !hasInc ? "bar-off" : ""}" style="width:${barSpan(fNow)}"></span>
                  ${valCell(fRes, off, `${rate6(res)}${moved > 0 ? `<span class="cmove up" aria-hidden="true">▲${moved}</span><span class="sr-only"> up ${moved} places</span>` : ""}`)}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart chart--wide-val">
          <figcaption>
            <h3>Where the ${sl.proposal_year} proposals would leave each city — Salt Lake County</h3>
            <p>Same cities, same rate axis — re-sorted by the rate each would end up at.
               ${proposing} of Salt Lake County's ${sl.cities.length} cities noticed a ${sl.proposal_year}
               increase. Eagle Mountain (Utah County) is dropped in as a dashed reference; with every city's
               proposal applied its rate would rank ${ordinal(emResRank)}-highest of these ${em.total_with_reference}.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Rate today</span>
            <span class="lg"><i class="sw sw-prop-neutral"></i>Proposed increase</span>
            <span class="lg"><i class="sw sw-ref"></i>Eagle Mountain (reference)</span>
          </div>
          <div class="chart-body">${bars}</div>
          <p class="chart-foot">
            <span aria-hidden="true">†</span> Funds police/fire (and, for metro townships, most services) through
            separate countywide service districts not shown here.
            <span aria-hidden="true">‡</span> Raises a dedicated levy (public safety), not the general city rate.
            Only Eagle Mountain has published a proposed rate — the Salt Lake figures are derived from each
            city's own noticed dollar impact.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "Rate today", "Rate if it passes", "Increase", "Purpose"],
            rows.map((r) => {
              const p = r.isRef ? null : proposalFor(sl, r.name);
              return [
                r.isRef ? EM + " (ref.)" : r.name,
                rate6(r.current_rate),
                rate6(resOf(r)),
                r.isRef ? "reference" : p ? `+${p.pct}% (${p.rate_source})` : "No increase noticed",
                r.isRef ? "—" : p ? p.purpose : "—",
              ];
            })
          )}
        </figure>`;
      }

      function saltLakeNotes(sl) {
        return `
          <div class="county-notes">
            <h3>About these numbers</h3>
            <ul>${sl.caveats.map((x) => `<li>${CT.escapeHtml(x)}</li>`).join("")}</ul>
            <p class="src">
              Rates: <a href="${sl.rate_source.url}" rel="nofollow noopener">${CT.escapeHtml(sl.rate_source.title)}</a>,
              ${CT.escapeHtml(sl.rate_source.publisher)} — ${sl.rate_year} final adopted, city levy only.
              ${sl.proposal_source ? `Proposed increases: <a href="${sl.proposal_source.notice_url || sl.proposal_source.url}" rel="nofollow noopener">Salt Lake County ${sl.proposal_year} truth-in-taxation notices</a> (per-city purposes via <a href="${sl.proposal_source.url}" rel="nofollow noopener">${CT.escapeHtml(sl.proposal_source.publisher)}</a>).` : ""}
            </p>
          </div>`;
      }

      // Both charts list the same cities in the same order, so toggling swaps the
      // values in place instead of reshuffling the rows out from under the reader.
      const cityOrder = (c) => [...c.cities].sort((a, b) => b.current_rate - a.current_rate);
      const proposalFor = (c, name) => c.proposals.find((p) => p.city === name) || null;

      /* --- shared bar geometry ---------------------------------------------
         A couple of cities (e.g. Vineyard) levy ~2x everyone else, and left to
         their own devices they stretch the axis so the other two dozen — the
         middle of the pack, where Eagle Mountain lives — collapse into unreadable
         stubs. So the axis maxes out at the top of the *main cluster*, not the
         literal max: anything past the Tukey upper fence (Q3 + 1.5·IQR) is drawn
         to the edge and flagged as running off the top of the scale. When the
         data has no such outlier the fence catches nothing and this is just
         max·1.02, exactly as before. Recomputed per chart so the weekly ingest
         can move the cutoff on its own. */
      function axisMax(values) {
        const v = [...values].sort((a, b) => a - b);
        const q = (p) => {
          const i = (v.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
          return v[lo] + (v[hi] - v[lo]) * (i - lo);
        };
        const fence = q(0.75) + 1.5 * (q(0.75) - q(0.25));
        const inRange = v.filter((x) => x <= fence);
        return (inRange.length ? inRange[inRange.length - 1] : v[v.length - 1]) * 1.02;
      }
      // Each bar is drawn to a fraction of (track width − label gutter), so the
      // value can ride just past the bar's end without ever overflowing the row.
      const barSpan = (frac) => `calc(${frac.toFixed(4)} * (100% - var(--track-gutter)))`;
      const valCell = (frac, off, inner) =>
        `<span class="cval" style="left:${barSpan(frac)}">${inner}${off ? '<span class="offmark" aria-hidden="true"> ↑</span>' : ""}</span>`;
      const OFF_NOTE = `<span aria-hidden="true">↑</span> Rate runs past the top of the scale; the exact figure is still shown.`;

      /* --- chart 1: current rate only, no proposal --- */
      function rateChartHtml(c) {
        const rows = cityOrder(c);
        const max = axisMax(rows.map((r) => r.current_rate));
        let offCount = 0;

        const bars = rows
          .map((r) => {
            const isEM = r.name === EM;
            const off = r.current_rate > max;
            if (off) offCount++;
            const frac = Math.min(r.current_rate / max, 1);
            const tip = `${r.name} — ${rate6(r.current_rate)}${r.mostly_other_county ? " (mostly Salt Lake Co.)" : ""}`;
            return `
              <div class="crow ${isEM ? "is-em" : ""} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(r.name)}${r.mostly_other_county ? '<span class="ast" aria-hidden="true">*</span>' : ""}</span>
                <span class="ctrack">
                  <span class="cbar ${isEM ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(frac)}"></span>
                  ${valCell(frac, off, rate6(r.current_rate))}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart">
          <figcaption>
            <h3>City property tax rate, today</h3>
            <p>Utah County municipalities, city levy only. Eagle Mountain sits second from the bottom.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Current rate</span>
            <span class="lg"><i class="sw sw-em"></i>Eagle Mountain</span>
          </div>
          <div class="chart-body">${bars}</div>
          <p class="chart-foot"><span aria-hidden="true">*</span> Levies in Utah County but lies mostly in Salt Lake County.${offCount ? " " + OFF_NOTE : ""}</p>
          ${tableView(["City", "Current rate"], rows.map((r) => [r.name, rate6(r.current_rate)]))}
        </figure>`;
      }

      /* --- chart 2: where the proposals leave each city ---
         Same 26 cities, same rate axis as chart 1, re-sorted by the rate each
         city would end up at. Solid segment = today's rate; hatched segment =
         the proposed increase on top of it.
      */
      const resultingRate = (c, city) => {
        const p = proposalFor(c, city.name);
        return p ? p.resulting_rate : city.current_rate;
      };

      function increaseChartHtml(c) {
        const nowRank = new Map(cityOrder(c).map((x, i) => [x.name, i + 1]));
        const rows = [...c.cities].sort((a, b) => resultingRate(c, b) - resultingRate(c, a));
        const max = axisMax(rows.map((r) => resultingRate(c, r)));
        const proposing = c.proposals.length;
        let offCount = 0;

        const bars = rows
          .map((city, i) => {
            const p = proposalFor(c, city.name);
            const isEM = city.name === EM;
            const res = resultingRate(c, city);
            const off = res > max;
            if (off) offCount++;
            const fNow = Math.min(city.current_rate / max, 1);
            const fRes = Math.min(res / max, 1);
            const moved = nowRank.get(city.name) - (i + 1);

            const mark = p && p.rate_source === "approximate" ? '<span class="ast" aria-hidden="true">‡</span>' : "";
            const levy = p && p.levy ? '<span class="ast" aria-hidden="true">†</span>' : "";

            const tip = p
              ? `${city.name} — ${rate6(city.current_rate)} → ${rate6(res)} (+${p.pct}%, ${p.rate_source === "published" ? "published rate" : p.rate_source + " rate"}) · ${p.purpose}`
              : `${city.name} — no increase proposed; holds at ${rate6(city.current_rate)}`;

            return `
              <div class="crow ${isEM ? "is-em" : ""} ${p ? "" : "no-prop"} ${off ? "off" : ""}" data-tip="${CT.escapeHtml(tip)}">
                <span class="cname">${CT.escapeHtml(city.name)}${levy}${mark}</span>
                <span class="ctrack">
                  ${p ? `<span class="cbar cprop ${isEM ? "cem" : ""} ${off ? "bar-off" : ""}" style="width:${barSpan(fRes)}"></span>` : ""}
                  <span class="cbar ${isEM ? "cem" : ""} ${off && !p ? "bar-off" : ""}" style="width:${barSpan(fNow)}"></span>
                  ${valCell(fRes, off, `${rate6(res)}${moved > 0 ? `<span class="cmove up" aria-hidden="true">▲${moved}</span><span class="sr-only"> up ${moved} places</span>` : ""}`)}
                </span>
              </div>`;
          })
          .join("");

        return `
        <figure class="chart chart--wide-val">
          <figcaption>
            <h3>Where the ${c.proposal_year} proposals would leave each city</h3>
            <p>Same cities, same rate axis — re-sorted by the rate each would end up at.
               ${proposing} of ${rows.length} are proposing an increase. Eagle Mountain would move from the
               ${ordinal(rows.length - c.eagle_mountain.rank_current + 1)}-lowest rate in the county to the
               ${ordinal(c.eagle_mountain.rank_proposed)}-highest.</p>
          </figcaption>
          <div class="legend">
            <span class="lg"><i class="sw sw-base"></i>Rate today</span>
            <span class="lg"><i class="sw sw-prop-neutral"></i>Proposed increase</span>
            <span class="lg"><i class="sw sw-em"></i>Eagle Mountain</span>
          </div>
          <div class="chart-body">${bars}</div>
          <p class="chart-foot">
            <span aria-hidden="true">†</span> Raises a dedicated levy (library; public safety), not the general city rate.
            <span aria-hidden="true">‡</span> Rests on a rounded dollar figure; approximate.
            Only Eagle Mountain has published a proposed rate — the rest are derived from each city's
            own noticed dollar impact.${offCount ? " " + OFF_NOTE : ""}
          </p>
          ${tableView(
            ["City", "Rate today", "Rate if it passes", "Increase", "Purpose"],
            rows.map((city) => {
              const p = proposalFor(c, city.name);
              return [
                city.name,
                rate6(city.current_rate),
                p ? rate6(p.resulting_rate) : rate6(city.current_rate),
                p ? `+${p.pct}% (${p.rate_source})` : "No increase proposed",
                p ? p.purpose : "—",
              ];
            })
          )}
        </figure>`;
      }

      // Tabs: click, plus Left/Right/Home/End per the WAI-ARIA tabs pattern.
      // Each .chart-tabs group is wired independently — the Utah County and Salt
      // Lake County tablists must not deselect each other's panels.
      function wireChartTabs() {
        document.querySelectorAll(".chart-tabs").forEach((group) => {
          const tabs = [...group.querySelectorAll('[role="tab"]')];
          if (!tabs.length) return;

          const select = (tab) => {
            tabs.forEach((t) => {
              const on = t === tab;
              t.setAttribute("aria-selected", String(on));
              t.tabIndex = on ? 0 : -1;
              document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
            });
            tab.focus();
          };

          tabs.forEach((tab, i) => {
            tab.addEventListener("click", () => select(tab));
            tab.addEventListener("keydown", (e) => {
              const k = e.key;
              let next = null;
              if (k === "ArrowRight") next = tabs[(i + 1) % tabs.length];
              else if (k === "ArrowLeft") next = tabs[(i - 1 + tabs.length) % tabs.length];
              else if (k === "Home") next = tabs[0];
              else if (k === "End") next = tabs[tabs.length - 1];
              if (next) {
                e.preventDefault();
                select(next);
              }
            });
          });
        });
      }

      // Every chart ships a table view — identity is never carried by color alone.
      function tableView(head, rows) {
        return `
        <details class="tableview">
          <summary>View as table</summary>
          <div class="tablewrap">
            <table class="data">
              <thead><tr>${head.map((h) => `<th scope="col">${CT.escapeHtml(h)}</th>`).join("")}</tr></thead>
              <tbody>${rows
                .map((r) => `<tr>${r.map((cell) => `<td>${CT.escapeHtml(String(cell))}</td>`).join("")}</tr>`)
                .join("")}</tbody>
            </table>
          </div>
        </details>`;
      }

      /* ---------------- table export ----------------
         Every data table on the page — the official schedule, each chart's
         "View as table" fallback, and the statewide rankings — gets a small
         toolbar beneath it to take the numbers away as CSV or onto the
         clipboard. The rendered DOM is the single source, so whatever rows and
         sort order the reader is looking at is exactly what exports. Wired once,
         after render, so it covers tables added by any panel without each panel
         having to opt in. */
      function wireTableExports() {
        document.querySelectorAll("table.data").forEach((table, i) => {
          const anchor = table.closest(".tablewrap") || table;
          const after = anchor.nextElementSibling;
          if (after && after.classList.contains("table-export")) return; // idempotent

          const name = exportName(table, i);
          const bar = document.createElement("div");
          bar.className = "table-export";
          bar.innerHTML = `
            <span class="tx-exp-label">Export</span>
            <button type="button" class="tx-exp-btn" data-act="csv">Download CSV</button>
            <button type="button" class="tx-exp-btn" data-act="copy">Copy</button>
            <span class="tx-exp-note" role="status" aria-live="polite"></span>`;
          anchor.after(bar);

          const note = bar.querySelector(".tx-exp-note");
          let noteTimer = 0;
          const flash = (msg) => {
            note.textContent = msg;
            clearTimeout(noteTimer);
            noteTimer = setTimeout(() => { note.textContent = ""; }, 2500);
          };

          bar.querySelector('[data-act="csv"]').addEventListener("click", () => {
            downloadCsv(tableToCsv(table), name + ".csv");
            flash("Downloaded");
          });
          bar.querySelector('[data-act="copy"]').addEventListener("click", async () => {
            flash((await copyText(tableToCsv(table))) ? "Copied" : "Copy failed");
          });
        });
      }

      // A stable, human-readable filename for the exported table: its own
      // caption or heading, falling back to the panel it lives in.
      function exportName(table, i) {
        const h3 = table.closest("figure")?.querySelector("figcaption h3");
        const summ = table.closest("details.panel")?.querySelector("summary .panel-tt b");
        const raw = (h3 && h3.textContent) || table.id || (summ && summ.textContent) || `table-${i + 1}`;
        const slug = raw.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
        return "eagle-mountain-" + (slug || "table");
      }

      // A cell's exported text is its visible text minus the decorations that
      // aren't data: sort arrows, rank-move chevrons, the "today/proposed"
      // pill, footnote asterisks, and screen-reader-only spans.
      function cellCsvText(el) {
        const c = el.cloneNode(true);
        c.querySelectorAll(".sarrow, .cmove, .you-pill, .prop-pill, .sr-only, .offmark, .ast").forEach((n) => n.remove());
        return c.textContent.replace(/\s+/g, " ").trim();
      }

      const csvField = (s) => (/[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);

      function tableToCsv(table) {
        const line = (tr) => [...tr.querySelectorAll("th,td")].map((c) => csvField(cellCsvText(c))).join(",");
        const lines = [];
        table.querySelectorAll("thead tr").forEach((tr) => lines.push(line(tr)));
        table.querySelectorAll("tbody tr").forEach((tr) => lines.push(line(tr)));
        return lines.join("\r\n");
      }

      function downloadCsv(csv, filename) {
        // A BOM so Excel reads it as UTF-8 (the †/‡ footnote marks survive).
        const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) { /* fall through to the legacy path */ }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch (e) {
          return false;
        }
      }

      /* ---------------- statewide ranking ----------------
         All 253 Utah municipalities ranked by their own city levy — the same
         city-only measure as the county charts. A single sortable table rather
         than a chart: 253 bars would be a wall, but the reader can sort by rank,
         name, or rate and find any city, with Eagle Mountain's row lit up. */
      function statewidePanel(county) {
        const sw = county.statewide;
        const src = county.rate_source;
        const em = sw.eagle_mountain;
        const N = sw.total_cities;

        // Every noticed 2026 proposal this site tracks — Utah County and Salt
        // Lake County both — keyed by city name to its resulting rate, the same
        // figure the county charts draw. Eagle Mountain is pinned to the
        // statewide dataset's own proposed_rate so the two never drift apart.
        const proposedRate = new Map();
        [...(county.proposals || []), ...((county.salt_lake && county.salt_lake.proposals) || [])]
          .forEach((p) => { if (p.resulting_rate != null) proposedRate.set(p.city, p.resulting_rate); });
        proposedRate.set(EM, em.proposed_rate);
        const othersCount = proposedRate.size - 1; // proposing cities besides Eagle Mountain

        // Rank high → low: rank 1 is the highest city levy in the state.
        // Current-rate ranking — all cities as they are billed today, highest first.
        const current = [...sw.cities]
          .sort((a, b) => b.rate - a.rate)
          .map((r, i) => ({ name: r.name, rate: r.rate, rank: i + 1 }));
        const curRank = new Map(current.map((r) => [r.name, r.rank]));

        // Proposed ranking — swap in every tracked proposal's resulting rate and
        // re-rank, still highest first. Cities with no noticed 2026 proposal keep
        // today's rate: Utah's other 2026 rates aren't certified until after the
        // August hearings, so only the proposals this site tracks are placed.
        const proposed = sw.cities
          .map((r) => ({ name: r.name, rate: proposedRate.has(r.name) ? proposedRate.get(r.name) : r.rate }))
          .sort((a, b) => b.rate - a.rate)
          .map((r, i) => ({ name: r.name, rate: r.rate, rank: i + 1 }));

        const emCur = current.find((r) => r.name === EM).rank; // counted from the top
        const emProp = proposed.find((r) => r.name === EM).rank; // counted from the top
        const climbed = emCur - emProp; // places gained climbing toward #1
        const emCurLow = N - emCur + 1; // the same current rank, counted from the bottom

        const rowsHtml = (list, view) =>
          list
            .map((r) => {
              const isEM = r.name === EM;
              const hasProp = view === "proposed" && proposedRate.has(r.name);
              const moved = hasProp ? curRank.get(r.name) - r.rank : 0; // places climbed
              const movedHtml =
                moved > 0
                  ? ` <span class="cmove up" title="up ${moved} places">▲${moved}</span>`
                  : "";
              const tag = isEM
                ? ` <span class="you-pill">${view === "proposed" ? "proposed" : "today"}</span>`
                : hasProp
                  ? ` <span class="prop-pill" title="Noticed 2026 increase applied">proposed</span>`
                  : "";
              return `<tr${isEM ? ' class="is-em-row"' : ""} data-rank="${r.rank}" data-rate="${r.rate}" data-name="${CT.escapeHtml(r.name)}">
                <td class="num">${r.rank}</td>
                <td>${CT.escapeHtml(r.name)}${tag}</td>
                <td class="num">${rate6(r.rate)}${movedHtml}</td>
              </tr>`;
            })
            .join("");

        const tableHtml = (id, list, view) => `
          <div class="tablewrap statewide-wrap">
            <table class="data statewide" id="${id}">
              <thead><tr>
                <th scope="col" class="num sortable" data-key="rank" aria-sort="ascending" tabindex="0">Rank<span class="sarrow" aria-hidden="true"> ▲</span></th>
                <th scope="col" class="sortable" data-key="name" aria-sort="none" tabindex="0">City<span class="sarrow" aria-hidden="true"></span></th>
                <th scope="col" class="num sortable" data-key="rate" aria-sort="none" tabindex="0">City levy<span class="sarrow" aria-hidden="true"></span></th>
              </tr></thead>
              <tbody>${rowsHtml(list, view)}</tbody>
            </table>
          </div>`;

        const body = `
          <p class="panel-intro">
            Every Utah city and town ranked by its own property tax levy — the same city-only measure as the
            county charts — from the state's ${sw.rate_year} rate report, <strong>highest rate first</strong>.
            Eagle Mountain's current <strong>${rate6(em.current_rate)}</strong> ranks
            <strong>${ordinal(emCur)}-highest</strong> of ${N} — the ${ordinal(emCurLow)}-lowest. Switch to
            <em>With 2026 proposals</em> — Eagle Mountain's and the ${othersCount} other noticed increases this
            site tracks, all applied at once — and Eagle Mountain climbs ${climbed} places to
            <strong>${ordinal(emProp)}-highest</strong>. Sort any column; Eagle Mountain stays lit.
          </p>

          <div class="scope-switch stateview-switch" role="radiogroup" aria-label="Which rate to rank by">
            <button type="button" role="radio" id="sv-current" data-view="current" aria-checked="true" tabindex="0">Rate today</button>
            <button type="button" role="radio" id="sv-proposed" data-view="proposed" aria-checked="false" tabindex="-1">With 2026 proposals</button>
          </div>

          <div class="stateview" data-view-panel="current">${tableHtml("statewide-current", current, "current")}</div>
          <div class="stateview" data-view-panel="proposed" hidden>
            ${tableHtml("statewide-proposed", proposed, "proposed")}
            <p class="chart-foot">
              Every noticed 2026 increase this site tracks — Eagle Mountain's and ${othersCount} others across Utah
              and Salt Lake counties, each marked <span class="prop-pill">proposed</span> — is applied here at its
              resulting rate. Every other city is shown at today's rate: Utah's remaining 2026 city rates aren't
              certified until after the August truth-in-taxation hearings.
            </p>
          </div>

          <p class="chart-foot">
            City levy only — excludes county, school district, and special/service district levies, so it is not
            your total tax bill. Cities with the same rate take adjacent ranks. Source:
            <a href="${src.url}" rel="nofollow noopener">${CT.escapeHtml(src.title)}</a>, ${CT.escapeHtml(src.publisher)}.
          </p>`;
        return panel("Where Eagle Mountain ranks statewide", `Its current rate — and its proposal — against all ${N} Utah cities`, body, false, "p-statewide");
      }

      // The scope switch swaps the whole comparison between Utah County (both
      // tabs) and Salt Lake County (current rates only). Radiogroup semantics,
      // arrow-key operable, per the WAI-ARIA radio pattern.
      function wireCountySwitch() {
        const radios = [...document.querySelectorAll('.scope-switch [role="radio"]')];
        if (!radios.length) return;
        const panelFor = (r) => document.querySelector(`[data-scope-panel="${r.dataset.scope}"]`);
        const select = (radio) => {
          radios.forEach((r) => {
            const on = r === radio;
            r.setAttribute("aria-checked", String(on));
            r.tabIndex = on ? 0 : -1;
            const p = panelFor(r);
            if (p) p.hidden = !on;
          });
          radio.focus();
        };
        radios.forEach((radio, i) => {
          radio.addEventListener("click", () => select(radio));
          radio.addEventListener("keydown", (e) => {
            let next = null;
            if (e.key === "ArrowRight" || e.key === "ArrowDown") next = radios[(i + 1) % radios.length];
            else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = radios[(i - 1 + radios.length) % radios.length];
            if (next) { e.preventDefault(); select(next); }
          });
        });
      }

      // Click or Enter/Space on a header sorts a statewide table. Rank and rate
      // sort numerically, city by name; re-activating a column flips it. Wires
      // both the "today" and "with the proposal" tables independently.
      function wireStatewideTable() {
        document.querySelectorAll("table.data.statewide").forEach((table) => {
          const tbody = table.tBodies[0];
          const rows = [...tbody.rows];
          let curKey = "rank", curDir = 1;
          const val = (tr, key) =>
            key === "name" ? tr.dataset.name.toLowerCase()
              : parseFloat(key === "rank" ? tr.dataset.rank : tr.dataset.rate);
          const sort = (key) => {
            curDir = key === curKey ? -curDir : 1;
            curKey = key;
            rows.sort((a, b) => {
              const va = val(a, key), vb = val(b, key);
              return va < vb ? -curDir : va > vb ? curDir : 0;
            });
            rows.forEach((r) => tbody.appendChild(r));
            table.querySelectorAll("th.sortable").forEach((th) => {
              const on = th.dataset.key === key;
              th.setAttribute("aria-sort", on ? (curDir > 0 ? "ascending" : "descending") : "none");
              th.querySelector(".sarrow").textContent = on ? (curDir > 0 ? " ▲" : " ▼") : "";
            });
          };
          table.querySelectorAll("th.sortable").forEach((th) => {
            th.addEventListener("click", () => sort(th.dataset.key));
            th.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sort(th.dataset.key); }
            });
          });
        });
      }

      // The statewide "rate today" / "with the proposal" toggle. Same radiogroup
      // pattern as the county switch.
      function wireStatewideView() {
        const radios = [...document.querySelectorAll('.stateview-switch [role="radio"]')];
        if (!radios.length) return;
        const panelFor = (r) => document.querySelector(`[data-view-panel="${r.dataset.view}"]`);
        const select = (radio) => {
          radios.forEach((r) => {
            const on = r === radio;
            r.setAttribute("aria-checked", String(on));
            r.tabIndex = on ? 0 : -1;
            const p = panelFor(r);
            if (p) p.hidden = !on;
          });
          radio.focus();
        };
        radios.forEach((radio, i) => {
          radio.addEventListener("click", () => select(radio));
          radio.addEventListener("keydown", (e) => {
            let next = null;
            if (e.key === "ArrowRight" || e.key === "ArrowDown") next = radios[(i + 1) % radios.length];
            else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = radios[(i - 1 + radios.length) % radios.length];
            if (next) { e.preventDefault(); select(next); }
          });
        });
      }

      // One shared tooltip element, positioned to the hovered (mouse) or
      // tapped (touch) row. The exact-value data it carries also lives in each
      // chart's "View as table" fallback, so nothing here is the sole source.
      function wireChartTooltips() {
        const tip = document.createElement("div");
        tip.className = "chart-tip";
        tip.setAttribute("role", "status");
        tip.hidden = true;
        document.body.appendChild(tip);

        let openRow = null;   // row whose tip is currently showing
        let viaTap = false;   // opened by touch — needs an explicit dismiss

        const show = (row) => {
          openRow = row;
          tip.textContent = row.dataset.tip;
          tip.hidden = false;
          const r = row.getBoundingClientRect();
          const t = tip.getBoundingClientRect();
          let left = r.left + window.scrollX + 12;
          left = Math.min(left, window.scrollX + document.documentElement.clientWidth - t.width - 10);
          tip.style.left = Math.max(window.scrollX + 6, left) + "px";
          // Prefer above the row; flip below when sitting above would clip the
          // top of the viewport (e.g. tabbing/tapping the first row up top).
          const clipsTop = r.top - t.height - 8 < 8;
          tip.style.top = (clipsTop ? r.bottom + 8 : r.top - t.height - 8) + window.scrollY + "px";
        };
        const hide = () => { openRow = null; viaTap = false; tip.hidden = true; };

        document.querySelectorAll(".crow[data-tip]").forEach((row) => {
          // Mouse: hover shows the tip.
          row.addEventListener("mouseenter", () => { if (!viaTap) show(row); });
          row.addEventListener("mouseleave", () => { if (!viaTap) hide(); });
          // Touch: no hover, so a tap toggles the tip.
          row.addEventListener("pointerdown", (e) => {
            if (e.pointerType === "mouse") return;
            e.stopPropagation();
            if (openRow === row) hide();
            else { viaTap = true; show(row); }
          });
        });
        // A tap elsewhere, or any scroll, dismisses a tapped-open tip.
        document.addEventListener("pointerdown", () => { if (viaTap) hide(); });
        window.addEventListener("scroll", hide, { passive: true });
      }

      /* ---------------- the meeting record ----------------
         A chronology, grouped by relevance rather than by date — what is coming,
         what happened, what led up to it. Each group carries its own spine, so
         one continuous line can't run backwards at a seam.
      */
      function recordPanel(tax) {
        const order = ["hearing", "record", "context"];
        const groups = order
          .map((g) => {
            const items = tax.meetings
              .filter((m) => m.group === g)
              .sort((a, b) => (a.date < b.date ? -1 : 1));
            if (!items.length) return "";
            const meta = tax.groups[g];
            return `
              <section class="rail-group rail-${g}">
                <h3 class="rail-group-title">${CT.escapeHtml(meta.label)}</h3>
                <p class="rail-group-note">${CT.escapeHtml(meta.note)}</p>
                <ol class="rail-line">
                  ${items
                    .map(
                      (m) => `<li class="rail-item">
                        <span class="rail-node" aria-hidden="true"></span>
                        ${meetingCard(m)}
                      </li>`
                    )
                    .join("")}
                </ol>
              </section>`;
          })
          .join("");
        return panel("Every meeting it moved through", "Two hearings still ahead, then the full record and what led up to it", groups, false, "p-record");
      }

      function meetingCard(m) {
        const badges = [
          m.transcript ? `<span class="mini-pill tx">Transcript</span>` : "",
          m.upcoming ? `<span class="mini-pill up">Upcoming</span>` : "",
          m.no_mention ? `<span class="mini-pill ctx">Context only</span>` : "",
        ].join("");

        const items = (m.items || [])
          .map(
            (it) => `
            <li>
              <span class="iref">${CT.escapeHtml(it.ref)}</span>
              <span class="itext">${CT.escapeHtml(it.text)}</span>
              <span class="iout ${/^passed/i.test(it.outcome) ? "ok" : "unk"}">${CT.escapeHtml(it.outcome)}</span>
            </li>`
          )
          .join("");

        const head = `
          <div class="mc-head">
            <span class="mc-kind">${CT.escapeHtml(m.kind)}</span>
            <span class="mc-date">${CT.fmtDate(m.date)}</span>
          </div>
          <p class="mc-title">${CT.escapeHtml(m.title)}</p>
          <p class="mc-note">${CT.escapeHtml(m.note)}</p>
          ${items ? `<ul class="mc-items">${items}</ul>` : ""}
          ${badges ? `<div class="mc-badges">${badges}</div>` : ""}
        `;

        // No meeting id means nothing to link to yet — a scheduled future
        // hearing. Render it as a card, not a dead link.
        if (m.id == null) {
          return `<article class="tax-card is-upcoming">${head}</article>`;
        }
        return `<a class="tax-card" href="meetings.html?id=${m.id}">
          ${head}
          <span class="mc-go">Meeting #${m.id} <span aria-hidden="true">→</span></span>
        </a>`;
      }
    </script>
  </body>
</html>
