          .map(
            (y) => `
            <tr>
              <th scope="row">FY${esc(y.year)}</th>
              <td class="num mono">${esc(y.permits.toLocaleString("en-US"))}</td>
            </tr>`
          )
          .join("");

        const caveats = (p.caveats || []).map((x) => `<li>${esc(x)}</li>`).join("");

        return panel(p.heading,
          "Thirteen years of the city's own count of new homes, and the growth rate it produces", `
          <p class="panel-intro">${esc(p.lede)}</p>
          <figure class="chart proj-chart">
            <figcaption>
              <h4 id="permits-title">${esc(p.series_label)}</h4>
            </figcaption>
            <div class="proj-plot" id="plot-permits"></div>
            <p class="chart-foot" id="permits-foot"></p>
          </figure>
          <p><strong>How 4.8% comes out of it.</strong> ${esc(p.derivation)}</p>
          <p><strong>What it settles.</strong> ${esc(p.settles)}</p>
          <p class="proj-caveat"><strong>What it corrects.</strong> ${esc(p.corrects)}</p>
          <h4 class="proj-sub-h">What it does not cover</h4>
          <ul class="proj-list">${caveats}</ul>
          ${confirmNote(p, "proj-input-note")}
          ${finePrint("The counts, year by year", `
            <div class="tablewrap">
              <table class="data">
                <thead>
                  <tr>
                    <th scope="col">Fiscal year</th>
                    <th scope="col" class="num">New residential permits</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          `)}
          <p class="proj-src"><strong>${esc(p.source.publisher)}</strong> · ${esc(p.source.doc)}${
            p.source.date ? " · " + esc(CT.fmtDate(p.source.date)) : ""
          }<span class="proj-li-note">${esc(p.source.note || "")}</span></p>
        `, false, "p-permits");
      }

      /* Same geometry helpers as the two money charts, so this one lines up with
         them visually. Counts rather than dollars on the axis, and the bar for
         the year the 4.8% is derived from is marked. */
      function drawPermits(c) {
        const host = document.getElementById("plot-permits");
        const p = c && c.permit_history;
        if (!host || !p || !Array.isArray(p.years) || !p.years.length) return;

        const years = p.years;
        const n = years.length;
        const counts = years.map((y) => y.permits);
        const g = geometry(host, "gap");
        const { x: X, bw, colW } = scaleX(g, n);
        const plotH = g.H - g.mt - g.mb;
        const { ticks, lo, hi } = niceTicks(0, Math.max(...counts) * 1.12, g.narrow ? 2 : 4);
        const Y = (v) => g.mt + ((hi - v) / (hi - lo)) * plotH;
        const base = Y(lo);
        const last = years[n - 1];

        const grid = ticks
          .map(
            (v) => `
            <g class="proj-tick${v === 0 ? " is-zero" : ""}">
              <line x1="${g.ml}" x2="${g.W - g.mr}" y1="${Y(v).toFixed(2)}" y2="${Y(v).toFixed(2)}" />
              <text x="${g.ml - 8}" y="${(Y(v) + 3.5).toFixed(2)}" text-anchor="end"
                    font-size="${g.fs}">${esc(v.toLocaleString("en-US"))}</text>
            </g>`
          )
          .join("");

        // Every other year label on a narrow screen: thirteen of them will not
        // fit, and dropping alternates keeps the first and the last, which are
        // the two a reader looks for.
        const bars = years
          .map((y, i) => {
            const top = Y(y.permits);
            const isLast = i === n - 1;
            const showLab = !g.narrow || i % 2 === 0 || isLast;
            return `
              <g class="proj-bar-g" role="img"
                 aria-label="FY${esc(y.year)}: ${esc(y.permits.toLocaleString("en-US"))} new residential permits">
                <rect class="proj-bar ${isLast ? "is-def" : "is-sur"}"
                      x="${(X(i) - bw / 2).toFixed(2)}" y="${top.toFixed(2)}"
                      width="${bw.toFixed(2)}" height="${Math.max(1.5, base - top).toFixed(2)}"
                      fill="${isLast ? "var(--proj-def-fill-solid)" : "var(--proj-sur-fill-solid)"}" />
                ${showLab
                  ? `<text class="proj-barlab" x="${X(i).toFixed(2)}" y="${(top - 5).toFixed(2)}"
                           text-anchor="middle" font-size="${g.fs}">${esc(y.permits.toLocaleString("en-US"))}</text>`
                  : ""}
              </g>`;
          })
          .join("");

        const xLabels = years
          .map((y, i) =>
            !g.narrow || i % 2 === 0 || i === n - 1
              ? `<text class="proj-xlab" x="${X(i).toFixed(2)}" y="${g.H - 6}" text-anchor="middle"
                       font-size="${g.fs}">${esc(g.narrow ? String(y.year).slice(2) : "FY" + String(y.year).slice(2))}</text>`
              : ""
          )
          .join("");

        host.innerHTML = `
          <svg class="proj-svg" viewBox="0 0 ${g.W} ${g.H}" width="${g.W}" height="${g.H}"
               role="group" aria-labelledby="permits-title">
            <g class="proj-grid">${grid}</g>
            ${bars}
            <line class="proj-zero" x1="${g.ml}" x2="${g.W - g.mr}" y1="${base.toFixed(2)}" y2="${base.toFixed(2)}" />
            <g class="proj-axis">${xLabels}</g>
          </svg>`;

        const peak = years.reduce((a, y) => (y.permits > a.permits ? y : a), years[0]);
        const foot = document.getElementById("permits-foot");
        if (foot)
          foot.innerHTML =
            `The marked bar is <strong>FY${esc(last.year)}</strong>, the year the 4.8% is derived from: ` +
            `<strong>${esc(last.permits.toLocaleString("en-US"))}</strong> permits. The highest year on this ` +
            `record is FY${esc(peak.year)} at <strong>${esc(peak.permits.toLocaleString("en-US"))}</strong> — ` +
            `below the 1,800 a year the council was told at the hearing.`;
      }

      function srcLine(s) {
        if (!s) return "";
        const who = esc(s.speaker || s.publisher || "");
        // A cited document is the most useful thing here, so it leads and it is
        // a link wherever the config carries a URL.
        const doc = s.doc
          ? s.url
            ? `<a href="${esc(s.url)}" rel="nofollow noopener">${esc(s.doc)} <span aria-hidden="true">↗</span></a>`
            : esc(s.doc)
          : s.url
            ? `<a href="${esc(s.url)}" rel="nofollow noopener">Source <span aria-hidden="true">↗</span></a>`
            : s.file
              ? esc(s.file)
              : "";
        const link =
          s.meeting != null
            ? `<a href="meetings.html?id=${encodeURIComponent(s.meeting)}">${esc(CT.fmtDate(s.date))} · Meeting #${esc(s.meeting)} <span aria-hidden="true">→</span></a>`
            : s.date && !s.doc
              ? `<span>${esc(CT.fmtDate(s.date))}</span>`
              : "";
        return `<span class="proj-src">${[who, doc, link].filter(Boolean).join(" · ")}</span>`;
      }

      function srcQuote(s) {
        if (!s) return "";
        return `
          <figure class="arg-quote">
            ${s.quote ? `<blockquote>${esc(s.quote)}</blockquote>` : ""}
            <figcaption>
              <span class="aq-who">${esc(s.speaker || s.publisher || "")}</span>
              ${s.meeting != null
                ? `<a class="aq-src" href="meetings.html?id=${encodeURIComponent(s.meeting)}">${esc(CT.fmtDate(s.date))} · Meeting #${esc(s.meeting)} <span aria-hidden="true">→</span></a>`
                : s.date ? `<span class="aq-src">${esc(CT.fmtDate(s.date))}</span>` : ""}
            </figcaption>
          </figure>`;
      }

      /* ======================================================================
         Where a shortfall lands

         The rest of the page answers "how big is the gap". This section answers
         the question a reader actually has next, which is "so what gives" — and
         it has to do that without pretending to know. Three things it can say
         honestly, in descending order of how well the record supports them:

           1. Arithmetic. Most of the General Fund is under contract or spoken
              for by restricted revenue, so the pool a gap can come out of is
              much smaller than $42.65M. That is checkable line by line.
           2. The city's own statement of what the money was for. Property tax
              was taking the Sheriff's contract off sales tax; the council named
              twice, on the record, what the freed sales tax was earmarked for.
              A shortfall is that list not happening.
           3. What councilmembers said in public would give — quoted, not
              paraphrased, and not attributed to anyone the recording does not
              identify.

         What it must never do is present any of that as a decision. The caveat
         is not a footnote here; it is the last block in the section and it runs
         straight into "what a projected deficit does and does not mean".
         ====================================================================== */

      function exposureHtml(c) {
        const x = c.exposure;

        const earmarked = x.earmarked.items
          .map(
            (i) => `
            <li>
              <span class="proj-ear-fig">${esc(i.figure)}</span>
              <span class="proj-ear-lab">${esc(i.label)}</span>
              <span class="proj-ear-txt">${esc(i.text)}</span>
            </li>`
          )
          .join("");

        const voices = x.voices.quotes.map((q) => srcQuote(q)).join("");

        // "What a gap does and doesn't mean" used to be a section of its own,
        // immediately after this one and saying much the same thing twice. It
        // closes this section instead: the caveat below runs straight into the
        // list of what a council actually does about a gap.
        const i = c.interpretation;

        return `
          <section class="tax-sec reveal" style="--i:4" id="s-exposure" aria-labelledby="exp-title">
            <div class="sec-head">
              <p class="eyebrow"><span class="sec-num" aria-hidden="true">04</span>What it could affect</p>
              <h2 class="sec-h2" id="exp-title">${esc(x.heading)}</h2>
              <p class="sec-sub">${esc(x.lede)}</p>
            </div>

            <div id="exposure-pool"></div>

            <div class="proj-ear">
              <h3 class="proj-sub-h2">${esc(x.earmarked.heading)}</h3>
              <p class="proj-ear-lede">${esc(x.earmarked.lede)}</p>
              <ul class="proj-ear-list">${earmarked}</ul>
              ${srcQuote(x.earmarked.source)}
              <p class="proj-input-note">${esc(x.earmarked.note)}</p>
            </div>

            <!-- Quotations are evidence: they are what the record actually
                 says, and a reader who wants to check the section's claims
                 needs them verbatim. But they are also the least compressible
                 thing on the page — four councilmembers making one point at
                 length — so they sit behind a click rather than in the run of
                 the text. Nothing is paraphrased away; the panel carries them
                 in full, attributed exactly as the recording allows. -->
            <div class="proj-voices">
              ${panel(x.voices.heading, x.voices.lede, voices, false, "p-voices")}
            </div>

            <div class="proj-meaning">
              <h3 class="proj-sub-h2">${esc(i.heading)}</h3>
              <p class="proj-ear-lede">${esc(i.lede)}</p>
              <ul class="proj-options">
                ${i.options.map((o) => `<li>${esc(o)}</li>`).join("")}
              </ul>
              <p class="note-fine proj-exposure-caveat"><strong>None of this is a prediction.</strong>
                ${esc(x.caveat)}</p>
            </div>
          </section>`;
      }

      /* The narrowing, and this scenario's gap measured against what is left of
         the budget after it. Live, because the gap moves with the scenario and
         with every assumption. */
      function paintExposure(r) {
        const poolEl = document.getElementById("exposure-pool");
        if (!poolEl) return;
        if (!r.ok || !r.rows.length) { poolEl.innerHTML = ""; return; }

        const x = state.config.exposure;
        const P = x.pool;
        // The pool is built from the shipped FY2026–27 budget. If a reader has
        // edited the expenditure baseline the tiers no longer describe it, so
        // the pool scales with the edit and says that it has.
        const scale = r.rows[0].expenditures / P.total;
        const edited = Math.abs(scale - 1) > 1e-9;
        const tierAmt = (t) => t.amount * scale;
        const total = P.total * scale;
        const reachable = total - P.tiers.reduce((a, t) => a + tierAmt(t), 0);

        // The review's sharpest arithmetic point. The page held the $6.5M of
        // transfers outside the reachable pool while its own footnote said they
        // are mostly deferrable capital rather than a fixed obligation — so the
        // headline "a council can move $12.2M" was understating the answer by
        // more than half again, on the page's own evidence. Rather than move the
        // row (deferring a road project is not the same decision as reducing an
        // operating budget), both figures are stated, and the wider one is not
        // buried in a note.
        const deferrable = P.tiers.filter((t) => t.deferrable).reduce((a, t) => a + tierAmt(t), 0);
        const withDeferrable = reachable + deferrable;

        const first = r.rows[0];
        const last = r.rows[r.rows.length - 1];
        // The reachable pool grows with the rest of spending, so the final-year
        // comparison is against a grown pool rather than today's.
        const reachableLast = reachable * (last.expenditures / first.expenditures);
        const shareOf = (gap, pool) => (pool > 0 ? Math.min(1, Math.abs(gap) / pool) : 0);

        const segs = P.tiers
          .map(
            (t) => `
            <span class="proj-seg proj-seg-${esc(t.key)}" style="width:${((tierAmt(t) / total) * 100).toFixed(3)}%"
                  title="${esc(t.label)} — ${esc(usd0(tierAmt(t)))}"></span>`
          )
          .join("");

        const rows = P.tiers
          .map(
            (t) => `
          <tr>
            <th scope="row"><span class="proj-key proj-seg-${esc(t.key)}" aria-hidden="true"></span>${esc(t.label)}
              <span class="proj-li-note">${esc(t.note || t.confirm || "")}</span>
              ${confirmTag(t)}
            </th>
            <td class="num">${esc(usd0(tierAmt(t)))}</td>
            <td class="num">${((tierAmt(t) / total) * 100).toFixed(0)}%</td>
            <td>${esc(t.flex || "")}</td>
          </tr>`
          )
          .join("");

        const gapWord = first.gap < 0 ? "gap" : "surplus";

        poolEl.innerHTML = `
          <div class="proj-pool">
            <div class="proj-pool-head">
              <h3 class="proj-sub-h2">How the General Fund is currently allocated</h3>
              <p>${esc(P.total_label)}: <strong>${esc(usd0(total))}</strong>${edited ? " (scaled to your edited baseline)" : ""}.
                 Take out what is contracted and what is restricted by law, and
                 <strong>${esc(usd0(reachable))}</strong> is more flexible${
                   deferrable > 0
                     ? ` — or <strong>${esc(usd0(withDeferrable))}</strong> counting the
                         ${esc(usd0(deferrable))} of transfers and planned capital, which the line items
                         suggest is mostly deferrable`
                     : ""
                 }. Flexible is not discretionary: it pays for ongoing services and the people who deliver
                 them.</p>
            </div>

            <div class="proj-pool-bar" role="img"
                 aria-label="${esc(`Of ${usd0(total)} in General Fund appropriations, ${P.tiers.map((t) => `${usd0(tierAmt(t))} is ${t.label.toLowerCase()}`).join(", ")}, leaving ${usd0(reachable)} reachable.`)}">
              ${segs}<span class="proj-seg proj-seg-reach" style="width:${((reachable / total) * 100).toFixed(3)}%"></span>
            </div>
            <div class="legend">
              ${P.tiers.map((t) => `<span class="lg"><i class="sw proj-seg-${esc(t.key)}"></i>${esc(t.label)}</span>`).join("")}
              <span class="lg"><i class="sw proj-seg-reach"></i>${esc(P.reachable_label)}</span>
            </div>

            <div class="tablewrap">
              <table class="data">
                <thead><tr><th scope="col">Part of the General Fund</th><th scope="col" class="num">FY2026–27</th><th scope="col" class="num">Share</th><th scope="col">How flexible is it?</th></tr></thead>
                <tbody>
                  ${rows}
                  <tr class="is-total">
                    <th scope="row"><span class="proj-key proj-seg-reach" aria-hidden="true"></span>${esc(P.reachable_label)}
                      <span class="proj-li-note">${esc(P.reachable_note)}</span></th>
                    <td class="num">${esc(usd0(reachable))}</td>
                    <td class="num">${((reachable / total) * 100).toFixed(0)}%</td>
                    <td>${esc(P.reachable_flex || "")}</td>
                  </tr>
                  ${
                    deferrable > 0
                      ? `<tr class="is-total">
                           <th scope="row">${esc(P.deferrable_label)}
                             <span class="proj-li-note">${esc(P.deferrable_note)}</span></th>
                           <td class="num">${esc(usd0(withDeferrable))}</td>
                           <td class="num">${((withDeferrable / total) * 100).toFixed(0)}%</td>
                           <td>Depends on which projects are already committed</td>
                         </tr>`
                      : ""
                  }
                </tbody>
              </table>
            </div>

            ${
              first.gap < 0 || last.gap < 0
                ? `<div class="proj-against">
                     <p class="proj-against-head">This scenario's projected gap, for scale</p>
                     <ul>
                       <li><strong>${esc(first.label)}:</strong> ${esc(usd0(Math.abs(first.gap)))} — equivalent to
                         <strong>${(shareOf(first.gap, reachable) * 100).toFixed(0)}%</strong> of the flexible money.</li>
                       <li><strong>${esc(last.label)}:</strong> ${esc(usd0(Math.abs(last.gap)))} against about
                         ${esc(usd0(reachableLast))} by then — <strong>${(shareOf(last.gap, reachableLast) * 100).toFixed(0)}%</strong>.</li>
                     </ul>
                     <p class="proj-input-note">A comparison of sizes, not a claim about what would be
                       reduced: a council could defer capital, find other revenue, or draw reserves
                       instead.</p>
                   </div>`
                : `<p class="proj-against-none">This scenario projects a surplus in both ${esc(first.label)} and ${esc(last.label)},
                     so on these assumptions nothing would have to come out of it in either year.</p>`
            }
            ${orderHtml(state.config.exposure.order, r, scale)}
            <p class="proj-input-note">${esc(P.method_note)}
              <a href="budget.html#next-year">Open the FY2026–27 budget <span aria-hidden="true">→</span></a></p>
          </div>`;

        // "What the gap is the size of" used to hang here, sizing the gap
        // against a wage lift, the 28 positions and a school speed table.
        // Those are three of the figures in the earmarked list a screen above,
        // from the same work session — the same numbers, twice, as two card
        // grids. The earmarked list keeps them, because there they are the
        // city saying what the money was for rather than arithmetic about it.
      }

      /* The department chart stood here: every General Fund department as a bar,
         coloured by tier, with the gap drawn across them. It was cut. Its top
         four bars were the first four rows of the pool table directly above it,
         at the same figures and the same colours, and its own caption then had
         to explain that none of those four was available. Below them fourteen
         departments rendered as identical stubs. What it showed that the table
         did not — that the reachable money is many small pots rather than one —
         is carried by the four steps below, which is the better answer to "so
         which bits" anyway. The department figures are still in the config
         under exposure.pool.departments if it is ever wanted back.
         --------------------------------------------------------------------- */

      /* ======================================================================
         What the flexible money is made of

         This was "What gets cut first": the same four categories, but drawn as
         a ladder with the scenario's gap walked down it, rung by rung, until it
         stopped somewhere inside payroll. The review was right that it was the
         least supportable thing on the page, and for a reason worth recording
         so it is not reintroduced.

         The ordering itself is defensible — it is how quickly each kind of
         spending can be changed inside a fiscal year, which is a mechanical
         fact and not a ranking of importance. What was not defensible was the
         walk. Consuming each rung completely before touching the next asserts a
         sequence no council has adopted, and no council would actually follow:
         a real reduction takes a little from several places at once, and this
         one might take none of it at all — the same gap could be met by
         deferring capital, by other revenue, or by reserves. The bar drew a
         decision, and the page has no standing to draw one.

         The arithmetic at the end was worse. "The gap reaches 33% of it",
         pointed at a bar labelled People, invited exactly one reading: a third
         of the staff. What the figure actually measured was the remainder as a
         share of a modelled personnel cost, which is not a headcount, not a
         payroll reduction, and not a thing anyone had proposed.

         So the composition stays and the walk is gone. The four figures still
         answer the question worth answering — that the flexible pool is mostly
         payroll, so no statement about it is really a statement about mowing —
         and the maintenance accounts underneath stay untouched, because those
         are not a projection at all. They are what the last adopted budget
         already did, account by account, out of the city's own budget book.
         ====================================================================== */
      function orderHtml(O, r, scale) {
        if (!O || !O.rungs) return "";
        const parts = O.rungs.map((x) => ({ ...x, amount: x.amount * scale }));
        const total = parts.reduce((a, x) => a + x.amount, 0);
        const staff = parts[parts.length - 1];
        const first = r.rows[0];

        const segs = parts
          .map(
            (x) => `
            <span class="proj-rung proj-rung-${esc(x.key)}" style="width:${((x.amount / total) * 100).toFixed(3)}%"
                  title="${esc(x.label)} — ${esc(usd0(x.amount))}"></span>`
          )
          .join("");

        const cards = parts
          .map(
            (x) => `
            <li class="proj-rung-card">
              <p class="proj-rung-ord"><span class="proj-rung-key proj-rung-${esc(x.key)}" aria-hidden="true"></span>
                ${((x.amount / total) * 100).toFixed(0)}% of the flexible pool</p>
              <h4>${esc(x.label)}</h4>
              <p class="proj-rung-amt mono">${esc(usd0(x.amount))}</p>
              <p class="proj-rung-what">${esc(x.what)}</p>
              <p class="proj-rung-why"><strong>How quickly it could change.</strong> ${esc(x.why)}</p>
              ${x.lines ? maintTable(x) : ""}
            </li>`
          )
          .join("");

        // The bar and the one-paragraph finding stay in the open; the four
        // detail cards go behind a click. The finding is that the flexible pool
        // is mostly payroll, and the bar plus one sentence carries it — the
        // cards restate the same four figures with a paragraph each, which is
        // reference material rather than the point.
        return `
          <div class="proj-order">
            <h3 class="proj-sub-h2">${esc(O.heading)}</h3>
            <p class="proj-ear-lede">${esc(O.lede)}</p>

            <div class="proj-rung-bar" role="img"
                 aria-label="${esc(`What the flexible operating pool of ${usd0(total)} is made of: ${parts.map((x) => `${x.label} ${usd0(x.amount)}`).join(", ")}.`)}">${segs}</div>
            <div class="legend">
              ${parts.map((x) => `<span class="lg"><i class="sw proj-rung-${esc(x.key)}"></i>${esc(x.label)}</span>`).join("")}
            </div>

            <p class="proj-punch">${scaleHtml(parts, total, staff, first)}</p>

            ${panel("The four categories in detail", "What each one buys, how quickly it could change, and what the last budget already did to maintenance", `
              <ol class="proj-rung-list">${cards}</ol>
              <p>${esc(O.basis)}</p>
              <p class="src"><strong>Needs confirming.</strong> ${esc(O.confirm)}</p>
            `, false, "p-categories")}

            <p class="note-fine"><strong>A composition, not a plan.</strong> ${esc(O.caveat)}</p>
          </div>`;
      }

      /* The paragraph under the composition bar.

         It used to walk the gap down the four rungs and report where it landed.
         It now states two things and stops: what the pool is made of, and — only
         when there is a gap to compare — the comparison of sizes, with the
         reading it must not be given ruled out in the same breath rather than in
         a footnote below it. "Equivalent to 33% of the personnel cost" and "33%
         of the staff" are different claims, and only the first is one this page
         can make. */

      function scaleHtml(parts, total, staff, first) {
        const nonStaff = total - staff.amount;
        const share = (staff.amount / total) * 100;

        const composition =
          `The flexible pool of <strong>${esc(usd0(total))}</strong> is
           <strong>${esc(share.toFixed(0))}%</strong> personnel. Everything else in it — maintenance,
           equipment and fleet contribution — comes to ${esc(usd0(nonStaff))}.`;

        if (first.gap >= 0)
          return `${composition} ${esc(first.label)} projects a surplus here, so there is nothing to set
                  against it.`;

        const gap = Math.abs(first.gap);
        const over = gap - nonStaff;

        return (
          composition +
          ` For scale, this scenario's projected ${esc(first.label)} gap of
            <strong>${esc(usd0(gap))}</strong> is ` +
          (over > 0
            ? `larger than that non-personnel total; the excess is equivalent to
               <strong>${esc(((over / staff.amount) * 100).toFixed(0))}%</strong> of the modelled personnel
               cost — a ratio between two dollar figures, not a share of staff or payroll that anyone has
               proposed reducing.`
            : `smaller than it, so the size of the gap alone implies nothing about staffing.`)
        );
      }

      /* The named maintenance accounts. The claim they support is one number
         each — maintenance in the reachable departments came down 40% between
         what the city estimated FY2025 would finish at and what it then
         adopted, and the road accounts moved the same way — so that is what
         shows, and the twenty accounts behind it sit one click away rather
         than as two full tables inside a card that is already the longest
         thing in the section.

         Two money columns, not three. The change is computed from the FY2025
         estimate against the adopted figure; the FY2024 actual was background
         and cost a column in both tables. It was also the source of a real
         bug once — an earlier version read it and labelled it "FY2025–26
         adopted", so City Wide Trees showed $195,300 against an adopted
         $11,943. The columns are mapped explicitly here for that reason. */
      function maintTable(x) {
        const pct = (a, b) => (b ? `${a / b - 1 >= 0 ? "+" : MINUS}${Math.abs((a / b - 1) * 100).toFixed(0)}%` : "—");

        const body = (rows) =>
          rows
            .map(
              (l) => `
              <tr>
                <th scope="row">${esc(l.name)}<span class="pl-d">${esc(l.dept)} · ${esc(l.account)}</span></th>
                <td class="num">${esc(usd0(l.fy25e))}</td>
                <td class="num">${esc(usd0(l.adopted))}</td>
                <td class="num ${l.fy25e && l.adopted < l.fy25e ? "is-down" : ""}">${esc(pct(l.adopted, l.fy25e))}</td>
              </tr>`
            )
            .join("");

        const foot = (t, label) => `
          <tr class="is-total">
            <th scope="row">${esc(label)}</th>
            <td class="num">${esc(usd0(t.fy25e))}</td>
            <td class="num">${esc(usd0(t.adopted))}</td>
            <td class="num ${t.adopted < t.fy25e ? "is-down" : ""}">${esc(pct(t.adopted, t.fy25e))}</td>
          </tr>`;

        const table = (rows, total, label) => `
          <div class="tablewrap">
            <table class="data proj-maint">
              <thead>
                <tr>
                  <th scope="col">Account</th>
                  <th scope="col" class="num">FY2025 est. actual</th>
                  <th scope="col" class="num">FY2025–26 adopted</th>
                  <th scope="col" class="num">Change</th>
                </tr>
              </thead>
              <tbody>${body(rows)}${foot(total, label)}</tbody>
            </table>
          </div>`;

        // The headline each table exists to support, stated without the table.
        const head = (t, what) => `
          <li>
            <span class="pm-what">${esc(what)}</span>
            <span class="pm-move">${esc(usd0(t.fy25e))} <span class="pm-to" aria-hidden="true">→</span>
              <span class="sr-only">to</span> ${esc(usd0(t.adopted))}</span>
            <b class="${t.adopted < t.fy25e ? "is-down" : ""}">${esc(pct(t.adopted, t.fy25e))}</b>
          </li>`;

        const count = x.lines.length + x.road_lines.length;

        // These two figures are a *sample* of the category above them, and
        // without saying so they read as the category itself: "Maintenance in
        // the departments a council can reach — $679,165" sitting directly
        // under a heading of $4,015,444 is two different numbers for the same
        // words in the same card. So each headline names its account count, the
        // note states the relationship, and the road figure says on its face
        // that it is outside the category rather than only in the fine print.
        return `
          <p class="proj-maint-note">What the last adopted budget actually did to maintenance — a record,
            not a projection. ${esc(numWord(x.lines.length).replace(/^./, (ch) => ch.toUpperCase()))} named
            accounts inside this category, and ${esc(numWord(x.road_lines.length))} more in Streets &amp;
            Roads that sit outside it.</p>
          <ul class="proj-maint-heads">
            ${head(x.lines_total, "Inside this category")}
            ${head(x.road_total, "Streets & Roads — outside it")}
          </ul>
          ${finePrint(`All ${numWord(count)} accounts, as the budget book prints them`, `
            <p>${esc(x.lines_note)}</p>
            ${table(x.lines, x.lines_total, "Reachable departments")}
            <p>${esc(x.road_note)}</p>
            ${table(x.road_lines, x.road_total, "Streets & Roads")}
            <p>${esc(x.already_note)}</p>
          `)}`;
      }

      /* --------------------------------------------------------------- panel */

      function panel(title, sub, bodyHtml, open, id, attrs) {
        return `
        <details class="panel"${id ? ` id="${id}"` : ""}${open ? " open" : ""}${attrs || ""}>
          <summary>
            <span class="panel-tt">
              <h3>${esc(title)}</h3>
              <span>${esc(sub)}</span>
            </span>
            <span class="panel-chev" aria-hidden="true"></span>
          </summary>
          <div class="panel-body">${bodyHtml}</div>
        </details>`;
      }

      function finePrint(label, bodyHtml) {
        return `
        <details class="fine">
          <summary>${esc(label)}</summary>
          <div class="fine-body">${bodyHtml}</div>
        </details>`;
      }

      /* ------------------------------------------------------------- sources */

      function sourcesHtml(c) {
        const items = (c.sources || [])
          .map((s) => {
            const title = s.url
              ? `<a href="${esc(s.url)}" rel="nofollow noopener">${esc(s.title)} <span aria-hidden="true">↗</span></a>`
              : s.meeting != null
                ? `<a href="meetings.html?id=${encodeURIComponent(s.meeting)}">${esc(s.title)} <span aria-hidden="true">→</span></a>`
                : esc(s.title);
            return `
              <li>
                <b>${title}</b>
                <span class="proj-src-meta">${esc(s.publisher || "")}${s.date ? " · " + esc(CT.fmtDate(s.date)) : ""}</span>
                <span class="proj-li-note">${esc(s.note || "")}</span>
              </li>`;
          })
          .join("");

        // Fifteen full citations, each with a paragraph of note, ran to about
        // three screens of the page's tail and pushed the disclaimer — the last
        // thing a reader should see — well below it. The list is reference
        // material: it is there to be checked, not read through, so it collapses
        // to a single row. The section head above it stays, because it carries
        // the 05 in the page's numbering and it is what the jump list targets.
        const count = (c.sources || []).length;

        return `
          <section class="tax-sec reveal" style="--i:5" id="s-sources" aria-labelledby="src-title">
            <div class="sec-head">
              <p class="eyebrow"><span class="sec-num" aria-hidden="true">05</span>Sources</p>
              <h2 class="sec-h2" id="src-title">Where every figure comes from</h2>
              <p class="sec-sub">City documents, the city's own line items, and recordings of open meetings.
                Nothing here comes from anywhere else.</p>
            </div>
            ${panel(
              `All ${numWord(count)} sources`,
              "Every document and recording behind a figure on this page",
              `<ul class="proj-sources">${items}</ul>`,
              false,
              "p-sources",
              " data-nav-open"
            )}
          </section>`;
      }

      function disclaimerHtml(c) {
        return `
          <aside class="proj-disclaimer reveal" style="--i:6" aria-label="Disclaimer">
            <p class="proj-disclaimer-head">Planning estimates, not an adopted budget</p>
            <p>${esc(c.disclaimer)}</p>
          </aside>`;
      }
    </script>
  </body>
</html>
