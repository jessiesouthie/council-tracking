name: Weekly ingest

# Pulls newly-published Eagle Mountain council minutes, parses them, and
# updates docs/data.json so GitHub Pages serves a fresh dataset.
#
# Runs Mondays at 12:00 UTC (6am Mountain) and can also be kicked off manually.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ingest
      cancel-in-progress: false

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ingest/requirements.txt

      - name: Crawl new minutes
        run: python -m ingest.crawl --all-bodies

      - name: Rebuild dataset
        run: python -m ingest.build_dataset --all-bodies

      - name: Publish transcripts
        run: python -m ingest.build_transcripts

      # The homepage's "next meeting" card. Monday morning is the right slot for
      # it: agendas for a Tuesday meeting are posted the week before, so this run
      # picks up the session times a resident needs before the meeting happens.
      #
      # Non-fatal: if the portal's calendar endpoint is down this week, the rest
      # of the ingest should still publish. The site keeps showing the meetings
      # from the last good run and hides the card once they're past.
      - name: Refresh the meeting calendar
        run: python -m ingest.build_upcoming
        continue-on-error: true

      - name: Rebuild agent corpus
        run: python -m ingest.build_agent_corpus --all-bodies

      # Both of these read docs/data.json, so they have to run after the dataset
      # rebuild and before the commit. The prerendered copy is what a crawler
      # that runs no JavaScript reads; if it isn't refreshed here it silently
      # describes last week's record while the live page shows this week's.
      - name: Refresh the prerendered record
        run: python -m ingest.build_prerender

      - name: Rebuild the sitemap
        run: python -m ingest.build_sitemap

      - name: Commit changes
        run: |
          git config user.name  "council-bot"
          git config user.email "council-bot@users.noreply.github.com"
          git add data/raw data/parsed data/transcripts docs/data.json docs/data.*.json docs/bodies.json docs/transcripts docs/agent-corpus.json
          # The pages the prerender writes into, plus what build_sitemap emits.
          git add docs/meetings.html docs/members.html docs/motions.html docs/sitemap.xml docs/robots.txt
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          stamp=$(date -u +"%Y-%m-%d")
          git commit -m "data: weekly ingest ${stamp}"
          git push
