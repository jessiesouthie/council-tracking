name: Weekly ingest

# Pulls newly-published Eagle Mountain council minutes, parses them, and
# updates docs/data.json so GitHub Pages serves a fresh dataset.
#
# Runs Mondays at 12:00 UTC (6am Mountain) and can also be kicked off manually.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ingest
      cancel-in-progress: false

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ingest/requirements.txt

      - name: Crawl new minutes
        run: python -m ingest.crawl --all-bodies

      - name: Rebuild dataset
        run: python -m ingest.build_dataset --all-bodies

      - name: Publish transcripts
        run: python -m ingest.build_transcripts

      - name: Commit changes
        run: |
          git config user.name  "council-bot"
          git config user.email "council-bot@users.noreply.github.com"
          git add data/raw data/parsed data/transcripts docs/data.json docs/data.*.json docs/bodies.json docs/transcripts
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          stamp=$(date -u +"%Y-%m-%d")
          git commit -m "data: weekly ingest ${stamp}"
          git push
