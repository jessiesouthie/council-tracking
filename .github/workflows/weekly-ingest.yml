name: Weekly ingest

# Pulls newly-published Eagle Mountain council minutes, parses them, and
# updates docs/data.json so GitHub Pages serves a fresh dataset.
#
# Runs Mondays at 12:00 UTC (6am Mountain) and can also be kicked off manually.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ingest
      cancel-in-progress: false

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ingest/requirements.txt

      - name: Crawl new minutes
        run: python -m ingest.crawl --all-bodies

      - name: Rebuild dataset
        run: python -m ingest.build_dataset --all-bodies

      - name: Publish transcripts
        run: python -m ingest.build_transcripts

      # The homepage's "next meeting" card. Monday morning is the right slot for
      # it: agendas for a Tuesday meeting are posted the week before, so this run
      # picks up the session times a resident needs before the meeting happens.
      #
      # Non-fatal: if the portal's calendar endpoint is down this week, the rest
      # of the ingest should still publish. The site keeps showing the meetings
      # from the last good run and hides the card once they're past.
      - name: Refresh the meeting calendar
        run: python -m ingest.build_upcoming
        continue-on-error: true

      # The meetings that were held and noticed but never minuted or recorded —
      # special sessions, joint work sessions, planning conferences. Runs after
      # the dataset and transcript builds because it reads both to decide which
      # meetings still have nothing but an agenda to show for them.
      #
      # Non-fatal for the same reason as the calendar above: it talks to the same
      # portal, and a bad week there shouldn't hold up the rest of the ingest.
      - name: Refresh the agenda-only meetings
        run: python -m ingest.build_agenda_only
        continue-on-error: true

      - name: Rebuild agent corpus
        run: python -m ingest.build_agent_corpus --all-bodies

      # These three read docs/data.json — and build_meeting_pages also reads
      # docs/transcripts — so they run after the dataset and transcript steps and
      # before the commit. They're ordered: the meeting pages have to exist
      # before build_sitemap reads the directory to list them.
      #
      # Skipping any of them leaves the site quietly describing last week: the
      # generated pages and the prerendered index are what a crawler that runs no
      # JavaScript reads, and nothing else refreshes them.
      # The nav is spliced into every page from one definition in ingest/nav.py.
      # This doesn't rewrite it here — the ingest run has no reason to change
      # it — but it fails the run if someone hand-edited one of the copies and
      # didn't re-splice, which is how the four copies drifted apart before.
      - name: Check the nav is in sync
        run: python -m ingest.build_nav --check

      - name: Write the per-meeting pages
        run: python -m ingest.build_meeting_pages --prune

      - name: Refresh the prerendered record
        run: python -m ingest.build_prerender

      - name: Rebuild the sitemap
        run: python -m ingest.build_sitemap

      - name: Commit changes
        run: |
          git config user.name  "council-bot"
          git config user.email "council-bot@users.noreply.github.com"
          git add data/raw data/parsed data/transcripts docs/data.json docs/data.*.json docs/bodies.json docs/transcripts docs/agent-corpus.json
          # The pages the prerender writes into, the generated per-meeting pages,
          # and what build_sitemap emits. -A on docs/meetings so a pruned page is
          # staged as a deletion rather than left behind in the tree.
          git add docs/meetings.html docs/members.html docs/motions.html docs/sitemap.xml docs/robots.txt
          git add -A docs/meetings
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          stamp=$(date -u +"%Y-%m-%d")
          git commit -m "data: weekly ingest ${stamp}"
          git push
